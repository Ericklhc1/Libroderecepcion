name: Finalize equipo identity
on:
  push:
    branches: [fix/equipo-usuarios-horas-20261001]
    paths: [.github/workflows/_equipo-identity-followup.yml]
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/equipo-usuarios-horas-20261001
      - name: Apply focused identity corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          def edit(file, old, new, count=1):
              p = Path(file); text = p.read_text()
              if text.count(old) != count:
                  raise RuntimeError(f'{file}: expected {count}, got {text.count(old)} for {old[:100]}')
              p.write_text(text.replace(old, new))
          service = 'src/server/services/schedules.ts'
          for identity in ['input.collaboratorId', 'collaboratorId']:
              old = 'where: { id: ' + identity + ', user: { is: scheduleEligibleUser }, memberships: { some: { departmentId: plan.departmentId, active: true } } } });'
              new = 'where: { id: ' + identity + ', user: { is: scheduleEligibleUser }, memberships: { some: { departmentId: plan.departmentId, active: true } } }, include: { user: { select: { role: { select: { name: true } } } } } });'
              edit(service, old, new)
          edit(service, 'functionName: person.functionName', 'functionName: person.user!.role.name', 3)
          # User is the only active-state authority; validate membership/overlaps here.
          # Builders enforce live user eligibility; cancellation of inactive users remains possible.
          edit(service, '!person.active || !person.memberships.some', '!person.userId || !person.memberships.some')
          file = 'src/server/services/schedule-import.ts'
          edit(file, "import { assertScheduleArea } from './schedule-access';", "import { assertScheduleArea } from './schedule-access';\nimport { ensureScheduleUsers, scheduleEligibleUser, scheduleIdentitySelect, schedulePerson } from './schedule-users';")
          edit(file, "  const fileHash = createHash", "  await ensureScheduleUsers(user, plan.departmentId);\n  const fileHash = createHash")
          edit(file, "  const people = await prisma.scheduleCollaborator.findMany({ where: { active: true, memberships: { some: { departmentId: plan.departmentId, active: true } } } });", "  const people = await prisma.scheduleCollaborator.findMany({ where: { user: { is: scheduleEligibleUser }, memberships: { some: { departmentId: plan.departmentId, active: true } } } }, include: { user: { select: scheduleIdentitySelect } } }).then((rows) => rows.map(schedulePerson));")
          edit(file, 'Colaborador no reconocido o nombre ambiguo. Regístralo con su código antes de cargar.', 'Usuario no reconocido o nombre ambiguo. Revisa la cuenta existente y su área; no crees otra persona.')
          # Permit re-review after a user's name/area changes, without duplicating applied files.
          edit(file, "OR: [{ baseVersion: plan.version }, { status: 'APLICADO' }]", "status: 'APLICADO'")
          edit(file, 'issues }, update: {} });', 'issues }, update: { rows: JSON.parse(JSON.stringify(resolved)), issues } });')
          # Make the public hours contract reject ambiguous obsolete units/fields.
          file = 'src/server/services/schedule-catalog.ts'
          edit(file, "  assertSchedulePermission(user, 'schedule.catalog.manage'); const input = collaboratorSchema.parse(raw);", "  assertSchedulePermission(user, 'schedule.catalog.manage');\n  if (raw && typeof raw === 'object' && ['weeklyMinutes', 'minRestMinutes'].some((key) => key in raw)) throw new RuleError('Usa horas semanales. Los minutos y el descanso no se configuran en este módulo.');\n  const input = collaboratorSchema.parse(raw);")
          tests = 'tests/schedules.test.ts'
          p = Path(tests); text = p.read_text(); at = text.rfind('\n});'); assert at >= 0
          text = text[:at] + '''
            it('usa el rol actual en asignaciones nuevas sin reescribir el historial', async () => {
              await add(); const original = await slot();
              await prisma.user.update({ where: { id: own.id }, data: { roleId: reader.roleId } });
              await add(a, '2090-10-05');
              const currentRole = await prisma.role.findUniqueOrThrow({ where: { id: reader.roleId } });
              expect((await slot(a, '2090-10-05')).functionName).toBe(currentRole.name);
              expect((await slot()).functionName).toBe(original.functionName);
            });
            it('la carga relee el nombre vigente del usuario sin alta duplicada', async () => {
              const bytes = new TextEncoder().encode('ID_COLABORADOR;FECHA;CODIGO;INICIO;TERMINO\\nTEST_COL001;2090-10-05;TEST_DIA;08:00;19:00\\n');
              await prisma.user.update({ where: { id: own.id }, data: { name: 'Nombre actual para carga' } });
              const reviewed = await reviewScheduleImport(admin, planId, 'malla.csv', bytes);
              expect(reviewed.issues).toEqual([]);
              await prisma.user.update({ where: { id: own.id }, data: { active: false } });
              const again = await reviewScheduleImport(admin, planId, 'malla.csv', bytes);
              expect(again.id).toBe(reviewed.id);
              expect(JSON.stringify(again.issues)).toContain('Usuario no reconocido');
              await expect(applyScheduleImport(admin, await mutation(), again.id)).rejects.toThrow('observaciones');
            });
            it('rechaza unidades y controles antiguos en la entrada de planificación', async () => {
              await expect(saveScheduleCollaborator(admin, { userId: own.id, departmentIds: [area], weeklyMinutes: 2520 })).rejects.toThrow('horas semanales');
              await expect(saveScheduleCollaborator(admin, { userId: own.id, departmentIds: [area], minRestMinutes: 720 })).rejects.toThrow('descanso');
            });
          ''' + text[at:]; p.write_text(text)
          PY
          git diff --check
          rm .github/workflows/_equipo-identity-followup.yml
          git add src tests .github/workflows/_equipo-identity-followup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(equipo): canonical role and live user validation for roster imports"
          git push origin HEAD:refs/heads/fix/equipo-usuarios-horas-20261001
