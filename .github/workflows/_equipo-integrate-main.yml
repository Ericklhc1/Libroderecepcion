name: Integrate equipo with current main
on:
  push:
    branches: [fix/equipo-usuarios-horas-20261001]
    paths: [.github/workflows/_equipo-integrate-main.yml]
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/equipo-usuarios-horas-20261001
          fetch-depth: 0
      - name: Merge verified upstream while preserving both histories
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "2e073c68768569e487f7206e8f7b4130ae01a644"
          git merge --no-commit --no-ff origin/main || true
          python - <<'PY'
          from pathlib import Path
          import subprocess, json
          def git(*args): return subprocess.check_output(['git', *args], text=True)
          assert Path('.git/MERGE_HEAD').exists(), 'Expected an explicit merge; abort otherwise'
          conflicts = set(git('diff', '--name-only', '--diff-filter=U').splitlines())
          allowed = {'PROJECT_CONTEXT.md', 'docs/AGENT_HANDOFF.md'}
          assert conflicts <= allowed, f'Unexpected conflicts: {conflicts - allowed}'
          marker = '## 01/10/2026 · AROH 1.41.1 · Usuarios y horas en Equipo'
          for file in allowed:
              ours = git('show', f'HEAD:{file}')
              assert ours.count(marker) == 1
              a = ours.index(marker); b = ours.index('\n## ', a + len(marker))
              note = ours[a:b].strip().replace('AROH 1.41.1 · Usuarios y horas en Equipo', 'AROH 1.41.2 · Usuarios y horas en Equipo')
              theirs = git('show', f'origin/main:{file}'); first = theirs.index('\n') + 1
              Path(file).write_text(theirs[:first] + '\n' + note + '\n\n' + theirs[first:])
          old, new = '1.41.1', '1.41.2'
          for file in ['package.json', 'package-lock.json']:
              p = Path(file); text = p.read_text(); data = json.loads(text); assert data['version'] == old
              count = 1 if file == 'package.json' else 2
              text = text.replace(f'"version": "{old}"', f'"version": "{new}"', count)
              data = json.loads(text); assert data['version'] == new
              if file == 'package-lock.json': assert data['packages']['']['version'] == new
              p.write_text(text)
          p = Path('docs/EQUIPO_HORARIOS.md'); p.write_text(p.read_text().replace('1.41.1', '1.41.2'))
          PY
          rm .github/workflows/_equipo-integrate-main.yml
          git add PROJECT_CONTEXT.md docs/AGENT_HANDOFF.md docs/EQUIPO_HORARIOS.md package.json package-lock.json .github/workflows/_equipo-integrate-main.yml
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          git commit -m "merge: preserve sidebar release and prepare equipo 1.41.2"
          git push origin HEAD:refs/heads/fix/equipo-usuarios-horas-20261001
