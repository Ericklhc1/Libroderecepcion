name: Respaldo Vercel Production

on:
  workflow_run:
    workflows: ["Compuerta"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  backup:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Código verificado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Esperar a que Vercel sirva este commit
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          PRODUCTION_URL: https://libroderecepcion.vercel.app
        run: |
          ok=0
          for attempt in $(seq 1 60); do
            body=$(curl -fsSL "$PRODUCTION_URL/api/health/version" 2>/dev/null || true)
            commit=$(printf '%s' "$body" | jq -r '.commit // empty' 2>/dev/null || true)
            provider=$(printf '%s' "$body" | jq -r '.provider // empty' 2>/dev/null || true)

            if [ "$provider" = "vercel" ] && [ "$commit" = "$EXPECTED_SHA" ]; then
              ok=1
              break
            fi

            sleep 10
          done

          if [ "$ok" != "1" ]; then
            echo "Vercel Production no llegó al commit esperado; no se crea respaldo."
            exit 1
          fi

      - name: Smoke de Production
        env:
          PRODUCTION_URL: https://libroderecepcion.vercel.app
        run: |
          code=$(curl -sS -L -o /tmp/login.html -w "%{http_code}" "$PRODUCTION_URL/login")
          test "$code" = "200"
          grep -q "Iniciar sesión" /tmp/login.html

      - name: Crear respaldo recuperable
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tag="production-$(date -u +'%Y%m%d-%H%M%S')"
          git tag -a "$tag" "$SHA" -m "Vercel Production verificado en $SHA"
          git push origin "$tag"

          echo "Respaldo creado: $tag"
