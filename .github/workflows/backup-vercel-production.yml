name: Release Vercel Production

on:
  workflow_run:
    workflows: ["Compuerta"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Código verificado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Esperar y verificar Vercel Production
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          PRODUCTION_URL: https://libroderecepcion.vercel.app
        run: |
          expected_version=$(node -p "require('./package.json').version")
          ok=0

          for attempt in $(seq 1 60); do
            body=$(curl -fsSL "$PRODUCTION_URL/api/health/version" 2>/dev/null || true)
            commit=$(printf '%s' "$body" | jq -r '.commit // empty' 2>/dev/null || true)
            provider=$(printf '%s' "$body" | jq -r '.provider // empty' 2>/dev/null || true)
            version=$(printf '%s' "$body" | jq -r '.version // empty' 2>/dev/null || true)

            if [ "$provider" = "vercel" ] && [ "$commit" = "$EXPECTED_SHA" ] && [ "$version" = "$expected_version" ]; then
              ok=1
              break
            fi

            sleep 10
          done

          if [ "$ok" != "1" ]; then
            echo "Vercel Production no sirve el SHA y versión esperados; no se crea release."
            exit 1
          fi

      - name: Smoke de Production
        env:
          PRODUCTION_URL: https://libroderecepcion.vercel.app
        run: |
          code=$(curl -sS -L -o /tmp/login.html -w "%{http_code}" "$PRODUCTION_URL/login")
          test "$code" = "200"
          grep -q "Iniciar sesión" /tmp/login.html

      - name: Crear tag de versión
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "El tag $tag ya existe. Cada Production debe tener una versión única."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$SHA" -m "Libro Operativo $tag — Vercel Production verificado"
          git push origin "$tag"

          echo "Release verificado: $tag"
