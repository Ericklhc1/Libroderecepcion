# Bootstrap ÚNICO de la base de datos de staging.
#
# POR QUÉ EXISTE. El contenedor del agente no tiene salida TCP al puerto 5432 y
# el endpoint de Neon queda fuera de su política de egreso, así que las
# migraciones no se pueden aplicar desde allí. Este runner sí tiene red y
# ejecuta Prisma —nunca SQL a mano— para que `_prisma_migrations` quede correcto.
#
# POR QUÉ SE DISPARA CON UN PUSH Y NO CON workflow_dispatch. Un workflow de
# despacho manual sólo es lanzable si el archivo existe en la rama por defecto,
# y `main` alimenta Vercel Production: no se toca para habilitar una herramienta
# temporal. Este archivo vive únicamente en `preproduction`, y el merge del PR
# que lo introduce es su única ejecución normal.
#
# NO ES PARTE DEL BUILD. El seed no debe correr jamás en el build de Netlify ni
# en el de Vercel.
#
# RETIRADA. Tras una ejecución satisfactoria, un PR aparte hacia `preproduction`
# elimina este archivo. No se promueve a `main`.

name: Bootstrap Staging (único)

on:
  push:
    branches: [preproduction]
    paths:
      - '.github/workflows/bootstrap-staging.yml'

permissions:
  contents: read

concurrency:
  group: bootstrap-staging
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Migrar y sembrar staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging

    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      DIRECT_DATABASE_URL: ${{ secrets.STAGING_DIRECT_DATABASE_URL }}
      SEED_DEMO_PASSWORD: ${{ secrets.SEED_DEMO_PASSWORD }}
      STAGING_DB_HOST_STEM: ${{ vars.STAGING_DB_HOST_STEM }}
      # Identidad esperada de la base de staging. No son credenciales.
      EXPECTED_DATABASE: libro_staging
      EXPECTED_ROLE: libro_staging_owner

    steps:
      - name: Enmascarar secretos en el registro
        run: |
          echo "::add-mask::${{ secrets.SEED_DEMO_PASSWORD }}"
          echo "::add-mask::${{ secrets.STAGING_DATABASE_URL }}"
          echo "::add-mask::${{ secrets.STAGING_DIRECT_DATABASE_URL }}"

      - name: Exigir rama preproduction
        run: |
          if [ "${{ github.ref }}" != "refs/heads/preproduction" ]; then
            echo "FALLO: este workflow sólo corre desde preproduction."
            exit 1
          fi
          echo "PASS: rama preproduction."

      - name: Exigir secretos y variable de entorno
        run: |
          fallo=0
          [ -n "$DATABASE_URL" ]           || { echo "FALLO: falta el secreto STAGING_DATABASE_URL.";        fallo=1; }
          [ -n "$DIRECT_DATABASE_URL" ]    || { echo "FALLO: falta el secreto STAGING_DIRECT_DATABASE_URL."; fallo=1; }
          [ -n "$SEED_DEMO_PASSWORD" ]     || { echo "FALLO: falta el secreto SEED_DEMO_PASSWORD.";           fallo=1; }
          [ -n "$STAGING_DB_HOST_STEM" ]   || { echo "FALLO: falta la variable STAGING_DB_HOST_STEM.";        fallo=1; }
          [ "$fallo" = 0 ] || exit 1
          echo "PASS: los tres secretos y la variable están presentes."

      - name: Código del commit exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ------------------------------------------------------------------
      # Identidad del destino. Cuatro barreras, todas antes de tocar la base.
      # Ninguna imprime URL, usuario, contraseña ni host. Sólo PASS/FALLO.
      # ------------------------------------------------------------------
      - name: Verificar identidad del destino en las URL
        run: |
          mkdir -p .ci
          cat > .ci/identidad-url.mjs <<'JS'
          const esperadoHost = process.env.STAGING_DB_HOST_STEM;
          const esperadaBase = process.env.EXPECTED_DATABASE;
          const esperadoRol  = process.env.EXPECTED_ROLE;

          // El endpoint agrupado añade el sufijo `-pooler` al primer segmento
          // del host. Se normaliza para que ambas URL compartan un mismo tallo.
          const tallo = (host) => {
            const [primero, ...resto] = host.split('.');
            return [primero.replace(/-pooler$/, ''), ...resto].join('.');
          };

          let fallo = false;
          const revisar = (etiqueta, crudo) => {
            let url;
            try {
              url = new URL(crudo);
            } catch {
              console.error(`FALLO [${etiqueta}]: la cadena no es una URL válida.`);
              fallo = true;
              return;
            }
            const base = decodeURIComponent(url.pathname.replace(/^\//, ''));
            const rol = decodeURIComponent(url.username);

            if (tallo(url.hostname) !== esperadoHost) {
              console.error(`FALLO [${etiqueta}]: el host no coincide con STAGING_DB_HOST_STEM.`);
              fallo = true;
            } else {
              console.log(`PASS  [${etiqueta}]: host coincide con el tallo declarado.`);
            }

            if (base !== esperadaBase) {
              console.error(`FALLO [${etiqueta}]: la base no es la esperada.`);
              fallo = true;
            } else {
              console.log(`PASS  [${etiqueta}]: base ${esperadaBase}.`);
            }

            if (rol !== esperadoRol) {
              console.error(`FALLO [${etiqueta}]: el usuario no es el esperado.`);
              fallo = true;
            } else {
              console.log(`PASS  [${etiqueta}]: usuario ${esperadoRol}.`);
            }
          };

          revisar('pooled', process.env.DATABASE_URL);
          revisar('directa', process.env.DIRECT_DATABASE_URL);

          if (fallo) {
            console.error('Abortado antes de conectar. El destino no es la base de staging.');
            process.exit(1);
          }
          console.log('PASS: ambas URL apuntan al mismo destino de staging.');
          JS
          node .ci/identidad-url.mjs

      - name: Dependencias
        run: npm ci

      - name: Cliente Prisma
        run: npx prisma generate

      - name: Verificar identidad desde dentro de la base
        run: |
          cat > .ci/identidad-base.mjs <<'JS'
          import { PrismaClient } from '@prisma/client';
          const prisma = new PrismaClient();
          const [fila] = await prisma.$queryRaw`
            SELECT current_database()::text AS db, current_user::text AS usr`;
          let fallo = false;
          if (fila.db !== process.env.EXPECTED_DATABASE) {
            console.error('FALLO: current_database() no es la base de staging.');
            fallo = true;
          } else {
            console.log(`PASS: current_database() = ${process.env.EXPECTED_DATABASE}.`);
          }
          if (fila.usr !== process.env.EXPECTED_ROLE) {
            console.error('FALLO: current_user no es el rol de staging.');
            fallo = true;
          } else {
            console.log(`PASS: current_user = ${process.env.EXPECTED_ROLE}.`);
          }
          await prisma.$disconnect();
          if (fallo) process.exit(1);
          JS
          node .ci/identidad-base.mjs

      # ------------------------------------------------------------------
      # Clasificación del estado de la base. A y B continúan; C aborta.
      # No se purga ni se repara nada de forma automática: si el estado es C,
      # el procedimiento es recrear el proyecto de staging, que es descartable.
      # ------------------------------------------------------------------
      - name: Clasificar estado de la base
        id: estado
        run: |
          cat > .ci/clasificar.mjs <<'JS'
          import { PrismaClient } from '@prisma/client';
          import { readdirSync } from 'node:fs';
          import { appendFileSync } from 'node:fs';

          const prisma = new PrismaClient();
          const salida = (clave, valor) =>
            appendFileSync(process.env.GITHUB_OUTPUT, `${clave}=${valor}\n`);
          const abortar = async (motivo) => {
            console.error('ESTADO C. ' + motivo);
            console.error('No se purga ni se repara automáticamente.');
            console.error('Recuperación: recrear el proyecto hotel-hw-libertad-staging.');
            await prisma.$disconnect();
            process.exit(1);
          };

          const tablas = await prisma.$queryRaw`
            SELECT table_name::text AS nombre
            FROM information_schema.tables
            WHERE table_schema = 'public' AND table_type = 'BASE TABLE'`;
          const nombres = tablas.map((t) => t.nombre);
          const aplicacion = nombres.filter((n) => n !== '_prisma_migrations');

          // ---- ESTADO A: base virgen ----
          if (nombres.length === 0) {
            console.log('ESTADO A: base vacía. Se migrará y se sembrará.');
            salida('estado', 'A');
            await prisma.$disconnect();
            process.exit(0);
          }

          if (!nombres.includes('_prisma_migrations')) {
            await abortar('Hay tablas de aplicación sin registro de migraciones.');
          }
          if (aplicacion.length === 0) {
            await abortar('Existe _prisma_migrations pero ninguna tabla de aplicación.');
          }

          // ---- El historial debe coincidir exactamente con el repositorio ----
          const enDisco = readdirSync('prisma/migrations')
            .filter((d) => /^\d/.test(d))
            .sort();
          const filas = await prisma.$queryRaw`
            SELECT migration_name::text AS nombre, finished_at, rolled_back_at
            FROM _prisma_migrations
            ORDER BY migration_name`;

          const incompletas = filas.filter((f) => !f.finished_at || f.rolled_back_at);
          if (incompletas.length > 0) {
            await abortar(`Hay ${incompletas.length} migraciones sin terminar o revertidas.`);
          }

          const registradas = filas.map((f) => f.nombre).sort();
          const faltan = enDisco.filter((n) => !registradas.includes(n));
          const sobran = registradas.filter((n) => !enDisco.includes(n));
          if (faltan.length > 0) {
            await abortar(`Faltan por registrar: ${faltan.join(', ')}`);
          }
          if (sobran.length > 0) {
            await abortar(`Registradas pero ausentes del repositorio: ${sobran.join(', ')}`);
          }

          // ---- No debe existir ningún dato demo, ni siquiera parcial ----
          const conIsDemo = await prisma.$queryRaw`
            SELECT table_name::text AS nombre
            FROM information_schema.columns
            WHERE table_schema = 'public' AND column_name = 'isDemo'
            ORDER BY table_name`;

          let filasTotales = 0n;
          for (const t of conIsDemo) {
            const [r] = await prisma.$queryRawUnsafe(
              `SELECT count(*)::bigint AS n FROM public."${t.nombre}"`,
            );
            filasTotales += BigInt(r.n);
          }
          if (filasTotales > 0n) {
            await abortar(
              `Las tablas con isDemo ya contienen ${filasTotales} filas. ` +
              'El seed crea registros nuevos y duplicaría los datos.',
            );
          }

          console.log('ESTADO B: esquema canónico ya migrado y sin datos demo.');
          console.log('Se reejecutará migrate deploy de forma idempotente y se sembrará.');
          salida('estado', 'B');
          await prisma.$disconnect();
          JS
          node .ci/clasificar.mjs

      - name: Aplicar migraciones canónicas
        run: npx prisma migrate deploy

      - name: Sembrar datos sintéticos
        run: npm run db:seed

      - name: Estado de migraciones
        run: npx prisma migrate status

      # ------------------------------------------------------------------
      # Verificación posterior. Sólo nombres de tabla y números.
      # Ningún nombre de huésped, ningún usuario, ninguna contraseña.
      # ------------------------------------------------------------------
      - name: Verificar migraciones, marcas demo y conteos
        run: |
          cat > .ci/verificar.mjs <<'JS'
          import { PrismaClient } from '@prisma/client';
          import { readdirSync } from 'node:fs';

          const prisma = new PrismaClient();
          let fallo = false;

          // 1. Existe el registro de migraciones y coincide con el repositorio.
          const [reg] = await prisma.$queryRaw`
            SELECT count(*)::int AS n
            FROM information_schema.tables
            WHERE table_schema = 'public' AND table_name = '_prisma_migrations'`;
          if (reg.n !== 1) {
            console.error('FALLO: no existe _prisma_migrations.');
            process.exit(1);
          }

          const enDisco = readdirSync('prisma/migrations')
            .filter((d) => /^\d/.test(d))
            .sort();
          const aplicadas = await prisma.$queryRaw`
            SELECT migration_name::text AS nombre
            FROM _prisma_migrations
            WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL
            ORDER BY migration_name`;
          const registradas = aplicadas.map((f) => f.nombre).sort();

          console.log(`migraciones en el repositorio: ${enDisco.length}`);
          console.log(`migraciones registradas:      ${registradas.length}`);
          const faltan = enDisco.filter((n) => !registradas.includes(n));
          const sobran = registradas.filter((n) => !enDisco.includes(n));
          if (faltan.length) { console.error('FALLO sin registrar: ' + faltan.join(', ')); fallo = true; }
          if (sobran.length) { console.error('FALLO sobrantes: ' + sobran.join(', ')); fallo = true; }
          if (!fallo) console.log('PASS: el registro coincide exactamente con el historial.');

          // 2. Todo registro operativo está marcado como demo.
          const conIsDemo = await prisma.$queryRaw`
            SELECT table_name::text AS nombre
            FROM information_schema.columns
            WHERE table_schema = 'public' AND column_name = 'isDemo'
            ORDER BY table_name`;

          let demo = 0n;
          let noDemo = 0n;
          const sucias = [];
          for (const t of conIsDemo) {
            const [r] = await prisma.$queryRawUnsafe(
              `SELECT (count(*) FILTER (WHERE "isDemo"))::bigint     AS si,
                      (count(*) FILTER (WHERE NOT "isDemo"))::bigint AS no
               FROM public."${t.nombre}"`,
            );
            demo += BigInt(r.si);
            noDemo += BigInt(r.no);
            if (BigInt(r.no) > 0n) sucias.push(`${t.nombre}=${r.no}`);
          }
          console.log(`tablas con columna isDemo: ${conIsDemo.length}`);
          console.log(`filas con isDemo=true:     ${demo}`);
          console.log(`filas con isDemo=false:    ${noDemo}`);
          if (noDemo > 0n) {
            console.error('FALLO: hay filas operativas sin marca demo: ' + sucias.join(', '));
            console.error('Staging sólo debe contener datos sintéticos marcados isDemo=true.');
            fallo = true;
          } else {
            console.log('PASS: cero datos sin marca demo. Cero datos provenientes de Production.');
          }
          if (demo === 0n) {
            console.error('FALLO: el seed no dejó ningún registro demo.');
            fallo = true;
          }

          // 3. Conteos agregados por tabla. Sólo nombre y número de filas.
          const conteos = await prisma.$queryRaw`
            SELECT relname::text AS tabla,
                   (xpath('/row/c/text()',
                     query_to_xml(format('SELECT count(*) AS c FROM %I.%I', schemaname, relname),
                     false, true, '')))[1]::text::bigint AS filas
            FROM pg_stat_user_tables
            WHERE schemaname = 'public'
            ORDER BY relname`;
          let total = 0n;
          console.log('--- conteos agregados ---');
          for (const c of conteos) {
            total += BigInt(c.filas);
            if (BigInt(c.filas) > 0n) console.log(String(c.filas).padStart(6), c.tabla);
          }
          console.log('---');
          console.log(`tablas con datos: ${conteos.filter((c) => BigInt(c.filas) > 0n).length} de ${conteos.length}`);
          console.log(`filas totales:    ${total}`);

          await prisma.$disconnect();
          if (fallo) process.exit(1);
          JS
          node .ci/verificar.mjs

      - name: Retirar los scripts temporales del runner
        if: always()
        run: rm -rf .ci

      - name: Recordatorio de retirada
        run: |
          echo "Bootstrap completado sobre el estado ${{ steps.estado.outputs.estado }}."
          echo "Abrir ahora un PR aparte hacia preproduction que elimine este workflow."
          echo "No promover este archivo a main. El seed no entra en ningún build."
