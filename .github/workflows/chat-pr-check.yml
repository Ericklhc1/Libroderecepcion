name: Chat PR check

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'tests/chat-*.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/chat-pr-check.yml'

permissions:
  contents: read

jobs:
  typecheck-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npm run db:generate
      - name: Typecheck
        run: npm run typecheck
      - name: Chat domain tests
        run: npx vitest run tests/chat-domain.test.ts
