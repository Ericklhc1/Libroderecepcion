name: Compuerta

on:
  push:
    branches:
      - preproduction
      - main
  pull_request:
    branches:
      - preproduction
      - main

concurrency:
  group: compuerta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Regresiones, tipos y build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: libro
          POSTGRES_PASSWORD: libro_test
          POSTGRES_DB: libro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U libro -d libro_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DATABASE_URL: postgresql://libro:libro_test@127.0.0.1:5432/libro_test?schema=public
      DATABASE_URL: postgresql://libro:libro_test@127.0.0.1:5432/libro_test?schema=public&application_name=compuerta
      DIRECT_DATABASE_URL: postgresql://libro:libro_test@127.0.0.1:5432/libro_test?schema=public&application_name=compuerta
      AUTH_SECRET: compuerta-local-no-produccion
      NODE_ENV: test

    steps:
      - name: Código
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Dependencias
        run: npm ci

      - name: Cliente Prisma
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Regresiones
        run: npm run test

      - name: Build
        env:
          NODE_ENV: production
        run: npm run build
