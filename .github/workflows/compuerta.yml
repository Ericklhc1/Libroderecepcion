name: Compuerta

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: compuerta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Regresiones, tipos y build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: libro
          POSTGRES_PASSWORD: libro_test
          POSTGRES_DB: libro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U libro -d libro_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DATABASE_URL: postgresql://libro:libro_test@127.0.0.1:5432/libro_test?schema=public
      DATABASE_URL: postgresql://libro:libro_test@127.0.0.1:5432/libro_test?schema=public&application_name=compuerta
      DIRECT_DATABASE_URL: postgresql://libro:libro_test@127.0.0.1:5432/libro_test?schema=public&application_name=compuerta
      AUTH_SECRET: compuerta-local-no-produccion
      NODE_ENV: test

    steps:
      - name: Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validar versión
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          node <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const semver = /^\d+\.\d+\.\d+$/;

          if (!semver.test(pkg.version)) {
            throw new Error(`Versión inválida: ${pkg.version}. Usa MAJOR.MINOR.PATCH.`);
          }
          if (lock.version !== pkg.version || lock.packages?.['']?.version !== pkg.version) {
            throw new Error('package.json y package-lock.json deben tener la misma versión.');
          }
          NODE

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_version=$(git show "origin/$BASE_REF:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")
            current_version=$(node -p "require('./package.json').version")

            BASE_VERSION="$base_version" CURRENT_VERSION="$current_version" node <<'NODE'
            const parse = (value) => value.split('.').map(Number);
            const base = parse(process.env.BASE_VERSION);
            const current = parse(process.env.CURRENT_VERSION);
            const greater =
              current[0] > base[0] ||
              (current[0] === base[0] && current[1] > base[1]) ||
              (current[0] === base[0] && current[1] === base[1] && current[2] > base[2]);

            if (!greater) {
              throw new Error(
                `Toda actualización de Production debe incrementar la versión: ${process.env.BASE_VERSION} → ${process.env.CURRENT_VERSION}`,
              );
            }
            NODE
          fi

      - name: Dependencias
        run: npm ci

      - name: Cliente Prisma
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Regresiones
        run: npm run test

      - name: Build
        env:
          NODE_ENV: production
        run: npm run build
