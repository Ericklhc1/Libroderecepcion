name: Compuerta

on:
  push:
    branches:
      - main
      # Temporary, isolated verification: no PR, no deploy, no persistent CI storage.
      - codex/aroh-fns-20261005
      - codex/aroh-future-handoff-20261005
  pull_request:
    branches:
      - main
      - feat/etapa-1-operacion-conectada

concurrency:
  group: compuerta-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Regresiones, tipos y build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: libro
          POSTGRES_PASSWORD: libro_test
          POSTGRES_DB: libro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U libro -d libro_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DATABASE_URL: postgresql://libro:libro_test@127.0.0.1:5432/libro_test?schema=public
      DATABASE_URL: postgresql://libro:libro_test@127.0.0.1:5432/libro_test?schema=public&application_name=compuerta
      DIRECT_DATABASE_URL: postgresql://libro:libro_test@127.0.0.1:5432/libro_test?schema=public&application_name=compuerta
      AUTH_SECRET: compuerta-local-no-produccion-solo-datos-sinteticos
      NODE_ENV: test

    steps:
      - name: Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fuentes para diagnóstico del bloque 2
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 249
        run: git archive --format=tar.gz --output=/tmp/etapa3-source.tar.gz HEAD

      - name: Conservar fuentes sin dependencias ni credenciales
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 249
        uses: actions/upload-artifact@v4
        with:
          name: etapa3-source-${{ github.sha }}
          path: /tmp/etapa3-source.tar.gz
          retention-days: 1

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ github.ref != 'refs/heads/codex/aroh-fns-20261005' && github.ref != 'refs/heads/codex/aroh-future-handoff-20261005' && github.head_ref != 'codex/aroh-future-handoff-20261005' && 'npm' || '' }}

      - name: Validar infraestructura oficial
        run: |
          test -f vercel.json
          test ! -f netlify.toml
          test ! -d .netlify
          if grep -RIl --exclude='*.md' -E 'netlify\.app|NETLIFY_|@netlify/' src prisma package.json 2>/dev/null; then
            echo 'Se detectó una dependencia o configuración activa de Netlify. La infraestructura oficial es GitHub + Vercel + Neon.'
            exit 1
          fi
          if find .github -type f ! -name 'compuerta.yml' -print0 | xargs -0 -r grep -Il -E 'netlify\.app|NETLIFY_|@netlify/' 2>/dev/null; then
            echo 'Se detectó configuración activa de Netlify en .github.'
            exit 1
          fi

      - name: Validar versión
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          current_version=$(node -p "require('./package.json').version")
          lock_version=$(node -p "require('./package-lock.json').version")
          lock_root_version=$(node -p "require('./package-lock.json').packages[''].version")
          printf '%s' "$current_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          test "$lock_version" = "$current_version"
          test "$lock_root_version" = "$current_version"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_version=$(git show "origin/$BASE_REF:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")
            node -e "const p=s=>s.split('.').map(Number); const b=p(process.argv[1]), c=p(process.argv[2]); const ok=c[0]>b[0]||(c[0]===b[0]&&c[1]>b[1])||(c[0]===b[0]&&c[1]===b[1]&&c[2]>b[2]); if(!ok){console.error('Toda actualización de Production debe incrementar la versión: '+process.argv[1]+' → '+process.argv[2]); process.exit(1)}" "$base_version" "$current_version"
          fi

      - name: Dependencias
        run: |
          npm ci
          node scripts/framework/react-ping-backport.mjs --check
          node --input-type=module -e "import assert from 'node:assert/strict'; import { reactPingBackport } from './scripts/framework/react-ping-backport.mjs'; assert.equal(reactPingBackport({ projectRoot: process.cwd(), mode: 'apply' }).patched, 0); console.log('Second runtime check made no changes');"

      - name: Bloquear vulnerabilidades críticas
        run: npm audit --omit=dev --audit-level=critical

      - name: Cliente Prisma
        run: npm run db:generate

      - name: Validar migraciones
        run: npm run db:deploy

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee etapa3-typecheck.log

      - name: Regresiones
        run: |
          npm run test
          node --test scripts/ui/hydration-diagnostics.test.mjs scripts/framework/react-ping-backport.test.mjs scripts/framework/verify-react-ping-build.test.mjs

      - name: Build
        id: production_build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Preparar recorridos de navegador de Etapa 1
        run: |
          node scripts/etapa1/guard.cjs
          npx tsx scripts/etapa1/fixture.mts
          node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Recorridos autenticados de escritorio y móvil
        timeout-minutes: 3
        env:
          NODE_ENV: production
        run: |
          NODE_OPTIONS="--require=$PWD/scripts/etapa1/no-external.cjs" node node_modules/next/dist/bin/next start --hostname localhost > /tmp/etapa1-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/login > /dev/null; then break; fi
            sleep 1
          done
          node scripts/framework/verify-react-ping-build.mjs --served
          journey_status=0
          if ! PLAYWRIGHT_MODULE="$PWD/node_modules/playwright-core/index.mjs" node scripts/etapa1/browser.mjs; then
            grep -F '[etapa2-timing]' /tmp/etapa1-server.log || true
            journey_status=1
          fi
          if ! PLAYWRIGHT_MODULE="$PWD/node_modules/playwright-core/index.mjs" node scripts/etapa2/browser.mjs; then
            journey_status=1
          fi
          if ! PLAYWRIGHT_MODULE="$PWD/node_modules/playwright-core/index.mjs" node scripts/etapa3/browser.mjs; then
            journey_status=1
          fi
          if ! PLAYWRIGHT_MODULE="$PWD/node_modules/playwright-core/index.mjs" node scripts/etapa3/block2-browser.mjs; then
            journey_status=1
          fi
          if ! PLAYWRIGHT_MODULE="$PWD/node_modules/playwright-core/index.mjs" node scripts/ui/collapsible-browser.mjs; then
            journey_status=1
          fi
          if ! PLAYWRIGHT_MODULE="$PWD/node_modules/playwright-core/index.mjs" node scripts/etapa4/reception-browser.mjs; then
            journey_status=1
          fi
          if ! PLAYWRIGHT_MODULE="$PWD/node_modules/playwright-core/index.mjs" node scripts/etapa4/subject-browser.mjs; then
            journey_status=1
          fi
          if ! PLAYWRIGHT_MODULE="$PWD/node_modules/playwright-core/index.mjs" node scripts/etapa4/attention-browser.mjs; then
            journey_status=1
          fi
          if ! PLAYWRIGHT_MODULE="$PWD/node_modules/playwright-core/index.mjs" node scripts/etapa4/roles-browser.mjs; then
            journey_status=1
          fi
          if ! PLAYWRIGHT_MODULE="$PWD/node_modules/playwright-core/index.mjs" node scripts/etapa4/intent-browser.mjs; then
            journey_status=1
          fi
          if ! PLAYWRIGHT_MODULE="$PWD/node_modules/playwright-core/index.mjs" node scripts/etapa4/surfaces-browser.mjs; then
            journey_status=1
          fi
          exit "$journey_status"

      - name: Apariencia y continuidad de listas y suplencias
        if: ${{ !cancelled() && steps.production_build.outcome == 'success' }}
        timeout-minutes: 3
        env:
          NODE_ENV: production
        run: |
          node scripts/etapa1/guard.cjs
          npx tsx scripts/etapa1/fixture.mts
          NODE_OPTIONS="--require=$PWD/scripts/etapa1/no-external.cjs" node node_modules/next/dist/bin/next start --hostname localhost > /tmp/appearance-context-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/login > /dev/null; then break; fi
            sleep 1
          done
          journey_status=0
          for script in appearance-browser list-context-browser substitution-candidates-browser; do
            if ! PLAYWRIGHT_MODULE="$PWD/node_modules/playwright-core/index.mjs" node "scripts/ui/$script.mjs"; then
              journey_status=1
              echo "Synthetic browser failure: $script; recent local server diagnostics"
              tail -60 /tmp/appearance-context-server.log
            fi
          done
          exit "$journey_status"

      - name: Navegación funcional y bandejas de trabajo
        if: ${{ !cancelled() && steps.production_build.outcome == 'success' }}
        timeout-minutes: 4
        env:
          NODE_ENV: production
        run: |
          node scripts/etapa1/guard.cjs
          journey_status=0
          for script in module-navigation-browser context-worklist-browser housekeeping-worklist-browser room-context-browser; do
            npx tsx scripts/etapa1/fixture.mts
            NODE_OPTIONS="--require=$PWD/scripts/etapa1/no-external.cjs" node node_modules/next/dist/bin/next start --hostname localhost > /tmp/functional-surface-server.log 2>&1 &
            server_pid=$!
            trap 'kill "$server_pid" 2>/dev/null || true' EXIT
            for i in $(seq 1 60); do
              if curl -fsS http://localhost:3000/login > /dev/null; then break; fi
              sleep 1
            done
            if ! PLAYWRIGHT_MODULE="$PWD/node_modules/playwright-core/index.mjs" node "scripts/ui/$script.mjs"; then
              journey_status=1
              echo "Synthetic browser failure: $script; recent local server diagnostics"
              tail -60 /tmp/functional-surface-server.log
            fi
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          done
          exit "$journey_status"

      - name: Custodia y consulta con contexto
        if: ${{ !cancelled() && steps.production_build.outcome == 'success' }}
        timeout-minutes: 4
        env:
          NODE_ENV: production
        run: |
          node scripts/etapa1/guard.cjs
          journey_status=0
          for script in custody-worklist-browser search-context-browser history-context-browser; do
            npx tsx scripts/etapa1/fixture.mts
            NODE_OPTIONS="--require=$PWD/scripts/etapa1/no-external.cjs" node node_modules/next/dist/bin/next start --hostname localhost > /tmp/custody-search-server.log 2>&1 &
            server_pid=$!
            trap 'kill "$server_pid" 2>/dev/null || true' EXIT
            for i in $(seq 1 60); do
              if curl -fsS http://localhost:3000/login > /dev/null; then break; fi
              sleep 1
            done
            if ! PLAYWRIGHT_MODULE="$PWD/node_modules/playwright-core/index.mjs" node "scripts/ui/$script.mjs"; then
              journey_status=1
              echo "Synthetic browser failure: $script; recent local server diagnostics"
              tail -60 /tmp/custody-search-server.log
            fi
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          done
          exit "$journey_status"

      - name: Diagnóstico de estado SPA y Flight sin salida externa
        if: ${{ !cancelled() && steps.production_build.outcome == 'success' && github.ref == 'refs/heads/codex/aroh-fns-20261005' }}
        timeout-minutes: 3
        env:
          NODE_ENV: production
        run: |
          node scripts/etapa1/guard.cjs
          npx tsx scripts/etapa1/fixture.mts
          NODE_OPTIONS="--require=$PWD/scripts/etapa1/no-external.cjs" node node_modules/next/dist/bin/next start --hostname localhost > /tmp/navigation-transport-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/login > /dev/null; then break; fi
            sleep 1
          done
          PLAYWRIGHT_MODULE="$PWD/node_modules/playwright-core/index.mjs" node scripts/ui/navigation-transport-probe.mjs

      - name: Evidencia temporal en logs sin almacenamiento adicional
        if: ${{ always() && (github.ref == 'refs/heads/codex/aroh-fns-20261005' || github.ref == 'refs/heads/codex/aroh-future-handoff-20261005' || github.head_ref == 'codex/aroh-future-handoff-20261005') }}
        run: |
          echo "Candidate commit: $GITHUB_SHA"
          for file in etapa3-typecheck.log etapa1-browser-results.json etapa2-browser-results.json etapa3-browser-results.json etapa3-hydration-diagnostics.json etapa3-block2-browser-results.json collapsible-sections-browser-results.json etapa4-reception-browser-results.json etapa4-subject-browser-results.json etapa4-attention-browser-results.json etapa4-roles-browser-results.json etapa4-intent-browser-results.json etapa4-surfaces-browser-results.json appearance-browser-results.json /tmp/list-context-browser-results.json substitution-candidates-browser-results.json module-navigation-browser-results.json /tmp/context-worklist-browser-results.json housekeeping-worklist-browser-results.json room-context-browser-results.json custody-worklist-browser-results.json /tmp/search-context-browser-results.json history-context-browser-results.json; do
            if [ -f "$file" ]; then
              printf '\n=== %s ===\n' "$file"
              cat "$file"
            fi
          done

      - name: Evidencia de recorridos sin credenciales
        if: ${{ always() && github.ref != 'refs/heads/codex/aroh-fns-20261005' && github.ref != 'refs/heads/codex/aroh-future-handoff-20261005' && github.head_ref != 'codex/aroh-future-handoff-20261005' }}
        uses: actions/upload-artifact@v4
        with:
          name: etapa1-browser-${{ github.sha }}
          path: |
            etapa1-browser-results.json
            etapa2-browser-results.json
            etapa3-browser-results.json
            etapa3-block2-browser-results.json
            collapsible-sections-browser-results.json
            etapa4-reception-browser-results.json
            etapa4-subject-browser-results.json
            etapa4-attention-browser-results.json
            etapa4-roles-browser-results.json
            etapa4-intent-browser-results.json
            etapa4-surfaces-browser-results.json
            etapa3-typecheck.log
            appearance-browser-results.json
            /tmp/list-context-browser-results.json
            substitution-candidates-browser-results.json
            module-navigation-browser-results.json
            /tmp/context-worklist-browser-results.json
            housekeeping-worklist-browser-results.json
            room-context-browser-results.json
            custody-worklist-browser-results.json
            search-context-browser-results.json
            history-context-browser-results.json
          if-no-files-found: warn
          retention-days: 7
