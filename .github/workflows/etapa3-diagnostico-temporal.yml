name: Diagnóstico acotado Etapa 3
on:
  push:
    branches: [feat/etapa3-bloque2-coordinacion-custodia]
    paths: [.github/workflows/etapa3-diagnostico-temporal.yml]
permissions:
  actions: read
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Leer exclusivamente fallos del CI sintético anterior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request, os, re
          url='https://api.github.com/repos/Ericklhc1/Libroderecepcion/actions/jobs/111202894469/logs'
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=30) as r:
            text=r.read().decode('utf-8','replace')
          text=re.sub(r'\x1b\[[0-9;]*m','',text)
          lines=text.splitlines()
          index=next((i for i,line in enumerate(lines) if 'Failed Tests' in line or 'Failed Suites' in line),None)
          if index is None:
            selected=[line for line in lines if 'FAIL ' in line or 'AssertionError' in line or 'Error:' in line][-30:]
          else:
            selected=lines[index:index+100]
          print('=== DIAGNOSTICO DE REGRESIONES ===')
          print('\n'.join(selected)[:14000])
          PY
