name: Preparar bloque 1 Etapa 3
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/etapa3_prepare.py'
      - '.github/workflows/etapa3-prepare.yml'
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/etapa3-coordinacion'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Preparar blobs sin mover ramas ni modificar workflows con el token de CI
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/etapa3_prepare.py')
          s=p.read_text()
          patches=[
            ('src/server/ai/execution/natural-housekeeping.ts','executePlan(previous.executionId,true)','executePlan(previous.executionId,false)'),
            ('src/server/services/entries.ts',"data: { ...data, ...(changes.changed.includes('ownerId')","data: { ...data, updatedAt:new Date(Math.max(Date.now(),current.updatedAt.getTime()+1)), ...(changes.changed.includes('ownerId')"),
            ('src/server/services/entries.ts','        status: input.status,','        updatedAt: new Date(Math.max(Date.now(), current.updatedAt.getTime()+1)),\n        status: input.status,'),
          ]
          anchor="for path in ['package.json','package-lock.json']:"
          assert s.count(anchor)==1
          s=s.replace(anchor,''.join('replace('+','.join(repr(v) for v in patch)+')\n' for patch in patches)+'\n'+anchor)
          anchor="tree=api('git/trees',{'base_tree':base,'tree':entries})['sha']"
          assert s.count(anchor)==1
          s=s.replace(anchor,"print('PREPARED_TREE_ENTRIES='+json.dumps(entries))\nprint('PREPARED_BASE_TREE='+base)\nprint('PREPARED_PARENT='+head)\nraise SystemExit(0)\n"+anchor)
          p.write_text(s)
          compile(s,str(p),'exec')
          PY
          python3 .github/etapa3_prepare.py
