name: Preparar bloque 1 Etapa 3
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/etapa3_prepare.py'
      - '.github/workflows/etapa3-prepare.yml'
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/etapa3-coordinacion'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Preparar objetos Git sin mover ramas ni desplegar
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/etapa3_prepare.py
