name: Preparar bloque 1 Etapa 3
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/etapa3_prepare.py'
      - '.github/workflows/etapa3-prepare.yml'
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/etapa3-coordinacion'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Preparar objetos Git sin mover ramas ni desplegar
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/etapa3_prepare.py')
          s=p.read_text()
          anchor="for path in ['package.json','package-lock.json']:"
          extra='''replace('src/server/ai/execution/natural-housekeeping.ts', 'executePlan(previous.executionId,true)', 'executePlan(previous.executionId,false)')
          replace('src/server/services/entries.ts', 'data: { ...data, ...(changes.changed.includes(\'ownerId\')', 'data: { ...data, updatedAt:new Date(Math.max(Date.now(),current.updatedAt.getTime()+1)), ...(changes.changed.includes(\'ownerId\')')
          replace('src/server/services/entries.ts', '        status: input.status,', '        updatedAt: new Date(Math.max(Date.now(), current.updatedAt.getTime()+1)),\\n        status: input.status,')
          '''
          # Preserve quoting in the exact TypeScript anchors.
          extra=extra.replace("'data: { ...data, ...(changes.changed.includes('ownerId')'",'"data: { ...data, ...(changes.changed.includes(\'ownerId\')"').replace("'data: { ...data, updatedAt:new Date(Math.max(Date.now(),current.updatedAt.getTime()+1)), ...(changes.changed.includes('ownerId')'",'"data: { ...data, updatedAt:new Date(Math.max(Date.now(),current.updatedAt.getTime()+1)), ...(changes.changed.includes(\'ownerId\')"')
          assert s.count(anchor)==1
          s=s.replace(anchor,extra+'\n'+anchor)
          s=s.replace('import json, os, subprocess, urllib.request','import json, os, subprocess, urllib.request, urllib.error')
          s=s.replace('    with urllib.request.urlopen(req,timeout=45) as response:return json.load(response)',"    try:\n        with urllib.request.urlopen(req,timeout=45) as response:return json.load(response)\n    except urllib.error.HTTPError as error:\n        print('GitHub API failure',path,error.code,error.read().decode()[:2000])\n        raise")
          s=s.replace("        blob=api('git/blobs'", "        print('Preparing path',p,flush=True)\n        blob=api('git/blobs'")
          p.write_text(s)
          compile(s,str(p),'exec')
          PY
          python3 .github/etapa3_prepare.py
