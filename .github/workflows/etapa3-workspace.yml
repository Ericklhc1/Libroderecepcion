name: Etapa 3 workspace temporal
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/etapa3-workspace.yml'
permissions:
  contents: read
jobs:
  snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/etapa3-coordinacion'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Dependencias públicas de la versión fijada
        env:
          DATABASE_URL: postgresql://libro:libro_test@127.0.0.1:5432/libro_test
          DIRECT_DATABASE_URL: postgresql://libro:libro_test@127.0.0.1:5432/libro_test
        run: npm ci
      - name: Copia sin variables, credenciales ni datos operativos
        run: |
          git archive --format=tar HEAD > /tmp/etapa3-source.tar
          tar -czf /tmp/etapa3-dependencies.tar.gz node_modules
          printf '%s\n' '${{ github.event.pull_request.head.sha }}' > /tmp/etapa3-source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: etapa3-workspace
          path: |
            /tmp/etapa3-source.tar
            /tmp/etapa3-dependencies.tar.gz
            /tmp/etapa3-source-sha.txt
          compression-level: 0
          retention-days: 1
