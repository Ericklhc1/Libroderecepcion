name: Paquete Preproduction

on:
  push:
    branches: [preproduction]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Código
        uses: actions/checkout@v4

      - name: Empaquetar fuente exacta
        uses: actions/upload-artifact@v4
        with:
          name: preproduction-source-${{ github.sha }}
          path: .
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
