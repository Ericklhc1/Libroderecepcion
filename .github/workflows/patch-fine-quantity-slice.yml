name: patch-fine-quantity-slice
on:
  workflow_dispatch:
  push:
    branches:
      - gpt/auditoria-operativa-integrada-20260916
    paths:
      - .github/scripts/schema_chunk_0.txt
      - .github/scripts/schema_chunk_1.txt
      - .github/scripts/schema_chunk_2.txt
      - .github/scripts/schema_chunk_3.txt
      - .github/scripts/patch_fine_quantity.py
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/auditoria-operativa-integrada-20260916
      - name: Assemble Fine.quantity schema from chunks
        run: python3 .github/scripts/patch_fine_quantity.py
      - name: Commit and push
        run: |
          git config user.name "Ericklhc1"
          git config user.email "elhc1996@gmail.com"
          git add prisma/schema.prisma
          git status
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "feat(fines): agregar quantity a modelo Fine en schema"
          git push origin HEAD:gpt/auditoria-operativa-integrada-20260916
