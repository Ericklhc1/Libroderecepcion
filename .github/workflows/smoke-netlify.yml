name: Smoke Netlify Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-netlify.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Esperar propagación
        run: sleep 10

      - name: Login responde
        run: |
          code=$(curl -sS -o /tmp/login.html -w "%{http_code}" https://libroderecepcion.netlify.app/login)
          test "$code" = "200"
          grep -q "Iniciar sesión" /tmp/login.html

