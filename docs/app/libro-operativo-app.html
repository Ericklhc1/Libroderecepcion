  --sidebar: #0f2430;
  --sidebar-2: #163341;
  --sidebar-ink: #dbe8ec;
  --sidebar-ink-2: #90aab4;

  --radius: 10px;
  --radius-sm: 7px;
  --shadow: 0 1px 2px rgba(15, 36, 48, .07), 0 6px 18px -8px rgba(15, 36, 48, .13);
  --shadow-lift: 0 2px 6px rgba(15, 36, 48, .1), 0 20px 40px -16px rgba(15, 36, 48, .3);

  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;

    --sidebar-2: #132c37;
    --sidebar-ink: #dbe8ec;

    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px -8px rgba(0, 0, 0, .5);
    --shadow-lift: 0 2px 8px rgba(0, 0, 0, .5), 0 24px 48px -16px rgba(0, 0, 0, .7);
  }
}

  --atencion: #f6b873;
  --atencion-bg: #33220f;

  --shadow-lift: 0 2px 8px rgba(0, 0, 0, .5), 0 24px 48px -16px rgba(0, 0, 0, .7);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

:where(button, a, input, select, textarea):focus-visible {
  outline: 2px solid var(--gold-bright);
  outline-offset: 2px;
  border-radius: 4px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ------------------------------- Estructura ------------------------------- */

.app { display: flex; min-height: 100%; }

.sidebar {
  display: none;
  width: 246px;
  flex-shrink: 0;
  flex-direction: column;
  background: var(--sidebar);
  border-right: 1px solid color-mix(in srgb, var(--sidebar-2) 80%, transparent);
  position: sticky;
  top: 0;
  height: 100vh;
  padding-top: env(safe-area-inset-top, 0px);
}

@media (min-width: 1040px) { .sidebar { display: flex; } }

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 18px 18px 16px;
  border-bottom: 1px solid var(--sidebar-2);
}

.brand-mark {
  width: 34px; height: 34px;
  flex-shrink: 0;
  border-radius: 8px;
  background: linear-gradient(160deg, var(--gold-bright), #9c7a16);
  color: #10242e;
  display: grid; place-items: center;
  font-family: var(--serif);
  font-size: 19px;
  font-weight: 600;
  line-height: 1;
}

.brand-hotel {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--gold-bright);
  margin: 0 0 1px;
}

.brand-name {
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 500;
  color: #fff;
  margin: 0;
  line-height: 1.15;
  letter-spacing: -.01em;
}

.nav { padding: 12px 10px; flex: 1; overflow-y: auto; }

.nav-group-label {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--sidebar-ink-2);
  padding: 12px 9px 6px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 10px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--sidebar-ink);
  font: inherit;
  font-size: 13.5px;
  text-align: left;
  cursor: pointer;
  transition: background .12s ease;
}

.nav-item:hover { background: var(--sidebar-2); }

.nav-item[aria-current="page"] {
  background: var(--sidebar-2);
  color: #fff;
  font-weight: 600;
  box-shadow: inset 2px 0 0 var(--gold-bright);
}

.nav-item svg { width: 16px; height: 16px; flex-shrink: 0; opacity: .85; }
.nav-item[aria-current="page"] svg { opacity: 1; }
.nav-label { flex: 1; }

.nav-count {
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 99px;
  background: var(--gold-bright);
  color: #10242e;
}

.nav-count[data-tone="quiet"] { background: var(--sidebar-2); color: var(--sidebar-ink-2); }

.whoami {
  border-top: 1px solid var(--sidebar-2);
  padding: 12px;
}

.whoami select { font-size: 11.5px; padding: 6px 7px; }

.whoami-label {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--sidebar-ink-2);
  margin: 0 0 6px;
}

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}

.topbar-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
}

.topbar-brand {
  display: flex; align-items: center; gap: 9px;
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 500;
}

@media (min-width: 1040px) { .topbar-brand { display: none; } }

.search {
  position: relative;
  flex: 1;
  min-width: 0;
  max-width: 460px;
}

.search svg {
  position: absolute; left: 10px; top: 50%;
  transform: translateY(-50%);
  width: 15px; height: 15px;
  color: var(--ink-3);
  pointer-events: none;
}

.actions-row {
  display: flex;
  gap: 7px;
  padding: 0 16px 10px;
  overflow-x: auto;
  scrollbar-width: none;
}

.actions-row::-webkit-scrollbar { display: none; }

.content {
  flex: 1;
  padding: 16px;
  padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  max-width: 1180px;
  width: 100%;
  margin: 0 auto;
}

@media (min-width: 1040px) { .content { padding-bottom: 32px; } }

.bottomnav {
  position: fixed;
  inset-inline: 0;
  bottom: 0;
  z-index: 30;
  display: flex;
  background: color-mix(in srgb, var(--surface) 95%, transparent);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (min-width: 1040px) { .bottomnav { display: none; } }

.bottomnav button {
  flex: 1;
  border: 0;
  background: transparent;
  padding: 7px 2px 8px;
  color: var(--ink-3);
  font: inherit;
  font-size: 10px;
  font-weight: 500;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: pointer;
  position: relative;
}

.bottomnav button svg { width: 19px; height: 19px; }
.bottomnav button[aria-current="page"] { color: var(--petrol); }
:root[data-theme="dark"] .bottomnav button[aria-current="page"] { color: var(--petrol); }

.bottomnav button[aria-current="page"]::before {
  content: "";
  position: absolute;
  top: 0; left: 26%; right: 26%;
  height: 2px;
  border-radius: 0 0 2px 2px;
  background: var(--gold-bright);
}

.bottomnav .dot {
  position: absolute;
  top: 6px;
  right: calc(50% - 16px);
  width: 7px; height: 7px;
  border-radius: 99px;
  background: var(--critico-mark);
  border: 1.5px solid var(--surface);
}

/* ------------------------------ Tipografía ------------------------------- */

h1 {
  font-family: var(--serif);
  font-size: clamp(22px, 4vw, 27px);
  font-weight: 500;
  letter-spacing: -.015em;
  line-height: 1.15;
  margin: 0;
  text-wrap: balance;
}

h2 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.005em; }
h3 { font-size: 13.5px; font-weight: 600; margin: 0; }

.page-head { margin-bottom: 16px; }
.page-sub { color: var(--ink-2); margin: 5px 0 0; max-width: 62ch; }

.eyebrow {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 0 0 4px;
}

.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.meta { font-size: 12px; color: var(--ink-3); }
.meta .num { font-size: 11.5px; }

/* -------------------------------- Bloques -------------------------------- */

.stack { display: flex; flex-direction: column; gap: 14px; }
.grid { display: grid; gap: 14px; }
@media (min-width: 900px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
@media (min-width: 900px) { .grid-3 { grid-template-columns: 2fr 1fr; } }

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.panel-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  border-bottom: 1px solid var(--line-soft);
  background: var(--surface-2);
}

.panel-head h2 { flex: 1; min-width: 0; }

.panel-head .count {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}

.panel-body { padding: 14px; }
.panel-foot { padding: 10px 14px; border-top: 1px solid var(--line-soft); background: var(--surface-2); }

.rows { list-style: none; margin: 0; padding: 0; }
.rows > li { border-bottom: 1px solid var(--line-soft); }
.rows > li:last-child { border-bottom: 0; }

.row {
  display: flex;
  gap: 11px;
  width: 100%;
  padding: 11px 14px;
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: background .1s ease;
}

.row:hover { background: var(--surface-2); }
.row-bar { width: 3px; flex-shrink: 0; border-radius: 99px; align-self: stretch; }
.row-body { flex: 1; min-width: 0; }
.row-title { font-weight: 500; margin: 3px 0 0; }
.row-text { color: var(--ink-2); margin: 2px 0 0; font-size: 13px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row-tags { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.row-meta { display: flex; flex-wrap: wrap; gap: 4px 11px; margin-top: 6px; font-size: 11.5px; color: var(--ink-3); }
.row-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 11px; }

.empty {
  padding: 26px 16px;
  text-align: center;
  color: var(--ink-3);
}

.empty strong { display: block; color: var(--ink-2); font-weight: 500; margin-bottom: 3px; }

/* --------------------------------- Chips --------------------------------- */

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 7px;
  border-radius: 5px;
  font-size: 11.5px;
  font-weight: 500;
  white-space: nowrap;
  line-height: 1.45;
}

.badge .glyph { font-size: 8.5px; line-height: 1; }

.badge[data-tone="critico"] { background: var(--critico-bg); color: var(--critico); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--critico) 22%, transparent); }
.badge[data-tone="atencion"] { background: var(--atencion-bg); color: var(--atencion); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--atencion) 22%, transparent); }
.badge[data-tone="pendiente"] { background: var(--pendiente-bg); color: var(--pendiente); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pendiente) 25%, transparent); }
.badge[data-tone="curso"] { background: var(--curso-bg); color: var(--curso); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--curso) 22%, transparent); }
.badge[data-tone="resuelto"] { background: var(--resuelto-bg); color: var(--resuelto); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--resuelto) 22%, transparent); }
.badge[data-tone="neutro"] { background: var(--neutro-bg); color: var(--neutro); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--neutro) 20%, transparent); }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 7px;
  border-radius: 5px;
  background: var(--petrol-soft);
  color: var(--petrol-mid);
  font-size: 11.5px;
  font-weight: 500;
  white-space: nowrap;
}

.ref {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}

/* -------------------------------- Botones -------------------------------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 7px 12px;
  border-radius: 7px;
  border: 1px solid transparent;
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: background .12s ease, border-color .12s ease;
}

.btn svg { width: 15px; height: 15px; }

.btn-primary { background: var(--petrol); color: #fff; }
.btn-primary:hover { background: var(--petrol-mid); }
:root[data-theme="dark"] .btn-primary,
:root:not([data-theme="light"]) .btn-primary { color: #071016; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .btn-primary { color: #fff; } }

.btn-gold { background: var(--gold-bright); color: #12262f; font-weight: 600; }
.btn-gold:hover { background: color-mix(in srgb, var(--gold-bright) 88%, #fff); }

.btn-quiet {
  background: var(--surface);
  color: var(--ink);
  border-color: var(--line);
}
.btn-quiet:hover { background: var(--surface-3); }

.btn-ghost { background: transparent; color: var(--petrol-mid); padding-inline: 7px; }
.btn-ghost:hover { background: var(--petrol-soft); }

.btn-danger { background: var(--critico-mark); color: #fff; }
.btn-danger:hover { filter: brightness(1.08); }

.btn-sm { padding: 4px 9px; font-size: 12px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.link {
  background: none; border: 0; padding: 0;
  font: inherit; font-size: 12px; font-weight: 500;
  color: var(--petrol-mid);
  cursor: pointer;
  text-underline-offset: 2px;
}
.link:hover { text-decoration: underline; }

/* --------------------------------- Campos -------------------------------- */

.field { display: block; }
.field-label {
  display: block;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-2);
  margin-bottom: 4px;
}

input[type="text"], input[type="search"], select, textarea {
  width: 100%;
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface);
  color: var(--ink);
  font: inherit;
  font-size: 13.5px;
}

.search input { padding-left: 31px; }
textarea { min-height: 62px; resize: vertical; }
input::placeholder, textarea::placeholder { color: var(--ink-3); }
input:focus, select:focus, textarea:focus { border-color: var(--petrol-mid); }

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  align-items: end;
  padding: 12px 14px;
}

.filters .field { min-width: 132px; flex: 1 1 132px; }
.filters .field.wide { flex: 2 1 220px; }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }

.tab {
  padding: 5px 11px;
  border-radius: 7px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  font: inherit;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
}

.tab:hover { background: var(--surface-3); }
.tab[aria-pressed="true"] { background: var(--petrol); border-color: var(--petrol); color: #fff; }
:root[data-theme="dark"] .tab[aria-pressed="true"] { color: #071016; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tab[aria-pressed="true"] { color: #071016; } }

.tab .num { font-size: 11px; opacity: .75; margin-left: 3px; }

/* ------------------------------ Turno / ciclo ---------------------------- */

.shift-card { border-color: var(--petrol-line); }

.shift-top {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  justify-content: space-between;
  padding: 16px 16px 14px;
}

    CAMBIO_RESPONSABLE: 'Cambio de responsable', CERRAR: 'Cierre', REABRIR: 'Reapertura',
    COMENTAR: 'Comentario', SEGUIMIENTO: 'Seguimiento', TURNO_INICIAR: 'Inicio de turno',
    TURNO_RECIBIR: 'Recepción de turno', TURNO_ENTREGAR: 'Entrega de turno', TURNO_CERRAR: 'Cierre de turno',
    ELIMINAR: 'Eliminación', PERMISOS: 'Cambio de permisos'
  };

  const DEPARTMENTS = ['Recepción', 'Reservas', 'Housekeeping', 'Mantenimiento', 'Seguridad', 'A&B', 'Administración', 'Ventas', 'Sistemas', 'Otro'];


  // ------------------------------- Permisos -------------------------------
  const PERMISSION_GROUPS = [
    { group: 'Libro operativo', items: [['entry.create', 'Crear registros'], ['entry.edit', 'Editar registros'], ['entry.close', 'Cerrar registros'], ['entry.reopen', 'Reabrir registros'], ['entry.delete', 'Eliminar registros']] },
    { group: 'Tareas', items: [['task.create', 'Crear tareas'], ['task.assign', 'Asignar tareas'], ['task.close', 'Completar tareas']] },
    { group: 'Incidencias', items: [['incident.create', 'Crear incidencias'], ['incident.manage', 'Gestionar incidencias'], ['incident.close', 'Cerrar incidencias']] },
    { group: 'Turnos', items: [['shift.start', 'Iniciar turno'], ['shift.receive', 'Recibir turno'], ['shift.handover', 'Entregar turno'], ['shift.close', 'Cerrar turno'], ['shift.manage', 'Programar turnos']] },
    { group: 'Otros', items: [['followup.create', 'Crear seguimientos'], ['alert.manage', 'Gestionar alertas'], ['metrics.view', 'Ver indicadores'], ['audit.view', 'Ver auditoría'], ['guest.manage', 'Gestionar huéspedes y reservas'], ['user.manage', 'Administrar personal'], ['role.manage', 'Administrar roles'], ['system.configure', 'Configurar el sistema']] }
  ];
  const ALL_PERMISSIONS = PERMISSION_GROUPS.flatMap((g) => g.items.map((i) => i[0]));

  const OPERATIONAL_BASE = ['entry.create', 'entry.edit', 'entry.close', 'task.create', 'task.assign', 'task.close', 'incident.create', 'followup.create', 'alert.manage', 'shift.start', 'shift.receive', 'shift.handover', 'shift.close', 'guest.manage', 'metrics.view'];

  /** Matriz de permisos por defecto. El Administrador de sistema puede editarla. */
  const DEFAULT_ROLES = {
    RECEPCIONISTA: { name: 'Recepcionista', operational: true, permissions: OPERATIONAL_BASE.slice() },
    AUDITOR: { name: 'Auditor nocturno', operational: true, permissions: OPERATIONAL_BASE.concat(['incident.manage']) },
    SUPERVISOR: { name: 'Supervisor', operational: true, permissions: OPERATIONAL_BASE.concat(['entry.reopen', 'entry.delete', 'incident.manage', 'incident.close', 'shift.manage', 'audit.view']) },
    ADMIN: { name: 'Administrador de sistema', operational: false, permissions: ALL_PERMISSIONS.filter((p) => ['shift.start', 'shift.receive', 'shift.handover'].indexOf(p) < 0) }
  };
  const ROLE_ORDER = ['ADMIN', 'SUPERVISOR', 'AUDITOR', 'RECEPCIONISTA'];

  /**
   * Personal del hotel. Se llena desde la base de datos compartida; se mantiene
   * el nombre `USERS` para que las vistas no dependan del origen de los datos.
   */
  let USERS = [];
  const userById = (id) => USERS.find((u) => u.id === id) || null;
  const userName = (id) => { const u = userById(id); return u ? u.name : '—'; };

  // -------------------------------- Fechas --------------------------------
  const DAY = 86400000;
  const todayStart = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
  const at = (dayOffset, hour, minute) => {
    const d = todayStart();
    d.setDate(d.getDate() + dayOffset);
    d.setHours(hour, minute || 0, 0, 0);
    return d.toISOString();
  };
  const shiftDate = (dayOffset) => { const d = todayStart(); d.setDate(d.getDate() + dayOffset); return d.toISOString(); };

  const pad = (n) => String(n).padStart(2, '0');
  const fmtDate = (iso) => { if (!iso) return '—'; const d = new Date(iso); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); };
  const fmtShort = (iso) => { if (!iso) return '—'; const d = new Date(iso); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1); };
  const fmtTime = (iso) => { if (!iso) return '—'; const d = new Date(iso); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  const fmtDT = (iso) => !iso ? '—' : fmtShort(iso) + ' ' + fmtTime(iso);
  const relative = (iso) => {
    if (!iso) return '—';
    const diff = new Date(iso).getTime() - Date.now();
    const abs = Math.abs(diff);
    let q;
    if (abs < 60000) q = 'menos de 1 min';
    else if (abs < 3600000) q = Math.round(abs / 60000) + ' min';
    else if (abs < DAY) q = Math.round(abs / 3600000) + ' h';
    else q = Math.round(abs / DAY) + ' d';
    return diff >= 0 ? 'en ' + q : 'hace ' + q;
  };
  const isOverdue = (iso, open) => Boolean(iso) && open && new Date(iso).getTime() < Date.now();
  const money = (n) => n == null ? '—' : '$' + Number(n).toLocaleString('es-CL');


  // --------------------------- Estado y persistencia ----------------------
  /**
   * Los datos operativos viven en la base de datos compartida del artefacto:
   * persisten entre sesiones y se sincronizan en vivo entre todos los
   * dispositivos que tienen la página abierta. Sólo las preferencias del
   * dispositivo (quién soy, pestaña activa) quedan en este navegador.
   */
  const DEVICE_KEY = 'libro-operativo-dispositivo-v1';

  const state = {
    ready: false,
    dbMissing: false,
    dbError: null,
    loaded: {},
    hotel: { name: '', setupDone: false },
    roles: JSON.parse(JSON.stringify(DEFAULT_ROLES)),
    staff: [],
    shifts: [], handovers: [], entries: [], tasks: [], followups: [],
    alerts: [], guests: [], reservations: [], audit: [], archive: [],
    currentUserId: null,
    view: 'inicio',
    openHandover: null,
    tabs: { tareas: 'abiertas', alertas: 'activas', seguimientos: 'pendientes', incidencias: 'abiertas' },
    filters: { q: '', tipo: '', estado: '', clase: '', prioridad: '', area: '' },
    setupStep: 'cargando',
    configWritable: null,
    docCount: 0
  };

  let db = null;
  const deviceId = (function () {
    try {
      let id = localStorage.getItem(DEVICE_KEY + ':id');
      if (!id) { id = 'd' + Math.random().toString(36).slice(2, 10); localStorage.setItem(DEVICE_KEY + ':id', id); }
      return id;
    } catch (_) { return 'd' + Math.random().toString(36).slice(2, 10); }
  })();

  function readDevice() {
    try { return JSON.parse(localStorage.getItem(DEVICE_KEY) || '{}'); } catch (_) { return {}; }
  }
  function writeDevice(patch) {
    try {
      const next = Object.assign(readDevice(), patch);
      localStorage.setItem(DEVICE_KEY, JSON.stringify(next));
    } catch (_) { /* almacenamiento bloqueado: la sesión dura lo que la pestaña */ }
  }

  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  const me = () => userById(state.currentUserId);
  const myRole = () => {
    const user = me();
    return (user && state.roles[user.role]) || { name: 'Sin rol', operational: false, permissions: [] };
  };
  const can = (permission) => myRole().permissions.indexOf(permission) >= 0;
  const operationalUsers = () => USERS.filter((u) => state.roles[u.role] && state.roles[u.role].operational && u.active !== false);

  /**
   * El número visible de cada registro (#12, T#7) se deriva del orden de
   * creación, no de un contador compartido: la base de datos resuelve las
   * escrituras simultáneas por última-gana y un contador leído-y-escrito
   * podría repetir números.
   */
  function assignSeq(list, dateField) {
    list.slice()
      .sort(function (a, b) {
        const diff = new Date(a[dateField] || 0) - new Date(b[dateField] || 0);
        return diff !== 0 ? diff : String(a.id).localeCompare(String(b.id));
      })
      .forEach(function (item, index) { item.seq = index + 1; });
  }

  // --------------------------- Lectura en vivo ----------------------------
  const SUBSCRIPTIONS = [
    { key: 'staff', path: 'staff' },
    { key: 'shifts', path: 'shifts' },
    { key: 'handovers', path: 'handovers' },
    { key: 'entries', path: 'entries' },
    { key: 'tasks', path: 'tasks' },
    { key: 'followups', path: 'followups' },
    { key: 'alerts', path: 'alerts' },
    { key: 'guests', path: 'guests' },
    { key: 'reservations', path: 'reservations' }
  ];

  let renderQueued = false;
  function scheduleRender() {
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(function () { renderQueued = false; render(); });
  }

  function docsToArray(snapshot) {
    return snapshot.docs.map(function (doc) {
      return Object.assign({ id: doc.id }, doc.data());
    });
  }

  function onDbError(error) {
    state.dbError = error && error.code ? error.code : 'unavailable';
    if (state.dbError === 'revoked' || state.dbError === 'not_granted') state.ready = false;
    scheduleRender();
  }

  async function connect() {
    db = await window.claude.use('db');
    if (!db) {
      state.dbMissing = true;
      state.setupStep = 'sin-base';
      render();
      return;
    }

    db.doc('config/hotel').onSnapshot(function (snap) {
      state.hotel = snap.exists ? Object.assign({ name: '', setupDone: false }, snap.data()) : { name: '', setupDone: false };
      state.loaded.hotel = true;
      afterLoad();
    }, onDbError);

    db.doc('config/roles').onSnapshot(function (snap) {
      const stored = snap.exists ? snap.data() : null;
      state.roles = stored && stored.roles ? stored.roles : JSON.parse(JSON.stringify(DEFAULT_ROLES));
      state.loaded.roles = true;
      afterLoad();
    }, onDbError);

    SUBSCRIPTIONS.forEach(function (sub) {
      db.collection(sub.path).onSnapshot(function (snapshot) {
        state[sub.key] = docsToArray(snapshot);
        if (sub.key === 'staff') {
          USERS = state.staff.slice().sort(function (a, b) {
            const levelA = ROLE_ORDER.indexOf(a.role);
            const levelB = ROLE_ORDER.indexOf(b.role);
            return levelA !== levelB ? levelA - levelB : String(a.name).localeCompare(String(b.name));
          });
        }
        if (sub.key === 'entries') assignSeq(state.entries, 'occurredAt');
        if (sub.key === 'tasks') assignSeq(state.tasks, 'createdAt');
        state.loaded[sub.key] = true;
        afterLoad();
      }, onDbError);
    });

    // Auditoría: un documento por día y persona, para que dos personas
    // escribiendo a la vez no se sobrescriban entre sí.
    db.collection('audit').orderBy('day', 'desc').limit(60).onSnapshot(function (snapshot) {
      const events = [];
      snapshot.docs.forEach(function (doc) {
        const body = doc.data();
        (body.events || []).forEach(function (event) { events.push(event); });
      });
      events.sort((a, b) => new Date(b.at) - new Date(a.at));
      state.audit = events.slice(0, 300);
      state.loaded.audit = true;
      afterLoad();
    }, onDbError);
  }

  function afterLoad() {
    const pending = ['hotel', 'roles', 'staff', 'shifts', 'handovers', 'entries', 'tasks', 'followups', 'alerts', 'guests', 'reservations', 'audit']
      .filter((key) => !state.loaded[key]);
    if (pending.length > 0) { scheduleRender(); return; }

    if (!state.ready) {
      state.ready = true;
      const device = readDevice();
      if (device.staffId && state.staff.some((s) => s.id === device.staffId && s.active !== false)) {
        state.currentUserId = device.staffId;
      }
      if (device.view) state.view = device.view;
      resolveStep();
      scheduleRender();
      // El motor de alertas corre una vez al abrir y luego cada 4 minutos.
      runAlertEngine();
      setInterval(runAlertEngine, 240000);
      return;
    }

    // Si la persona elegida en este dispositivo fue desactivada o eliminada.
    if (state.currentUserId && !state.staff.some((s) => s.id === state.currentUserId && s.active !== false)) {
      state.currentUserId = null;
      writeDevice({ staffId: null });
    }
    resolveStep();
    scheduleRender();
  }

  function resolveStep() {
    if (!state.hotel.setupDone || state.staff.length === 0) state.setupStep = 'configuracion';
    else if (!state.currentUserId) state.setupStep = 'identidad';
    else state.setupStep = 'listo';
  }

  // ------------------------------ Escritura -------------------------------
  /** Traduce los códigos de error de la base de datos a lenguaje operativo. */
  function describeDbError(error) {
    const code = error && error.code ? error.code : 'unavailable';
    if (code === 'invalid_argument') return 'No tienes permiso de edición sobre esta página para ese cambio.';
    if (code === 'quota_exceeded') return 'La base de datos está llena. Archiva registros cerrados desde Administración.';
    if (code === 'resource_exhausted') return 'Demasiadas operaciones seguidas. Espera unos segundos y reintenta.';
    if (code === 'revoked') return 'Se retiró tu acceso a esta página mientras la usabas. Vuelve a abrirla.';
    if (code === 'not_granted') return 'Esta vista no tiene acceso a la base de datos.';
    return 'No se pudo guardar. Revisa la conexión y reintenta.';
  }

  async function write(operation, successMessage) {
    if (!db) { fail('Sin conexión a la base de datos.'); return false; }
    try {
      await operation();
      if (successMessage) toast(successMessage, 'ok');
      return true;
    } catch (error) {
      console.error('[base de datos]', error);
      fail(describeDbError(error));
      return false;
    }
  }

  const setDoc = (path, data) => db.doc(path).set(data);
  const updateDoc = (path, data) => db.doc(path).update(data);

  /** Registra un evento de auditoría en el documento del día de esta persona. */
  async function pushAudit(action, entity, summary) {
    if (!db || !state.currentUserId) return;
    const day = new Date().toISOString().slice(0, 10);
    const path = 'audit/' + day + '_' + state.currentUserId;
    const event = { at: new Date().toISOString(), action: action, entity: entity, actor: state.currentUserId, summary: summary };
    try {
      const snap = await db.doc(path).get();
      const events = snap.exists ? (snap.data().events || []).slice() : [];
      events.push(event);
      // Un documento por día y persona: se acota para no superar su tamaño.
      await db.doc(path).set({ day: day, actor: state.currentUserId, events: events.slice(-400) });
    } catch (error) {
      console.error('[auditoría] no se pudo registrar', error);
    }
  }

  // --------------------------- Utilidades de vista -------------------------
  const esc = (value) => String(value == null ? '' : value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  const badge = (tone, text) => '<span class="badge" data-tone="' + tone + '"><span class="glyph" aria-hidden="true">' + TONE[tone] + '</span>' + esc(text) + '</span>';
  const chip = (text) => '<span class="chip">' + esc(text) + '</span>';

  let toastSeq = 0;
  function toast(message, kind) {
    const host = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = 'toast';
    el.dataset.kind = kind || 'info';
    el.textContent = message;
    el.id = 'toast-' + (++toastSeq);
    host.appendChild(el);
    while (host.children.length > 2) host.firstElementChild.remove();
    setTimeout(function () { el.remove(); }, kind === 'error' ? 5200 : 3400);
  }


  // ------------------------ Reglas de turno (dominio) ---------------------
  const shiftById = (id) => state.shifts.find((s) => s.id === id) || null;
  const handoverFrom = (shiftId) => state.handovers.find((h) => h.fromShiftId === shiftId) || null;

  function slot(type, direction) {
    const index = ORDER.indexOf(type);
    if (direction === 'next') return { type: ORDER[(index + 1) % 3], dayOffset: index === 2 ? 1 : 0 };
    return { type: ORDER[(index + 2) % 3], dayOffset: index === 0 ? -1 : 0 };
  }

  function neighbour(shift, direction) {
    const s = slot(shift.type, direction);
    const target = new Date(shift.date);
    target.setDate(target.getDate() + s.dayOffset);
    const key = target.toDateString();
    return state.shifts.find((x) => x.type === s.type && new Date(x.date).toDateString() === key) || null;
  }

  const myOpenShift = () => state.shifts.find((s) => s.staff.indexOf(state.currentUserId) >= 0 && ['INICIADO', 'ACTIVO', 'PREPARANDO_ENTREGA', 'ENTREGA_ENVIADA', 'RECIBIDO'].indexOf(s.status) >= 0) || null;
  const startableShifts = () => state.shifts.filter((s) => s.status === 'PROGRAMADO' && s.staff.indexOf(state.currentUserId) >= 0);

  function incomingHandover(shift) {
    const previous = neighbour(shift, 'previous');
    if (previous) {
      const h = state.handovers.find((x) => x.fromShiftId === previous.id && x.status === 'ENVIADA');
      if (h) return h;
    }
    return state.handovers.find((x) => x.toShiftId === shift.id && x.status === 'ENVIADA') || null;
  }



  // --------------------------- Motor de alertas ---------------------------
  /**
   * Mismas reglas que la aplicación de servidor. Cada alerta automática se
   * guarda en un documento cuyo identificador ES su clave de deduplicación:
   * la base de datos garantiza por construcción que no haya duplicados, sin
   * necesidad de transacciones.
   *
   * Para que varios dispositivos abiertos no escriban lo mismo a la vez, el
   * motor toma un arriendo corto (`acquire`) antes de escribir.
   */
  function collectCandidates() {
    const now = Date.now();
    const candidates = [];

    state.tasks.forEach(function (t) {
      if (t.deleted || TASK_OPEN.indexOf(t.status) < 0 || !t.dueAt) return;
      if (new Date(t.dueAt).getTime() >= now) return;
      candidates.push({ key: 'task-overdue:' + t.id, type: 'TAREA_VENCIDA', level: 'CRITICA', title: 'Tarea vencida: ' + t.title, message: 'Venció ' + relative(t.dueAt) + ' y sigue abierta.', taskId: t.id, dueAt: t.dueAt });
    });

    state.entries.forEach(function (e) {
      if (e.deleted || ENTRY_OPEN.indexOf(e.status) < 0) return;
      if (e.type === 'INCIDENCIA' && e.severity === 'CRITICA') {
        candidates.push({ key: 'incident-critical:' + e.id, type: 'INCIDENCIA_CRITICA', level: 'CRITICA', title: 'Incidencia crítica abierta: ' + e.title, message: 'Requiere atención inmediata y seguimiento hasta su cierre.', entryId: e.id });
      }
      if (e.type === 'MANTENIMIENTO' && new Date(e.occurredAt).getTime() < now - 24 * 3600000) {
        candidates.push({ key: 'maintenance-stale:' + e.id, type: 'MANTENIMIENTO_SIN_RESOLVER', level: 'ATENCION', title: 'Mantenimiento sin resolver: ' + e.title, message: 'Abierto desde ' + fmtDT(e.occurredAt) + ' sin resolución.', entryId: e.id });
      }
      if (e.type === 'HUESPED' && e.followUp) {
        candidates.push({ key: 'guest-request:' + e.id, type: 'SOLICITUD_HUESPED_PENDIENTE', level: 'ATENCION', title: 'Solicitud de huésped pendiente: ' + e.title, message: 'La solicitud sigue abierta y requiere seguimiento.', entryId: e.id, guestId: e.guestId || null });
      }
    });

    state.followups.forEach(function (f) {
      if (f.status !== 'PENDIENTE' && f.status !== 'VENCIDO') return;
      if (!f.scheduledAt || new Date(f.scheduledAt).getTime() >= now) return;
      candidates.push({ key: 'followup-overdue:' + f.id, type: 'SEGUIMIENTO_VENCIDO', level: 'ATENCION', title: 'Seguimiento vencido: ' + f.action, message: 'Estaba programado para ' + fmtDT(f.scheduledAt) + '.', followUpId: f.id, entryId: f.entryId || null, dueAt: f.scheduledAt });
    });

    state.handovers.forEach(function (h) {
      if (h.status !== 'ENVIADA' || !h.issuedAt) return;
      if (new Date(h.issuedAt).getTime() >= now - 3600000) return;
      const from = shiftById(h.fromShiftId);
      if (!from) return;
      candidates.push({ key: 'handover-pending:' + h.id, type: 'ENTREGA_TURNO_PENDIENTE', level: 'ATENCION', title: 'Entrega de turno sin confirmar', message: 'La entrega del turno ' + SHIFT_TYPE[from.type] + ' del ' + fmtDate(from.date) + ' sigue sin ser recibida.', handoverId: h.id });
    });

    const endOfToday = todayStart().getTime() + DAY - 1;
    state.reservations.forEach(function (r) {
      if (r.status === 'CANCELADA' || r.status === 'SALIDA') return;
      const guest = state.guests.find((g) => g.id === r.guestId);
      const who = guest ? guest.name : 'Reserva ' + r.code;
      const room = r.room ? ' (hab. ' + r.room + ')' : '';
      if (r.guarantee === 'PENDIENTE') candidates.push({ key: 'guarantee:' + r.id, type: 'GARANTIA_PENDIENTE', level: 'ATENCION', title: 'Garantía pendiente: ' + who + room, message: 'La reserva ' + r.code + ' no tiene garantía válida registrada.', reservationId: r.id, guestId: r.guestId || null });
      if (r.guarantee === 'RECHAZADA') candidates.push({ key: 'card:' + r.id, type: 'TARJETA_INVALIDA', level: 'CRITICA', title: 'Tarjeta rechazada: ' + who + room, message: 'La garantía de la reserva ' + r.code + ' fue rechazada. Solicitar medio de pago alternativo.', reservationId: r.id, guestId: r.guestId || null });
      if (r.balance > 0) candidates.push({ key: 'payment:' + r.id, type: 'PAGO_PENDIENTE', level: 'ATENCION', title: 'Cobro pendiente: ' + who + room, message: 'Saldo pendiente de ' + money(r.balance) + ' en la reserva ' + r.code + '.', reservationId: r.id, guestId: r.guestId || null });
      if (r.status === 'PENDIENTE' && r.checkIn && new Date(r.checkIn).getTime() <= endOfToday) candidates.push({ key: 'unconfirmed:' + r.id, type: 'RESERVA_SIN_CONFIRMAR', level: 'ATENCION', title: 'Reserva sin confirmar con llegada inminente: ' + who, message: 'La reserva ' + r.code + ' llega el ' + fmtDate(r.checkIn) + ' y sigue sin confirmar.', reservationId: r.id, guestId: r.guestId || null, dueAt: r.checkIn });
      if (guest && guest.vip && r.checkIn && new Date(r.checkIn).getTime() <= endOfToday && r.status !== 'EN_CASA') candidates.push({ key: 'vip:' + r.id, type: 'HUESPED_VIP', level: 'INFORMATIVA', title: 'Llegada VIP: ' + who + room, message: 'Coordinar atención preferente, amenidad y acompañamiento a la habitación.', reservationId: r.id, guestId: r.guestId || null, dueAt: r.checkIn });
      const coveredManually = state.alerts.some((a) => !a.auto && a.reservationId === r.id && a.status !== 'RESUELTA');
      if (r.action && r.guarantee !== 'RECHAZADA' && !coveredManually) candidates.push({ key: 'action:' + r.id, type: 'TRASLADO_PENDIENTE', level: 'ATENCION', title: 'Reserva requiere acción: ' + who + room, message: r.action, reservationId: r.id, guestId: r.guestId || null });
    });

    return candidates;
  }

  const alertIsLive = (a) => {
    if (a.deleted) return false;
    if (a.status === 'RESUELTA') return false;
    if (a.status === 'POSPUESTA') return a.snoozedUntil ? new Date(a.snoozedUntil).getTime() <= Date.now() : true;
    return true;
  };
  const liveAlerts = () => state.alerts.filter(alertIsLive);

  let engineRunning = false;

  async function runAlertEngine(options) {
    if (!db || !state.ready || engineRunning) return null;
    const announce = options && options.announce;
    engineRunning = true;
    try {
      const candidates = collectCandidates();
      const byKey = {};
      candidates.forEach(function (c) { byKey[c.key] = c; });

      const creates = candidates.filter((c) => !state.alerts.some((a) => a.id === c.key));
      const reopens = state.alerts.filter((a) => a.auto && a.status === 'RESUELTA' && byKey[a.id]);
      const stale = state.alerts.filter((a) => a.auto && a.status !== 'RESUELTA' && !a.deleted && !byKey[a.id]);
      const overdueFollowups = state.followups.filter((f) => f.status === 'PENDIENTE' && f.scheduledAt && new Date(f.scheduledAt).getTime() < Date.now());

      if (creates.length === 0 && reopens.length === 0 && stale.length === 0 && overdueFollowups.length === 0) {
        if (announce) toast('Alertas al día: no hay cambios.', 'ok');
        return { created: 0, reopened: 0, resolved: 0 };
      }

      // Un solo dispositivo escribe por vez.
      const lease = await db.doc('locks/motor-alertas').acquire({ holder: deviceId, ttlMs: 20000 });
      if (!lease.acquired) {
        if (announce) toast('Otro dispositivo está actualizando las alertas en este momento.', 'ok');
        return null;
      }

      const now = new Date().toISOString();

      for (const candidate of creates) {
        await db.doc('alerts/' + candidate.key).set({
          type: candidate.type, level: candidate.level, title: candidate.title,
          message: candidate.message || null, status: 'NUEVA', auto: true,
          dueAt: candidate.dueAt || null, entryId: candidate.entryId || null,
          taskId: candidate.taskId || null, followUpId: candidate.followUpId || null,
          handoverId: candidate.handoverId || null, reservationId: candidate.reservationId || null,
          guestId: candidate.guestId || null, createdAt: now, createdBy: null, deleted: false
        });
      }

      for (const alert of reopens) {
        const candidate = byKey[alert.id];
        await db.doc('alerts/' + alert.id).update({
          status: 'NUEVA', resolvedAt: null, resolvedBy: null, resolutionNote: null,
          level: candidate.level, title: candidate.title, message: candidate.message || null
        });
      }

      for (const alert of stale) {
        await db.doc('alerts/' + alert.id).update({
          status: 'RESUELTA', resolvedAt: now, resolvedBy: null,
          resolutionNote: 'Resuelta automáticamente: la condición de origen ya no se cumple.'
        });
      }

      for (const followUp of overdueFollowups) {
        await db.doc('followups/' + followUp.id).update({ status: 'VENCIDO' });
      }

      const result = { created: creates.length, reopened: reopens.length, resolved: stale.length };
      if (announce) {
        toast('Motor de alertas: ' + result.created + ' nueva(s), ' + result.reopened + ' reabierta(s), ' + result.resolved + ' resuelta(s).', 'ok');
      }
      return result;
    } catch (error) {
      console.error('[alertas] el motor falló', error);
      if (announce) fail(describeDbError(error));
      return null;
    } finally {
      engineRunning = false;
    }
  }

  // ------------------- Resumen automático de la entrega -------------------
  function buildSnapshot() {
    const items = [];
    const levelFromPriority = { CRITICA: 'URGENTE', ALTA: 'IMPORTANTE', MEDIA: 'INFORMATIVO', BAJA: 'INFORMATIVO' };
    const levelFromSeverity = { CRITICA: 'URGENTE', ALTA: 'URGENTE', MEDIA: 'IMPORTANTE', BAJA: 'INFORMATIVO' };

    const openEntries = state.entries.filter((e) => !e.deleted && ENTRY_OPEN.indexOf(e.status) >= 0);
    const openTasks = state.tasks.filter((t) => !t.deleted && TASK_OPEN.indexOf(t.status) >= 0);
    const openFollowups = state.followups.filter((f) => f.status === 'PENDIENTE' || f.status === 'VENCIDO');

    openEntries.forEach(function (e) {
      const guest = state.guests.find((g) => g.id === e.guestId);
      const detail = [e.description.slice(0, 190), e.department ? 'Área: ' + e.department : null,
        e.ownerId ? 'Responsable: ' + userName(e.ownerId) : 'Sin responsable asignado',
        e.dueAt ? 'Vence: ' + fmtDT(e.dueAt) : null,
        guest ? guest.name + (guest.room ? ' · hab. ' + guest.room : '') : null].filter(Boolean).join(' · ');
      const section = e.type === 'INCIDENCIA' ? 'Incidencias abiertas'
        : e.type === 'MANTENIMIENTO' ? 'Mantenimiento'
        : e.type === 'HUESPED' ? 'Solicitudes de huéspedes' : 'Novedades activas';
      items.push({ level: e.severity ? levelFromSeverity[e.severity] : levelFromPriority[e.priority], section: section, title: '#' + e.seq + ' ' + e.title, detail: detail, refType: 'entry', refId: e.id });
    });

    openTasks.forEach(function (t) {
      const overdue = isOverdue(t.dueAt, true);
      items.push({
        level: overdue ? 'URGENTE' : levelFromPriority[t.priority],
        section: 'Tareas pendientes',
        title: '#' + t.seq + ' ' + t.title,
        detail: ['Prioridad ' + PRIORITY[t.priority], t.assigneeId ? 'Asignada a ' + userName(t.assigneeId) : 'Sin asignar',
          t.dueAt ? (overdue ? 'VENCIDA' : 'Vence') + ': ' + fmtDT(t.dueAt) : 'Sin fecha límite'].join(' · '),
        refType: 'task', refId: t.id
      });
    });

    openFollowups.forEach(function (f) {
      const overdue = f.status === 'VENCIDO';
      items.push({
        level: overdue ? 'URGENTE' : 'IMPORTANTE',
        section: 'Seguimientos próximos',
        title: f.action,
        detail: [f.nextAction ? 'Próxima acción: ' + f.nextAction : null, 'Responsable: ' + userName(f.ownerId),
          f.scheduledAt ? (overdue ? 'VENCIDO' : 'Programado') + ': ' + fmtDT(f.scheduledAt) : 'Sin fecha'].filter(Boolean).join(' · '),
        refType: 'followup', refId: f.id
      });
    });

    state.reservations.forEach(function (r) {
      const guest = state.guests.find((g) => g.id === r.guestId);
      const who = guest ? guest.name : 'Reserva ' + r.code;
      const room = r.room ? ' · hab. ' + r.room : '';
      const stay = 'Llegada ' + fmtDT(r.checkIn) + ' · Salida ' + fmtDT(r.checkOut);
      if (r.balance > 0) items.push({ level: 'URGENTE', section: 'Cobros pendientes', title: who + room + ' · saldo ' + money(r.balance), detail: 'Reserva ' + r.code + '. ' + stay, refType: 'reservation', refId: r.id });
      if (r.guarantee === 'PENDIENTE' || r.guarantee === 'RECHAZADA') items.push({ level: r.guarantee === 'RECHAZADA' ? 'URGENTE' : 'IMPORTANTE', section: 'Garantías pendientes', title: who + room + ' · garantía ' + (r.guarantee === 'RECHAZADA' ? 'rechazada' : 'pendiente'), detail: 'Reserva ' + r.code + '. ' + stay, refType: 'reservation', refId: r.id });
      if (r.action || r.status === 'PENDIENTE') items.push({ level: r.action ? 'IMPORTANTE' : 'INFORMATIVO', section: 'Reservas que requieren acción', title: who + room + (guest && guest.vip ? ' · VIP' : ''), detail: [r.action, 'Reserva ' + r.code + ' en estado ' + r.status, stay].filter(Boolean).join(' · '), refType: 'reservation', refId: r.id });
    });

    // Cada asunto se menciona una sola vez: se omiten las alertas automáticas
    // que sólo reflejan un objeto ya listado en otra sección.
    const listed = {
      entry: openEntries.map((e) => e.id),
      task: openTasks.map((t) => t.id),
      followUp: openFollowups.map((f) => f.id),
      reservation: state.reservations.map((r) => r.id)
    };
    liveAlerts().forEach(function (a) {
      const duplicate = a.auto && (
        (a.entryId && listed.entry.indexOf(a.entryId) >= 0) ||
        (a.taskId && listed.task.indexOf(a.taskId) >= 0) ||
        (a.followUpId && listed.followUp.indexOf(a.followUpId) >= 0) ||
        (a.reservationId && listed.reservation.indexOf(a.reservationId) >= 0));
      if (duplicate) return;
      items.push({
        level: a.level === 'CRITICA' ? 'URGENTE' : a.level === 'ATENCION' ? 'IMPORTANTE' : 'INFORMATIVO',
        section: 'Alertas activas',
        title: ALERT_TYPE[a.type] + ': ' + a.title,
        detail: a.message || null,
        refType: 'alert', refId: a.id
      });
    });

    return items;
  }

      });

  ACTIONS['toggle-staff'] = async function (staffId) {
    if (!can('user.manage')) return fail('Tu rol no puede administrar el personal.');
    const person = state.staff.find((s) => s.id === staffId);
    if (!person) return;
    if (person.id === state.currentUserId) return fail('No puedes desactivar tu propia cuenta.');
    const nextActive = person.active === false;
    if (!nextActive && person.role === 'ADMIN') {
      const otherAdmins = state.staff.filter((s) => s.role === 'ADMIN' && s.active !== false && s.id !== staffId);
      if (otherAdmins.length === 0) return fail('Debe quedar al menos un Administrador de sistema activo.');
    }
    const ok = await write(function () { return updateDoc('staff/' + staffId, { active: nextActive }); },
      nextActive ? person.name + ' reactivada.' : person.name + ' desactivada.');
    if (ok) await pushAudit('EDITAR', 'Personal', (nextActive ? 'Reactivada ' : 'Desactivada ') + person.name);
  };

  ACTIONS['toggle-permission'] = async function (args) {
    if (!can('role.manage')) return fail('Tu rol no puede administrar permisos.');
    const parts = args.split('|');
    const roleKey = parts[0];
    const permission = parts[1];
    const roles = JSON.parse(JSON.stringify(state.roles));
    const role = roles[roleKey];
    if (!role) return;
    const index = role.permissions.indexOf(permission);
    if (index >= 0) {
      if (roleKey === 'ADMIN' && ['user.manage', 'role.manage', 'system.configure'].indexOf(permission) >= 0) {
        return fail('El Administrador de sistema no puede perder ' + permission + ': es necesario para recuperar el sistema.');
      }
      role.permissions.splice(index, 1);
    } else {
      role.permissions.push(permission);
    }
    const ok = await write(function () { return setDoc('config/roles', { roles: roles }); }, 'Permisos de ' + role.name + ' actualizados.');
    if (ok) await pushAudit('PERMISOS', 'Rol', 'Permisos de ' + role.name + ' actualizados (' + role.permissions.length + ')');
  };

  // -------------------------------- Turnos --------------------------------
  ACTIONS['schedule-shifts'] = async function () {
    if (!can('shift.manage')) return fail('Tu rol no puede programar turnos.');
    const date = val('sched-date');
    if (!date) return fail('Elige la fecha.');
    const day = new Date(date + 'T00:00:00');
    if (Number.isNaN(day.getTime())) return fail('Fecha inválida.');

    const assignments = {
      MANANA: val('sched-manana'),
      TARDE: val('sched-tarde'),
      NOCHE: val('sched-noche')
    };
    const iso = day.toISOString();
    const key = date.replace(/-/g, '');

    const ok = await write(async function () {
      for (const type of ORDER) {
        const staffId = assignments[type];
        const id = 's' + key + type.slice(0, 3);
        const existing = state.shifts.find((s) => s.id === id);
        if (existing && existing.status !== 'PROGRAMADO') continue;
        if (!staffId && !existing) continue;
        await setDoc('shifts/' + id, {
          date: iso, type: type,
          status: existing ? existing.status : 'PROGRAMADO',
          staff: staffId ? [staffId] : [],
          startedAt: existing ? existing.startedAt || null : null,
          endedAt: existing ? existing.endedAt || null : null,
          createdAt: existing ? existing.createdAt : new Date().toISOString()
        });
      }
    }, 'Turnos del ' + fmtDate(iso) + ' programados.');

    if (ok) await pushAudit('EDITAR', 'Turno', 'Programación de turnos del ' + fmtDate(iso));
  };

  ACTIONS['start-shift'] = async function (shiftId) {
    const shift = shiftById(shiftId);
    if (!shift) return;
    if (!myRole().operational) return fail('El Administrador de sistema no participa en la operación de turnos. Cambia a una cuenta operativa.');
    if (!can('shift.start')) return fail('Tu rol no tiene el permiso shift.start.');
    if (shift.staff.indexOf(state.currentUserId) < 0) return fail('No estás asignado a este turno.');
    const open = myOpenShift();
    if (open && OCCUPYING.indexOf(open.status) >= 0) {
      return fail('Ya tienes el turno ' + SHIFT_TYPE[open.type] + ' del ' + fmtDate(open.date) + ' en estado ' + SHIFT_LABEL[open.status] + '. Ciérralo o entrégalo antes de iniciar otro.');
    }
    if (SHIFT_TRANSITIONS[shift.status].indexOf('INICIADO') < 0) return fail('Transición no permitida: ' + SHIFT_LABEL[shift.status] + ' → Iniciado.');

    const ok = await write(function () {
      return updateDoc('shifts/' + shiftId, { status: 'INICIADO', startedAt: new Date().toISOString(), startedBy: state.currentUserId });
    }, 'Turno iniciado. Revisa y confirma la entrega anterior.');
    if (ok) {
      state.view = 'turno';
      await pushAudit('TURNO_INICIAR', 'Turno', 'Inicio de turno ' + SHIFT_TYPE[shift.type] + ' del ' + fmtDate(shift.date));
    }
  };

  ACTIONS.receive = async function (shiftId) {
    const shift = shiftById(shiftId);
    if (!shift) return;
    if (!can('shift.receive')) return fail('Tu rol no tiene el permiso shift.receive.');
    if (shift.staff.indexOf(state.currentUserId) < 0) return fail('No estás asignado a este turno.');

    const incoming = incomingHandover(shift);
    if (incoming && incoming.status === 'RECIBIDA') return fail('Esa entrega ya fue recibida y confirmada.');
    if (SHIFT_TRANSITIONS[shift.status].indexOf('ACTIVO') < 0) return fail('Transición no permitida: ' + SHIFT_LABEL[shift.status] + ' → Turno activo.');

    const observations = (val('receive-obs') || '').trim();
    const now = new Date().toISOString();

    const ok = await write(async function () {
      if (incoming) {
        await updateDoc('handovers/' + incoming.id, {
          status: 'RECIBIDA', receivedBy: state.currentUserId, receivedAt: now,
          receiverObservations: observations || null,
          toShiftId: incoming.toShiftId || shift.id
        });
        const from = shiftById(incoming.fromShiftId);
        if (from && from.status === 'ENTREGA_ENVIADA') {
          await updateDoc('shifts/' + from.id, { status: 'CERRADO', endedAt: now });
        }
        const pending = state.alerts.filter((a) => a.handoverId === incoming.id && a.auto && a.status !== 'RESUELTA');
        for (const alert of pending) {
          await updateDoc('alerts/' + alert.id, { status: 'RESUELTA', resolvedAt: now, resolvedBy: state.currentUserId, resolutionNote: 'Entrega recibida.' });
        }
      }
      await updateDoc('shifts/' + shiftId, { status: 'ACTIVO' });
    }, incoming ? 'Recepción confirmada. Tu turno está activo.' : 'Turno activado. Quedó constancia de que no había entrega previa.');

    if (ok) {
      await pushAudit('TURNO_RECIBIR', 'Turno', incoming
        ? 'Recepción de turno confirmada' + (observations ? ' — ' + observations : '')
        : 'Turno activado sin entrega previa pendiente');
      runAlertEngine();
    }
  };

  ACTIONS.prepare = async function (shiftId) {
    const shift = shiftById(shiftId);
    if (!shift) return;
    if (!can('shift.handover')) return fail('Tu rol no tiene el permiso shift.handover.');
    if (shift.staff.indexOf(state.currentUserId) < 0) return fail('Sólo quien está en el turno puede preparar su entrega.');
    const existing = handoverFrom(shift.id);
    if (existing && existing.status !== 'BORRADOR') return fail('Este turno ya envió su entrega.');
    if (shift.status !== 'PREPARANDO_ENTREGA' && SHIFT_TRANSITIONS[shift.status].indexOf('PREPARANDO_ENTREGA') < 0) {
      return fail('Transición no permitida: ' + SHIFT_LABEL[shift.status] + ' → Preparando entrega.');
    }

    const next = neighbour(shift, 'next');
    const generated = buildSnapshot();
    const handoverId = existing ? existing.id : 'h' + shift.id;
    const manual = existing ? (existing.items || []).filter((i) => i.manual) : [];

    const ok = await write(async function () {
      await setDoc('handovers/' + handoverId, {
        fromShiftId: shift.id, toShiftId: next ? next.id : null,
        status: 'BORRADOR', issuedBy: state.currentUserId,
        issuedAt: existing ? existing.issuedAt || null : null,
        receivedBy: null, receivedAt: null,
        notes: existing ? existing.notes || '' : '',
        receiverObservations: null,
        items: generated.concat(manual),
        createdAt: existing ? existing.createdAt : new Date().toISOString()
      });
      if (shift.status !== 'PREPARANDO_ENTREGA') {
        await updateDoc('shifts/' + shift.id, { status: 'PREPARANDO_ENTREGA' });
      }
    }, 'Resumen de entrega generado: ' + generated.length + ' puntos. Revísalo, agrega notas y envíalo.');

    if (ok) {
      state.view = 'entrega';
      state.openHandover = handoverId;
      await pushAudit('CAMBIO_ESTADO', 'Turno', 'Turno en preparación de entrega (' + generated.length + ' puntos generados)');
    }
  };

  ACTIONS.regenerate = async function (handoverId) {
    const handover = state.handovers.find((h) => h.id === handoverId);
    if (!handover || handover.status !== 'BORRADOR') return fail('La entrega ya fue enviada.');
    const manual = (handover.items || []).filter((i) => i.manual);
    const generated = buildSnapshot();
    await write(function () { return updateDoc('handovers/' + handoverId, { items: generated.concat(manual) }); },
      'Resumen actualizado con el estado actual (' + generated.length + ' puntos). Tus notas manuales se conservaron.');
  };

  ACTIONS['add-note'] = async function (handoverId) {
    const handover = state.handovers.find((h) => h.id === handoverId);
    if (!handover || handover.status !== 'BORRADOR') return fail('La entrega ya fue enviada: no admite nuevas notas.');
    const title = (val('note-title') || '').trim();
    const detail = (val('note-detail') || '').trim();
    const level = val('note-level') || 'IMPORTANTE';
    if (title.length < 3) return fail('Escribe la nota (mínimo 3 caracteres).');
    const items = (handover.items || []).concat([{ level: level, section: 'Observaciones del turno', title: title, detail: detail || null, manual: true }]);
    await write(function () { return updateDoc('handovers/' + handoverId, { items: items }); }, 'Nota agregada a la entrega.');
  };

  ACTIONS['remove-note'] = async function (args) {
    const parts = args.split('|');
    const handover = state.handovers.find((h) => h.id === parts[0]);
    if (!handover || handover.status !== 'BORRADOR') return fail('La entrega ya fue enviada.');
    const items = (handover.items || []).slice();
    items.splice(Number(parts[1]), 1);
    await write(function () { return updateDoc('handovers/' + handover.id, { items: items }); }, 'Nota eliminada de la entrega.');
  };

  ACTIONS.send = async function (shiftId) {
    const shift = shiftById(shiftId);
    if (!shift) return;
    if (!can('shift.handover')) return fail('Tu rol no tiene el permiso shift.handover.');
    const handover = handoverFrom(shift.id);
    if (!handover) return fail('Primero debes preparar la entrega.');
    if (handover.status !== 'BORRADOR') return fail('Esta entrega ya fue enviada.');
    if (SHIFT_TRANSITIONS[shift.status].indexOf('ENTREGA_ENVIADA') < 0) return fail('Transición no permitida: ' + SHIFT_LABEL[shift.status] + ' → Entrega enviada.');

    const notes = (val('handover-notes') || '').trim();
    const now = new Date().toISOString();

    const ok = await write(async function () {
      await updateDoc('handovers/' + handover.id, {
        status: 'ENVIADA', issuedAt: now, issuedBy: state.currentUserId, notes: notes, snapshotAt: now
      });
      await updateDoc('shifts/' + shift.id, { status: 'ENTREGA_ENVIADA' });
    }, 'Entrega enviada. El turno siguiente debe confirmarla.');

    if (ok) await pushAudit('TURNO_ENTREGAR', 'Entrega de turno', 'Entrega enviada por ' + me().name + ' (' + (handover.items || []).length + ' puntos)');
  };

  ACTIONS['cancel-prep'] = async function (shiftId) {
    const shift = shiftById(shiftId);
    const handover = handoverFrom(shiftId);
    if (handover && handover.status !== 'BORRADOR') return fail('La entrega ya fue enviada: no puede cancelarse.');
    const ok = await write(async function () {
      if (handover) await db.doc('handovers/' + handover.id).delete();
      await updateDoc('shifts/' + shiftId, { status: 'ACTIVO' });
    }, 'Preparación cancelada. Tu turno sigue activo.');
    if (ok) {
      state.view = 'turno';
      await pushAudit('CAMBIO_ESTADO', 'Turno', 'Preparación de entrega cancelada del turno ' + SHIFT_TYPE[shift.type]);
    }
  };

  ACTIONS['close-shift'] = async function (shiftId) {
    const shift = shiftById(shiftId);
    if (!shift) return;
    if (!can('shift.close')) return fail('Tu rol no tiene el permiso shift.close.');
    const next = neighbour(shift, 'next');
    const handover = handoverFrom(shift.id);
    const hasNext = Boolean(next) && next.status !== 'CERRADO' && next.status !== 'ANULADO';

    if (hasNext) {

      return fail('No puedes cerrar un turno en estado ' + SHIFT_LABEL[shift.status] + '.');
    }

    const ok = await write(function () {
      return updateDoc('shifts/' + shiftId, { status: 'CERRADO', endedAt: new Date().toISOString(), closedBy: state.currentUserId });
    }, 'Turno cerrado.');
    if (ok) await pushAudit('TURNO_CERRAR', 'Turno', 'Turno ' + SHIFT_TYPE[shift.type] + ' del ' + fmtDate(shift.date) + ' cerrado por ' + me().name);

    };

  ACTIONS['entry-status'] = async function (args) {
    const parts = args.split('|');
    const entry = state.entries.find((e) => e.id === parts[0]);
    if (!entry) return;
    const next = parts[1];
    const closing = next === 'CERRADO' || next === 'RESUELTO';
    const reopening = (entry.status === 'CERRADO' || entry.status === 'RESUELTO') && ENTRY_OPEN.indexOf(next) >= 0;

    if (closing && !can('entry.close') && !can('incident.close')) return fail('Tu rol no tiene permiso para cerrar registros.');
    if (reopening && !can('entry.reopen')) return fail('Tu rol no tiene el permiso entry.reopen. Un supervisor puede reabrirlo.');

    if (next === 'CERRADO') {
      if (entry.type === 'INCIDENCIA' && !entry.resolution) return fail('Para cerrar una incidencia debes registrar cómo se resolvió.');
      const openFollowups = state.followups.filter((f) => f.entryId === entry.id && (f.status === 'PENDIENTE' || f.status === 'VENCIDO'));
      if (openFollowups.length > 0) return fail('No puedes cerrar el registro: tiene ' + openFollowups.length + ' seguimiento(s) sin cerrar.');
    }

    const now = new Date().toISOString();
    const history = (entry.history || []).concat([{
      at: now, action: next === 'CERRADO' ? 'CERRAR' : reopening ? 'REABRIR' : 'CAMBIO_ESTADO',
      actor: state.currentUserId, summary: 'Estado: ' + ENTRY_STATUS[next]
    }]);

    const ok = await write(function () {
      return updateDoc('entries/' + entry.id, {
        status: next, closedAt: next === 'CERRADO' ? now : null,
        closedBy: next === 'CERRADO' ? state.currentUserId : null,
        reopenedAt: reopening ? now : entry.reopenedAt || null,
        history: history
      });
    }, 'Registro ' + ENTRY_STATUS[next].toLowerCase() + '.');

    if (ok) {
      await pushAudit(next === 'CERRADO' ? 'CERRAR' : 'CAMBIO_ESTADO', 'Registro', '#' + entry.seq + ' ' + entry.title + ' → ' + ENTRY_STATUS[next]);
      runAlertEngine();
      if (document.querySelector('.sheet')) openEntrySheet(entry.id);
    }

    const allowed = {
      PENDIENTE: ['EN_CURSO', 'BLOQUEADA', 'COMPLETADA', 'CANCELADA'],
      EN_CURSO: ['BLOQUEADA', 'COMPLETADA', 'CANCELADA', 'PENDIENTE'],

      return updateDoc('tasks/' + task.id, {
        status: next, blockedReason: blockedReason,
        completedAt: next === 'COMPLETADA' ? now : null,
        completedBy: next === 'COMPLETADA' ? state.currentUserId : null,

  // ----------------------------- Mantenimiento ----------------------------
  /**
   * La base de datos del artefacto admite hasta 5.000 documentos. El archivado
   * agrupa los registros cerrados antiguos en un documento por mes y libera
   * los individuales, conservando la información consultable.
   */
  ACTIONS['archive-closed'] = async function () {
    if (!can('system.configure')) return fail('Tu rol no puede archivar registros.');
    const days = Number(val('archive-days') || '90');
    const cutoff = Date.now() - days * DAY;

    const entries = state.entries.filter((e) => ENTRY_OPEN.indexOf(e.status) < 0 && new Date(e.closedAt || e.occurredAt).getTime() < cutoff);
    const tasks = state.tasks.filter((t) => TASK_OPEN.indexOf(t.status) < 0 && new Date(t.completedAt || t.createdAt).getTime() < cutoff);
    if (entries.length === 0 && tasks.length === 0) return toast('No hay registros cerrados anteriores a ' + days + ' días.', 'ok');

    const buckets = {};
    const put = (kind, item, dateIso) => {
      const month = String(dateIso || new Date().toISOString()).slice(0, 7);
      buckets[month] = buckets[month] || [];
      buckets[month].push(Object.assign({ archivedKind: kind }, item));
    };
    entries.forEach((e) => put('entry', e, e.closedAt || e.occurredAt));
    tasks.forEach((t) => put('task', t, t.completedAt || t.createdAt));

    const ok = await write(async function () {
      for (const month of Object.keys(buckets)) {
        const path = 'archive/' + month;
        const snap = await db.doc(path).get();
        const previous = snap.exists ? (snap.data().items || []) : [];
        await db.doc(path).set({ month: month, items: previous.concat(buckets[month]), archivedAt: new Date().toISOString() });
      }
      for (const entry of entries) await db.doc('entries/' + entry.id).delete();
      for (const task of tasks) await db.doc('tasks/' + task.id).delete();
    }, 'Archivados ' + entries.length + ' registro(s) y ' + tasks.length + ' tarea(s).');

    if (ok) await pushAudit('CONFIGURAR', 'Sistema', 'Archivado de ' + (entries.length + tasks.length) + ' registros cerrados anteriores a ' + days + ' días');
  };

      '<div class="sheet-body">' + bodyHtml + '</div></div></div>';
    const focusable = host.querySelector('input, textarea, select, button.btn');
    if (focusable) focusable.focus();
  }

  function selectOptions(values, labels, selected) {
    return values.map(function (v) {

    }).join('');

    return '<h3 style="margin-top:18px">Comentarios <span class="muted num">' + item.comments.length + '</span></h3>' +
