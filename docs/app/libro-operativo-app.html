  function timelineBlock(history, extra) {
    const events = history.slice();
    (extra || []).forEach((e) => events.push(e));
    events.sort((a, b) => new Date(a.at) - new Date(b.at));
    return '<h3 style="margin-top:18px">Historial <span class="muted num">' + events.length + '</span></h3>' +
      '<ol class="timeline" style="margin-top:8px">' + events.map(function (e) {
        return '<li data-kind="' + (e.kind || 'auditoria') + '">' +
          '<div class="timeline-head"><span class="timeline-action">' + esc(AUDIT_LABEL[e.action] || e.action || 'Evento') + '</span>' +
          '<span class="meta num">' + fmtDT(e.at) + '</span>' +
          '<span class="meta">· ' + esc(userName(e.actor)) + '</span></div>' +
          '<p style="margin:2px 0 0;font-size:13px">' + esc(e.summary) + '</p></li>';
      }).join('') + '</ol>';
  }

  function openEntrySheet(id) {
    const e = state.entries.find((x) => x.id === id);
    if (!e) return;
    const open = ENTRY_OPEN.indexOf(e.status) >= 0;
    const overdue = isOverdue(e.dueAt, open);
    const guest = state.guests.find((g) => g.id === e.guestId);
    const reservation = state.reservations.find((r) => r.id === e.reservationId);
    const tasks = state.tasks.filter((t) => t.entryId === e.id && !t.deleted);
    const followups = state.followups.filter((f) => f.entryId === e.id);

    const body =
      '<div class="row-tags" style="margin-bottom:8px">' +
        '<span class="ref">#' + e.seq + '</span>' + chip(ENTRY_TYPE[e.type]) +
        badge(ENTRY_TONE[e.status], ENTRY_STATUS[e.status]) +
        badge(PRIORITY_TONE[e.priority], 'Prioridad ' + PRIORITY[e.priority]) +
        (e.severity ? badge(SEVERITY_TONE[e.severity], 'Gravedad ' + PRIORITY[e.severity]) : '') +
        (overdue ? badge('critico', 'Vencido') : '') +
        (e.followUp ? chip('Con seguimiento') : '') +
      '</div>' +
      '<p class="prose" style="color:var(--ink);font-size:14.5px;line-height:1.55">' + esc(e.description) + '</p>' +
      '<dl class="facts" style="margin-top:14px">' +
        '<div><dt>Registró</dt><dd>' + esc(userName(e.createdBy)) + ' · <span class="num">' + fmtDT(e.occurredAt) + '</span></dd></div>' +
        '<div><dt>Responsable</dt><dd>' + esc(e.ownerId ? userName(e.ownerId) : 'Sin asignar') + '</dd></div>' +
        '<div><dt>Área</dt><dd>' + esc(e.department || 'Sin área') + '</dd></div>' +
        '<div><dt>Vencimiento</dt><dd' + (overdue ? ' style="color:var(--critico);font-weight:600"' : '') + '>' + (e.dueAt ? '<span class="num">' + fmtDT(e.dueAt) + '</span> (' + relative(e.dueAt) + ')' : 'Sin vencimiento') + '</dd></div>' +
        (e.severity ? '<div><dt>Impacto</dt><dd>' + esc(IMPACT[e.impact] || 'No registrado') + '</dd></div>' : '') +
        (e.immediateAction ? '<div><dt>Acción inmediata</dt><dd>' + esc(e.immediateAction) + '</dd></div>' : '') +
        (e.rootCause ? '<div><dt>Causa</dt><dd>' + esc(e.rootCause) + '</dd></div>' : '') +
        (e.resolution ? '<div><dt>Resolución</dt><dd>' + esc(e.resolution) + '</dd></div>' : '') +
        (guest ? '<div><dt>Huésped</dt><dd>' + esc(guest.name) + (guest.room ? ' · hab. ' + esc(guest.room) : '') + (guest.vip ? ' · VIP' : '') + '</dd></div>' : '') +
        (reservation ? '<div><dt>Reserva</dt><dd><span class="num">' + esc(reservation.code) + '</span> · ' + esc(reservation.status) + '</dd></div>' : '') +
      '</dl>' +
      (e.tags.length ? '<div class="row-tags" style="margin-top:12px">' + e.tags.map((t) => chip('#' + t)).join('') + '</div>' : '') +

      '<div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:16px">' +
        (open && can('entry.close') ? '<button class="btn btn-gold btn-sm" type="button" data-act="resolve-entry" data-args="' + e.id + '">Cerrar registro</button>' : '') +
        (open && e.status !== 'EN_CURSO' && can('entry.edit') ? '<button class="btn btn-quiet btn-sm" type="button" data-act="entry-status" data-args="' + e.id + '|EN_CURSO">Marcar en curso</button>' : '') +
        (!open ? '<button class="btn btn-quiet btn-sm" type="button" data-act="entry-status" data-args="' + e.id + '|EN_CURSO">Reabrir</button>' : '') +
        (can('task.create') ? '<button class="btn btn-quiet btn-sm" type="button" data-act="new-task" data-args="' + e.id + '">Crear tarea</button>' : '') +
        (can('followup.create') ? '<button class="btn btn-quiet btn-sm" type="button" data-act="new-followup" data-args="' + e.id + '">Registrar seguimiento</button>' : '') +
        (can('entry.delete') && !e.deleted ? '<button class="btn btn-quiet btn-sm" type="button" data-act="ask-delete-entry" data-args="' + e.id + '">Eliminar</button>' : '') +
      '</div>' +

      (followups.length ? '<h3 style="margin-top:18px">Seguimientos <span class="muted num">' + followups.length + '</span></h3>' +
        followups.map(function (f) {
          return '<div style="padding:9px 0;border-bottom:1px solid var(--line-soft)">' +
            badge(FU_TONE[f.status], FU_STATUS[f.status]) +
            '<p style="margin:5px 0 0;font-size:13.5px;font-weight:500">' + esc(f.action) + '</p>' +
            (f.result ? '<p class="meta" style="margin-top:2px">Resultado: ' + esc(f.result) + '</p>' : '') +
            (f.nextAction ? '<p class="meta" style="margin-top:2px">Próxima acción: ' + esc(f.nextAction) + '</p>' : '') +
            (f.scheduledAt ? '<p class="meta" style="margin-top:2px">Programado <span class="num">' + fmtDT(f.scheduledAt) + '</span> (' + relative(f.scheduledAt) + ')</p>' : '') +
            '</div>';
        }).join('') : '') +

      (tasks.length ? '<h3 style="margin-top:18px">Tareas derivadas <span class="muted num">' + tasks.length + '</span></h3>' +
        tasks.map(function (t) {
          return '<button class="row" type="button" data-act="open-task" data-args="' + t.id + '" style="padding-inline:0">' +
            '<span class="row-bar" style="background:var(--' + TASK_TONE[t.status] + '-mark)"></span>' +
            '<span class="row-body"><span class="row-tags"><span class="ref">T#' + t.seq + '</span>' + badge(TASK_TONE[t.status], TASK_STATUS[t.status]) + '</span>' +
            '<span class="row-title" style="display:block">' + esc(t.title) + '</span></span></button>';
        }).join('') : '') +

      commentsBlock('entry', e) +
      timelineBlock(e.history, e.comments.map((c) => ({ at: c.at, action: 'COMENTAR', actor: c.authorId, summary: c.body, kind: 'comentario' }))
        .concat(followups.map((f) => ({ at: f.createdAt, action: 'SEGUIMIENTO', actor: f.createdBy, summary: f.action, kind: 'seguimiento' }))));

    openSheet(e.title, body);
  }

  function openTaskSheet(id) {
    const t = state.tasks.find((x) => x.id === id);
    if (!t) return;
    const open = TASK_OPEN.indexOf(t.status) >= 0;
    const overdue = isOverdue(t.dueAt, open);
    const entry = state.entries.find((e) => e.id === t.entryId);
    const done = t.checklist.filter((c) => c.done).length;

    const body =
      '<div class="row-tags" style="margin-bottom:8px">' +
        '<span class="ref">T#' + t.seq + '</span>' +
        badge(overdue ? 'critico' : TASK_TONE[t.status], overdue ? 'Vencida' : TASK_STATUS[t.status]) +
        badge(PRIORITY_TONE[t.priority], 'Prioridad ' + PRIORITY[t.priority]) +
        chip('Origen: ' + TASK_ORIGIN[t.origin]) +
      '</div>' +
      (t.description ? '<p class="prose" style="color:var(--ink);font-size:14.5px">' + esc(t.description) + '</p>' : '') +
      (t.blockedReason ? '<p style="margin-top:10px;padding:9px 11px;border-radius:7px;background:var(--atencion-bg);color:var(--atencion);font-size:13px">Bloqueada: ' + esc(t.blockedReason) + '</p>' : '') +
      '<dl class="facts" style="margin-top:14px">' +
        '<div><dt>Asignada a</dt><dd>' + esc(t.assigneeId ? userName(t.assigneeId) : 'Sin asignar') + '</dd></div>' +
        '<div><dt>Creada por</dt><dd>' + esc(userName(t.createdBy)) + ' · <span class="num">' + fmtDT(t.createdAt) + '</span></dd></div>' +
        '<div><dt>Área</dt><dd>' + esc(t.department || 'Sin área') + '</dd></div>' +
        '<div><dt>Fecha límite</dt><dd' + (overdue ? ' style="color:var(--critico);font-weight:600"' : '') + '>' + (t.dueAt ? '<span class="num">' + fmtDT(t.dueAt) + '</span> (' + relative(t.dueAt) + ')' : 'Sin fecha límite') + '</dd></div>' +
        (entry ? '<div><dt>Registro origen</dt><dd>#' + entry.seq + ' ' + esc(entry.title) + '</dd></div>' : '') +
        (t.completedAt ? '<div><dt>Completada</dt><dd><span class="num">' + fmtDT(t.completedAt) + '</span></dd></div>' : '') +
      '</dl>' +

      '<div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:16px">' +
        (t.status === 'PENDIENTE' ? '<button class="btn btn-quiet btn-sm" type="button" data-act="task-status" data-args="' + t.id + '|EN_CURSO">Tomar tarea</button>' : '') +
        (open && can('task.close') ? '<button class="btn btn-gold btn-sm" type="button" data-act="task-status" data-args="' + t.id + '|COMPLETADA">Completar</button>' : '') +
        (open ? '<button class="btn btn-quiet btn-sm" type="button" data-act="block-task" data-args="' + t.id + '">Bloquear</button>' : '') +
        (open && can('task.assign') ? '<button class="btn btn-quiet btn-sm" type="button" data-act="ask-assign-task" data-args="' + t.id + '">Reasignar</button>' : '') +
        (t.status === 'COMPLETADA' ? '<button class="btn btn-quiet btn-sm" type="button" data-act="task-status" data-args="' + t.id + '|EN_CURSO">Reabrir</button>' : '') +
        (can('followup.create') && entry ? '<button class="btn btn-quiet btn-sm" type="button" data-act="new-followup" data-args="' + entry.id + '">Registrar seguimiento</button>' : '') +
      '</div>' +

      (t.checklist.length ? '<h3 style="margin-top:18px">Checklist <span class="muted num">' + done + '/' + t.checklist.length + '</span></h3>' +
        '<ul class="checklist" style="margin-top:6px">' + t.checklist.map(function (c) {
          return '<li><button type="button" data-done="' + c.done + '" data-act="toggle-check" data-args="' + t.id + '|' + c.id + '">' +
            '<span class="checkmark" aria-hidden="true">✓</span><span class="check-text">' + esc(c.text) + '</span>' +
            '<span class="sr-only" style="position:absolute;left:-9999px">' + (c.done ? 'Desmarcar' : 'Marcar como hecho') + '</span></button></li>';
        }).join('') + '</ul>' : '') +

      commentsBlock('task', t) +
      timelineBlock(t.history, t.comments.map((c) => ({ at: c.at, action: 'COMENTAR', actor: c.authorId, summary: c.body, kind: 'comentario' })));

    openSheet(t.title, body);
  }


  // --------------------------------- Vistas -------------------------------
  const panel = (title, count, bodyHtml, extraHead, className) =>
    '<section class="panel' + (className ? ' ' + className : '') + '">' +
    '<div class="panel-head"><h2>' + esc(title) + '</h2>' +
    (count != null ? '<span class="count">' + count + '</span>' : '') +
    (extraHead || '') + '</div>' + bodyHtml + '</section>';

  const emptyState = (message, hint) => '<div class="empty"><strong>' + esc(message) + '</strong>' + (hint ? esc(hint) : '') + '</div>';

  const tile = (label, value, hint, tone) =>
    '<div class="tile"' + (tone === 'alert' ? ' data-alert="true"' : tone === 'good' ? ' data-good="true"' : '') + '>' +
    '<p class="tile-label">' + esc(label) + '</p><p class="tile-value">' + esc(String(value)) + '</p>' +
    (hint ? '<p class="tile-hint">' + esc(hint) + '</p>' : '') + '</div>';

  function entryRow(e) {
    const open = ENTRY_OPEN.indexOf(e.status) >= 0;
    const overdue = isOverdue(e.dueAt, open);
    const guest = state.guests.find((g) => g.id === e.guestId);
    return '<li><button class="row" type="button" data-act="open-entry" data-args="' + e.id + '">' +
      '<span class="row-bar" style="background:var(--' + (overdue ? 'critico' : ENTRY_TONE[e.status]) + '-mark)"></span>' +
      '<span class="row-body">' +
      '<span class="row-tags"><span class="ref">#' + e.seq + '</span>' + chip(ENTRY_TYPE[e.type]) +
      badge(ENTRY_TONE[e.status], ENTRY_STATUS[e.status]) +
      badge(PRIORITY_TONE[e.priority], PRIORITY[e.priority]) +
      (overdue ? badge('critico', 'Vencido') : '') + '</span>' +
      '<span class="row-title" style="display:block">' + esc(e.title) + '</span>' +
      '<span class="row-text" style="display:block">' + esc(e.description) + '</span>' +
      '<span class="row-meta">' +
      '<span class="num">' + fmtDT(e.occurredAt) + '</span>' +
      '<span>' + esc(e.ownerId ? 'Resp.: ' + userName(e.ownerId) : 'Sin responsable') + '</span>' +
      (e.department ? '<span>' + esc(e.department) + '</span>' : '') +
      (guest ? '<span>' + esc(guest.name + (guest.room ? ' · hab. ' + guest.room : '')) + '</span>' : '') +
      (e.dueAt ? '<span' + (overdue ? ' style="color:var(--critico);font-weight:600"' : '') + '>Vence ' + relative(e.dueAt) + '</span>' : '') +
      (e.followUp ? '<span>Con seguimiento</span>' : '') +
      (e.comments.length ? '<span>' + e.comments.length + ' comentarios</span>' : '') +
      '</span></span></button></li>';
  }

  function taskRow(t, showActions) {
    const open = TASK_OPEN.indexOf(t.status) >= 0;
    const overdue = isOverdue(t.dueAt, open);
    const done = t.checklist.filter((c) => c.done).length;
    return '<li><button class="row" type="button" data-act="open-task" data-args="' + t.id + '">' +
      '<span class="row-bar" style="background:var(--' + (overdue ? 'critico' : TASK_TONE[t.status]) + '-mark)"></span>' +
      '<span class="row-body">' +
      '<span class="row-tags"><span class="ref">T#' + t.seq + '</span>' +
      badge(overdue ? 'critico' : TASK_TONE[t.status], overdue ? 'Vencida' : TASK_STATUS[t.status]) +
      badge(PRIORITY_TONE[t.priority], PRIORITY[t.priority]) +
      chip(TASK_ORIGIN[t.origin]) + '</span>' +
      '<span class="row-title" style="display:block">' + esc(t.title) + '</span>' +
      '<span class="row-meta">' +
      '<span>' + esc(t.assigneeId ? userName(t.assigneeId) : 'Sin asignar') + '</span>' +
      (t.department ? '<span>' + esc(t.department) + '</span>' : '') +
      '<span' + (overdue ? ' style="color:var(--critico);font-weight:600"' : '') + '>' + (t.dueAt ? (overdue ? 'Venció ' : 'Vence ') + relative(t.dueAt) : 'Sin fecha límite') + '</span>' +
      (t.checklist.length ? '<span class="num">' + done + '/' + t.checklist.length + ' pasos</span>' : '') +
      '</span></span></button>' +
      (showActions && open ? '<div class="row-actions">' +
        (t.status === 'PENDIENTE' ? '<button class="btn btn-quiet btn-sm" type="button" data-act="task-status" data-args="' + t.id + '|EN_CURSO">Tomar</button>' : '') +
        (can('task.close') ? '<button class="btn btn-gold btn-sm" type="button" data-act="task-status" data-args="' + t.id + '|COMPLETADA">Completar</button>' : '') +
        '</div>' : '') +
      '</li>';
  }

  function viewInicio() {
    const shift = myOpenShift();
    const startable = startableShifts();
    const incoming = shift ? incomingHandover(shift) : null;
    const next = shift ? neighbour(shift, 'next') : null;
    const handover = shift ? handoverFrom(shift.id) : null;

    const alerts = liveAlerts();
    const criticalAlerts = alerts.filter((a) => a.level === 'CRITICA');
    const openEntries = state.entries.filter((e) => !e.deleted && ENTRY_OPEN.indexOf(e.status) >= 0);
    const openTasks = state.tasks.filter((t) => !t.deleted && TASK_OPEN.indexOf(t.status) >= 0);
    const overdueTasks = openTasks.filter((t) => isOverdue(t.dueAt, true));
    const myTasks = openTasks.filter((t) => t.assigneeId === state.currentUserId)
      .sort((a, b) => (a.dueAt ? new Date(a.dueAt) : Infinity) - (b.dueAt ? new Date(b.dueAt) : Infinity));
    const criticalEntries = openEntries.filter((e) => e.priority === 'CRITICA' || e.priority === 'ALTA' || isOverdue(e.dueAt, true))
      .sort((a, b) => ['BAJA', 'MEDIA', 'ALTA', 'CRITICA'].indexOf(b.priority) - ['BAJA', 'MEDIA', 'ALTA', 'CRITICA'].indexOf(a.priority));
    const incidents = openEntries.filter((e) => e.type === 'INCIDENCIA');
    const followups = state.followups.filter((f) => f.status === 'PENDIENTE' || f.status === 'VENCIDO')
      .sort((a, b) => new Date(a.scheduledAt || 0) - new Date(b.scheduledAt || 0));
    const latest = state.entries.filter((e) => !e.deleted).slice().sort((a, b) => new Date(b.occurredAt) - new Date(a.occurredAt)).slice(0, 6);
    const shiftEntries = shift ? state.entries.filter((e) => e.shiftId === shift.id && !e.deleted) : [];

    // -------- Tarjeta de turno con el siguiente paso real del ciclo --------
    let cta = '';
    if (!shift && startable.length) {
      cta = startable.slice(0, 2).map(function (s) {
        return '<button class="btn btn-gold" type="button" data-act="start-shift" data-args="' + s.id + '">' + icon('shift') +
          'Iniciar turno ' + SHIFT_TYPE[s.type] + ' · ' + fmtShort(s.date) + '</button>';
      }).join('');
    } else if (shift && shift.status === 'ACTIVO') {
      cta = '<button class="btn btn-gold" type="button" data-act="prepare" data-args="' + shift.id + '">' + icon('send') + 'Preparar entrega de turno</button>' +
        (!next ? '<button class="btn btn-quiet" type="button" data-act="close-shift" data-args="' + shift.id + '">Cerrar turno</button>' : '');
    } else if (shift && shift.status === 'PREPARANDO_ENTREGA' && handover) {
      cta = '<button class="btn btn-gold" type="button" data-act="open-handover" data-args="' + handover.id + '">' + icon('send') + 'Continuar la entrega</button>' +
        '<button class="btn btn-ghost btn-sm" type="button" data-act="cancel-prep" data-args="' + shift.id + '">Cancelar preparación</button>';
    } else if (shift && shift.status === 'ENTREGA_ENVIADA') {
      cta = '<p class="meta" style="max-width:250px">Entrega enviada. Tu turno se cierra cuando el turno siguiente confirme la recepción.</p>' +
        (handover ? '<button class="btn btn-quiet btn-sm" type="button" data-act="open-handover" data-args="' + handover.id + '">Ver la entrega enviada</button>' : '');
    } else if (shift && shift.status === 'RECIBIDO') {
      cta = '<button class="btn btn-quiet" type="button" data-act="close-shift" data-args="' + shift.id + '">Cerrar turno</button>';
    }

    const stepper = shift ? '<ol class="stepper">' + SHIFT_FLOW.map(function (step, i) {
      const current = SHIFT_FLOW.indexOf(shift.status);
      const st = i < current ? 'done' : i === current ? 'current' : 'todo';
      return '<li class="step" data-state="' + st + '"' + (st === 'current' ? ' aria-current="step"' : '') + '>' + SHIFT_LABEL[step] + '</li>' +
        (i < SHIFT_FLOW.length - 1 ? '<li class="step-sep" aria-hidden="true">→</li>' : '');
    }).join('') + '</ol>' : '';

    const receiveBlock = (shift && shift.status === 'INICIADO') ?
      '<div class="callout">' +
      '<p class="callout-title">' + icon('inbox') + (incoming ? 'Recibe la entrega del turno anterior' : 'Sin entrega pendiente de recibir') + '</p>' +
      (incoming ?
        '<p class="meta">Enviada por ' + esc(userName(incoming.issuedBy)) + ' el <span class="num">' + fmtDT(incoming.issuedAt) + '</span> · turno ' + SHIFT_TYPE[shiftById(incoming.fromShiftId).type] + ' · ' + incoming.items.length + ' puntos</p>' +
        (incoming.notes ? '<p class="handover-note">' + esc(incoming.notes) + '</p>' : '') +
        '<ul class="rows" style="margin-top:10px">' + incoming.items.slice(0, 4).map(function (item) {
          return '<li style="border:0;padding:4px 0"><span class="row-tags">' + badge(HANDOVER_TONE[item.level], HANDOVER_LEVEL[item.level]) +
            '<strong style="font-size:13px;font-weight:500">' + esc(item.title) + '</strong></span></li>';
        }).join('') + '</ul>' +
        (incoming.items.length > 4 ? '<p class="meta" style="margin-top:4px">y ' + (incoming.items.length - 4) + ' punto(s) más · <button class="link" type="button" data-act="open-handover" data-args="' + incoming.id + '">ver entrega completa</button></p>' : '')
        : '<p class="meta">El turno anterior no dejó entrega registrada. Puedes activar tu turno y quedará constancia en la auditoría.</p>') +
      '<div style="margin-top:12px;display:flex;flex-direction:column;gap:8px;max-width:440px">' +
      '<label class="field"><span class="field-label">Observaciones de recepción</span>' +
      '<textarea id="receive-obs" placeholder="Recibido conforme…"></textarea></label>' +
      '<button class="btn btn-gold" type="button" data-act="receive" data-args="' + shift.id + '">' + icon('check') +
      (incoming ? 'Confirmar recepción del turno' : 'Activar turno sin entrega previa') + '</button>' +
      '</div></div>' : '';

    const lastReceived = state.handovers.filter((h) => h.status === 'RECIBIDA').sort((a, b) => new Date(b.receivedAt) - new Date(a.receivedAt))[0] || null;

    return (
      '<div class="stack">' +

      '<section class="panel shift-card">' +
      '<div class="shift-top">' +
      '<div><p class="eyebrow">Turno actual</p>' +
      (shift ?
        '<h1 class="shift-title">' + SHIFT_TYPE[shift.type] + ' · ' + fmtDate(shift.date) + '</h1>' +
        '<div class="shift-facts">' + badge(shift.status === 'ACTIVO' ? 'curso' : shift.status === 'INICIADO' ? 'pendiente' : shift.status === 'ENTREGA_ENVIADA' ? 'atencion' : 'neutro', SHIFT_LABEL[shift.status]) +
        '<span>Horario <span class="num">' + SHIFT_HOURS[shift.type][0] + '–' + SHIFT_HOURS[shift.type][1] + '</span></span>' +
        (shift.startedAt ? '<span>Iniciado <span class="num">' + fmtTime(shift.startedAt) + '</span></span>' : '') +
        '<span>' + esc(shift.staff.map(userName).join(', ')) + '</span></div>'
        :
        '<h1 class="shift-title">No tienes un turno abierto</h1>' +
        '<p class="page-sub">' + (startable.length ? 'Tienes turnos asignados listos para iniciar.' :
          myRole().operational ? 'No hay turnos programados a tu nombre.' :
          'El Administrador de sistema queda fuera del ciclo de turnos: puede supervisar y administrar, no operar.') + '</p>') +
      '</div>' +
      '<div class="shift-cta">' + cta + '<button class="link" type="button" data-act="nav" data-args="turno">Ver detalle del turno →</button></div>' +
      '</div>' + stepper + receiveBlock + '</section>' +

      '<div class="tiles">' +
      tile('Alertas activas', alerts.length, criticalAlerts.length + ' crítica(s)', criticalAlerts.length ? 'alert' : 'good') +
      tile('Tareas vencidas', overdueTasks.length, openTasks.length + ' abiertas en total', overdueTasks.length ? 'alert' : 'good') +
      tile('Incidencias abiertas', incidents.length, openEntries.length + ' registros abiertos', incidents.length ? 'alert' : 'good') +
      tile('Registros de mi turno', shiftEntries.length, shift ? 'Turno ' + SHIFT_TYPE[shift.type] : 'Sin turno abierto') +
      '</div>' +

      '<div class="grid grid-3">' +
      panel('Pendientes críticos', criticalEntries.length,
        criticalEntries.length ? '<ul class="rows">' + criticalEntries.slice(0, 6).map(entryRow).join('') + '</ul>' :
        emptyState('Nada crítico ni vencido en este momento.', 'Aquí aparecen los registros de prioridad alta o crítica y los vencidos.'),

      panel('Entregas de turno', null,
        '<div class="panel-body" style="display:flex;flex-direction:column;gap:14px">' +
        '<div><p class="eyebrow">Entrega anterior</p>' +
        (lastReceived ? '<p style="margin:0;font-size:13.5px">Turno ' + SHIFT_TYPE[shiftById(lastReceived.fromShiftId).type] + ' · ' + fmtDate(shiftById(lastReceived.fromShiftId).date) + '</p>' +
          '<p class="meta">De ' + esc(userName(lastReceived.issuedBy)) + ', recibida ' + relative(lastReceived.receivedAt) + ' · ' + lastReceived.items.length + ' puntos</p>' +
          '<button class="link" type="button" data-act="open-handover" data-args="' + lastReceived.id + '">Ver entrega recibida</button>'
          : '<p class="meta">Aún no se ha recibido ninguna entrega.</p>') + '</div>' +
        '<div><p class="eyebrow">Próxima entrega</p>' +
        (handover ? badge(handover.status === 'ENVIADA' ? 'curso' : 'pendiente', handover.status === 'ENVIADA' ? 'Enviada, esperando confirmación' : 'En preparación') +
          '<p class="meta" style="margin-top:4px">' + handover.items.length + ' puntos · ' + (next ? 'destino: turno ' + SHIFT_TYPE[next.type] : 'sin turno siguiente programado') + '</p>' +
          '<button class="link" type="button" data-act="open-handover" data-args="' + handover.id + '">Abrir entrega</button>'
          : shift ? '<p class="meta">' + (next ? 'Al terminar, entrega al turno ' + SHIFT_TYPE[next.type] + '.' : 'No hay turno siguiente programado.') + '</p>'
          : '<p class="meta">Inicia tu turno para preparar la entrega.</p>') + '</div>' +

      (overdueTasks.length ? panel('Tareas vencidas de la operación', overdueTasks.length,

        '<p style="text-align:center;padding:11px;border-radius:10px;background:var(--resuelto-bg);color:var(--resuelto);font-size:13px">✓ No hay tareas vencidas en la operación.</p>') +

      '</div>'
    );
  }


  // ------------------------------ Libro operativo -------------------------
  function bookItems() {
    const q = (state.filters.q || '').trim().toLowerCase();
    const matches = (text) => !q || String(text || '').toLowerCase().indexOf(q) >= 0;
    const items = [];
    const clase = state.filters.clase;

    if (!clase || clase === 'entry') {
      state.entries.filter((e) => !e.deleted).forEach(function (e) {
        const guest = state.guests.find((g) => g.id === e.guestId);
        const reservation = state.reservations.find((r) => r.id === e.reservationId);
        if (q && !(matches(e.title) || matches(e.description) || matches(e.tags.join(' ')) || matches(guest && guest.name) || matches(guest && guest.room) || matches(reservation && reservation.code))) return;
        if (state.filters.tipo && e.type !== state.filters.tipo) return;
        if (state.filters.estado === 'abiertos' ? ENTRY_OPEN.indexOf(e.status) < 0 : state.filters.estado && e.status !== state.filters.estado) return;
        if (state.filters.prioridad && e.priority !== state.filters.prioridad) return;
        if (state.filters.area && e.department !== state.filters.area) return;
        items.push({ kind: 'entry', date: e.occurredAt, html: entryRow(e) });
      });
    }
    if (!clase || clase === 'task') {
      state.tasks.filter((t) => !t.deleted).forEach(function (t) {
        if (q && !(matches(t.title) || matches(t.description))) return;
        if (state.filters.tipo) return;
        if (state.filters.estado === 'abiertos' ? TASK_OPEN.indexOf(t.status) < 0 : state.filters.estado && state.filters.estado !== 'abiertos' && ENTRY_STATUS[state.filters.estado]) return;
        if (state.filters.prioridad && t.priority !== state.filters.prioridad) return;
        if (state.filters.area && t.department !== state.filters.area) return;
        items.push({ kind: 'task', date: t.createdAt, html: taskRow(t, false) });
      });
    }
    if (!clase || clase === 'followup') {
      state.followups.forEach(function (f) {
        if (q && !(matches(f.action) || matches(f.nextAction) || matches(f.result))) return;
        if (state.filters.tipo || state.filters.prioridad || state.filters.area) return;
        if (state.filters.estado === 'abiertos' && f.status !== 'PENDIENTE' && f.status !== 'VENCIDO') return;
        const entry = state.entries.find((e) => e.id === f.entryId);
        items.push({
          kind: 'followup', date: f.createdAt,
          html: '<li><button class="row" type="button" data-act="open-entry" data-args="' + (entry ? entry.id : '') + '">' +
            '<span class="row-bar" style="background:var(--' + FU_TONE[f.status] + '-mark)"></span>' +
            '<span class="row-body"><span class="row-tags"><span class="ref">Seg.</span>' + chip('Seguimiento') + badge(FU_TONE[f.status], FU_STATUS[f.status]) + '</span>' +
            '<span class="row-title" style="display:block">' + esc(f.action) + '</span>' +
            (f.nextAction ? '<span class="row-text" style="display:block">Próxima acción: ' + esc(f.nextAction) + '</span>' : '') +
            '<span class="row-meta"><span class="num">' + fmtDT(f.createdAt) + '</span><span>Resp.: ' + esc(userName(f.ownerId)) + '</span>' +
            (f.scheduledAt ? '<span>Programado ' + relative(f.scheduledAt) + '</span>' : '') +
            (entry ? '<span>Registro #' + entry.seq + '</span>' : '') + '</span></span></button></li>'
        });
      });
    }
    if (!clase || clase === 'alert') {
      state.alerts.forEach(function (a) {
        if (q && !(matches(a.title) || matches(a.message))) return;
        if (state.filters.tipo || state.filters.prioridad) return;
        if (state.filters.estado === 'abiertos' && !alertIsLive(a)) return;
        items.push({
          kind: 'alert', date: a.createdAt,
          html: '<li style="padding:11px 14px;display:flex;gap:11px">' +
            '<span class="row-bar" style="background:var(--' + (a.status === 'RESUELTA' ? 'resuelto' : ALERT_LEVEL_TONE[a.level]) + '-mark)"></span>' +
            '<div style="flex:1;min-width:0"><span class="row-tags"><span class="ref">Alerta</span>' + chip(ALERT_TYPE[a.type]) +
            badge(a.status === 'RESUELTA' ? 'resuelto' : ALERT_LEVEL_TONE[a.level], ALERT_STATUS[a.status]) + (a.auto ? chip('Automática') : '') + '</span>' +
            '<p class="row-title">' + esc(a.title) + '</p>' +
            (a.message ? '<p class="row-text">' + esc(a.message) + '</p>' : '') +
            '<p class="row-meta"><span class="num">' + fmtDT(a.createdAt) + '</span><span>' + esc(a.createdBy ? userName(a.createdBy) : 'Motor de alertas') + '</span></p></div></li>'
        });
      });
    }

    items.sort((a, b) => new Date(b.date) - new Date(a.date));
    return items;
  }

  function viewLibro() {
    const items = bookItems();
    return '<div class="stack">' +
      '<header class="page-head"><h1>Libro operativo</h1>' +
      '<p class="page-sub">Vista cronológica única de registros, tareas, seguimientos y alertas. Un solo flujo, sin módulos duplicados.</p></header>' +
      '<section class="panel"><div class="filters">' +
      '<label class="field wide"><span class="field-label">Buscar</span><input type="text" data-filter="q" value="' + esc(state.filters.q) + '" placeholder="Título, huésped, habitación, reserva, etiqueta"></label>' +
      '<label class="field"><span class="field-label">Qué mostrar</span><select data-filter="clase"><option value="">Todo</option>' +
        selectOptions(['entry', 'task', 'followup', 'alert'], { entry: 'Registros', task: 'Tareas', followup: 'Seguimientos', alert: 'Alertas' }, state.filters.clase) + '</select></label>' +
      '<label class="field"><span class="field-label">Tipo</span><select data-filter="tipo"><option value="">Todos</option>' + selectOptions(Object.keys(ENTRY_TYPE), ENTRY_TYPE, state.filters.tipo) + '</select></label>' +
      '<label class="field"><span class="field-label">Estado</span><select data-filter="estado"><option value="">Todos</option><option value="abiertos"' + (state.filters.estado === 'abiertos' ? ' selected' : '') + '>Sólo abiertos</option>' + selectOptions(Object.keys(ENTRY_STATUS), ENTRY_STATUS, state.filters.estado) + '</select></label>' +
      '<label class="field"><span class="field-label">Prioridad</span><select data-filter="prioridad"><option value="">Todas</option>' + selectOptions(['BAJA', 'MEDIA', 'ALTA', 'CRITICA'], PRIORITY, state.filters.prioridad) + '</select></label>' +
      '<label class="field"><span class="field-label">Área</span><select data-filter="area"><option value="">Todas</option>' + selectOptions(DEPARTMENTS, null, state.filters.area) + '</select></label>' +
      '</div></section>' +
      panel('Registros', items.length, items.length ? '<ul class="rows">' + items.map((i) => i.html).join('') + '</ul>' :
        emptyState('No hay registros que coincidan con los filtros.', 'Prueba con menos filtros o registra una nueva novedad.')) +
      '</div>';
  }


  // --------------------------------- Turno --------------------------------
  function viewTurno() {
    const shift = myOpenShift();
    const startable = startableShifts();
    const mine = state.shifts.filter((s) => s.staff.indexOf(state.currentUserId) >= 0)
      .slice().sort((a, b) => new Date(b.date) - new Date(a.date) || ORDER.indexOf(b.type) - ORDER.indexOf(a.type));

    const head = '<header class="page-head"><h1>Mi turno</h1>' +
      '<p class="page-sub">Inicio, recepción, operación, entrega y cierre. Cada paso se valida contra la máquina de estados: los estados contradictorios se rechazan.</p></header>';

    if (!shift) {
      return '<div class="stack">' + head +
        panel('No tienes un turno abierto', null,
          startable.length ?
            '<ul class="rows">' + startable.map(function (s) {
              return '<li style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px">' +
                '<div><p style="margin:0;font-weight:500">' + SHIFT_TYPE[s.type] + ' · ' + fmtDate(s.date) + '</p>' +
                '<p class="meta">Horario <span class="num">' + SHIFT_HOURS[s.type][0] + '–' + SHIFT_HOURS[s.type][1] + '</span> · ' + esc(s.staff.map(userName).join(', ')) + '</p></div>' +
                '<button class="btn btn-gold btn-sm" type="button" data-act="start-shift" data-args="' + s.id + '">Iniciar turno</button></li>';
            }).join('') + '</ul>'
            : emptyState(myRole().operational ? 'No hay turnos programados a tu nombre.' : 'El Administrador de sistema no participa en el ciclo de turnos.',
              myRole().operational ? 'Pídele a un supervisor que programe el día.' : 'Cambia a una cuenta operativa para operar turnos.') +
              (can('shift.manage') ? '<div style="padding:0 14px 14px;text-align:center"><button class="btn btn-gold btn-sm" type="button" data-act="nav" data-args="admin">Programar turnos ahora</button></div>' : '')) +
        shiftHistoryPanel(mine) + legendPanel() + '</div>';
    }

    const incoming = incomingHandover(shift);
    const handover = handoverFrom(shift.id);
    const next = neighbour(shift, 'next');
    const shiftEntries = state.entries.filter((e) => e.shiftId === shift.id && !e.deleted);
    const openEntries = state.entries.filter((e) => !e.deleted && ENTRY_OPEN.indexOf(e.status) >= 0);
    const overdueTasks = state.tasks.filter((t) => !t.deleted && TASK_OPEN.indexOf(t.status) >= 0 && isOverdue(t.dueAt, true));
    const alerts = liveAlerts();
    const followups = state.followups.filter((f) => f.status === 'PENDIENTE' || f.status === 'VENCIDO');
    const reservations = state.reservations.filter((r) => r.action || r.guarantee === 'PENDIENTE' || r.guarantee === 'RECHAZADA' || r.balance > 0 || r.status === 'PENDIENTE');
    const vip = state.guests.filter((g) => g.vip);

    const stepper = '<ol class="stepper">' + SHIFT_FLOW.map(function (step, i) {
      const current = SHIFT_FLOW.indexOf(shift.status);
      const st = i < current ? 'done' : i === current ? 'current' : 'todo';
      return '<li class="step" data-state="' + st + '"' + (st === 'current' ? ' aria-current="step"' : '') + '>' + SHIFT_LABEL[step] + '</li>' +
        (i < SHIFT_FLOW.length - 1 ? '<li class="step-sep" aria-hidden="true">→</li>' : '');
    }).join('') + '</ol>';

    let cta = '';
    if (shift.status === 'ACTIVO') {
      cta = '<button class="btn btn-gold" type="button" data-act="prepare" data-args="' + shift.id + '">' + icon('send') + 'Preparar entrega</button>' +
        (!next ? '<button class="btn btn-quiet" type="button" data-act="close-shift" data-args="' + shift.id + '">Cerrar turno</button>' :
          '<button class="btn btn-quiet" type="button" data-act="close-shift" data-args="' + shift.id + '">Cerrar turno</button>');
    } else if (shift.status === 'PREPARANDO_ENTREGA' && handover) {
      cta = '<button class="btn btn-gold" type="button" data-act="open-handover" data-args="' + handover.id + '">Revisar y enviar la entrega</button>' +
        '<button class="btn btn-ghost btn-sm" type="button" data-act="cancel-prep" data-args="' + shift.id + '">Cancelar preparación</button>';
    } else if (shift.status === 'RECIBIDO') {
      cta = '<button class="btn btn-quiet" type="button" data-act="close-shift" data-args="' + shift.id + '">Cerrar turno</button>';
    }

    const briefingPanel = (title, count, rows, emptyMsg, nav) =>
      panel(title, count, count ? '<ul class="rows">' + rows + '</ul>' : emptyState(emptyMsg),
        nav ? '<button class="link" type="button" data-act="nav" data-args="' + nav + '">Ver todo</button>' : '');

    return '<div class="stack">' + head +
      '<section class="panel shift-card"><div class="shift-top">' +
      '<div><p class="eyebrow">Turno en curso</p>' +
      '<h2 class="shift-title">' + SHIFT_TYPE[shift.type] + ' · ' + fmtDate(shift.date) + '</h2>' +
      '<div class="shift-facts">' + badge(shift.status === 'ACTIVO' ? 'curso' : shift.status === 'INICIADO' ? 'pendiente' : 'atencion', SHIFT_LABEL[shift.status]) +
      '<span class="num">' + SHIFT_HOURS[shift.type][0] + '–' + SHIFT_HOURS[shift.type][1] + '</span>' +
      (shift.startedAt ? '<span>Iniciado <span class="num">' + fmtDT(shift.startedAt) + '</span></span>' : '') +
      '<span>' + esc(shift.staff.map(function (id) { return userName(id) + (id === shift.staff[0] ? ' (titular)' : ' (apoyo)'); }).join(' · ')) + '</span>' +
      '</div></div><div class="shift-cta">' + cta + '</div></div>' + stepper +
      (shift.status === 'INICIADO' ?
        '<div class="callout"><p class="callout-title">' + icon('inbox') + 'Confirmar recepción</p>' +
        (incoming ? '<p class="meta">Entrega de ' + esc(userName(incoming.issuedBy)) + ' · turno ' + SHIFT_TYPE[shiftById(incoming.fromShiftId).type] + ' · <button class="link" type="button" data-act="open-handover" data-args="' + incoming.id + '">ver los ' + incoming.items.length + ' puntos</button></p>'
          : '<p class="meta">No hay entrega pendiente para este turno.</p>') +
        '<div style="margin-top:10px;max-width:440px;display:flex;flex-direction:column;gap:8px">' +
        '<label class="field"><span class="field-label">Observaciones de recepción</span><textarea id="receive-obs" placeholder="Recibido conforme…"></textarea></label>' +
        '<button class="btn btn-gold" type="button" data-act="receive" data-args="' + shift.id + '">' + icon('check') + (incoming ? 'Confirmar recepción del turno' : 'Activar turno sin entrega previa') + '</button>' +
        '</div></div>' : '') +
      (shift.status === 'ENTREGA_ENVIADA' ?
        '<div class="callout"><p class="callout-title">' + icon('send') + 'Entrega enviada</p>' +
        '<p class="meta">Enviada ' + relative(handover.issuedAt) + '. Tu turno se cierra cuando el turno siguiente confirme la recepción; no puede cerrarse antes.</p>' +
        '<div style="margin-top:9px"><button class="btn btn-quiet btn-sm" type="button" data-act="open-handover" data-args="' + handover.id + '">Ver la entrega enviada</button></div></div>' : '') +
      '</section>' +

      '<div class="tiles">' +
      tile('Registros del turno', shiftEntries.length) +
      tile('Incidencias del turno', shiftEntries.filter((e) => e.type === 'INCIDENCIA').length) +
      tile('Tareas del turno', state.tasks.filter((t) => t.shiftId === shift.id).length) +
      tile('Alertas activas', alerts.length, null, alerts.length ? 'alert' : 'good') +
      '</div>' +

      '<div class="grid grid-2">' +
      briefingPanel('Pendientes heredados', openEntries.length, openEntries.slice(0, 6).map(entryRow).join(''), 'Sin registros abiertos.', 'libro') +
      briefingPanel('Tareas vencidas', overdueTasks.length, overdueTasks.slice(0, 6).map(function (t) { return taskRow(t, true); }).join(''), 'Sin tareas vencidas.', 'tareas') +
      briefingPanel('Alertas activas', alerts.length, alerts.slice(0, 6).map(function (a) {
        return '<li style="padding:10px 14px"><span class="row-tags">' + badge(ALERT_LEVEL_TONE[a.level], ALERT_TYPE[a.type]) + '</span>' +
          '<p style="margin:4px 0 0;font-size:13.5px;font-weight:500">' + esc(a.title) + '</p></li>';
      }).join(''), 'Sin alertas activas.', 'alertas') +
      briefingPanel('Seguimientos', followups.length, followups.slice(0, 6).map(function (f) {
        return '<li style="padding:10px 14px"><span class="row-tags">' + badge(FU_TONE[f.status], FU_STATUS[f.status]) + '</span>' +
          '<p style="margin:4px 0 0;font-size:13.5px;font-weight:500">' + esc(f.action) + '</p>' +
          '<p class="meta">' + esc(userName(f.ownerId)) + (f.scheduledAt ? ' · ' + relative(f.scheduledAt) : '') + '</p></li>';
      }).join(''), 'Sin seguimientos pendientes.', 'seguimientos') +
      briefingPanel('Huéspedes VIP', vip.length, vip.map(function (g) {
        return '<li style="padding:10px 14px"><p style="margin:0;font-size:13.5px;font-weight:500">' + esc(g.name) + (g.room ? ' · hab. ' + esc(g.room) : '') + '</p>' +
          (g.notes ? '<p class="meta">' + esc(g.notes) + '</p>' : '') + '</li>';
      }).join(''), 'Sin huéspedes VIP registrados.') +
      briefingPanel('Reservas que requieren acción', reservations.length, reservations.map(function (r) {
        const guest = state.guests.find((g) => g.id === r.guestId);
        return '<li style="padding:10px 14px"><p style="margin:0;font-size:13.5px;font-weight:500"><span class="num">' + esc(r.code) + '</span>' +
          (guest ? ' · ' + esc(guest.name) : '') + (r.room ? ' · hab. ' + esc(r.room) : '') + '</p>' +
          '<p class="meta">' + esc(r.action || ('Estado ' + r.status + ' · garantía ' + r.guarantee)) + (r.balance > 0 ? ' · saldo ' + money(r.balance) : '') + '</p></li>';
      }).join(''), 'Sin reservas pendientes de acción.') +
      '</div>' +

      shiftHistoryPanel(mine) + legendPanel() + '</div>';
  }

  function shiftHistoryPanel(shifts) {
    return panel('Mis turnos', shifts.length, '<ul class="rows">' + shifts.map(function (s) {
      const handover = handoverFrom(s.id);
      return '<li style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:11px 14px">' +
        '<div><p style="margin:0;font-weight:500">' + SHIFT_TYPE[s.type] + ' · ' + fmtDate(s.date) + '</p>' +
        '<p class="meta">' + SHIFT_LABEL[s.status] + (s.startedAt ? ' · inicio ' + fmtTime(s.startedAt) : '') + (s.endedAt ? ' · cierre ' + fmtTime(s.endedAt) : '') + '</p></div>' +
        (handover ? '<button class="link" type="button" data-act="open-handover" data-args="' + handover.id + '">' +
          badge(handover.status === 'RECIBIDA' ? 'resuelto' : handover.status === 'ENVIADA' ? 'curso' : 'pendiente', 'Entrega ' + (handover.status === 'RECIBIDA' ? 'recibida' : handover.status === 'ENVIADA' ? 'enviada' : 'en preparación')) +
          ' ' + handover.items.length + ' puntos</button>' : '<span class="meta">Sin entrega</span>') +
        '</li>';
    }).join('') + '</ul>');
  }

  function legendPanel() {
    return '<section class="panel"><div class="legend"><strong style="font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase">Semáforo</strong>' +
      badge('critico', 'Crítico o vencido') + badge('atencion', 'Requiere atención') + badge('pendiente', 'Pendiente') +
      badge('curso', 'En curso') + badge('resuelto', 'Resuelto') + badge('neutro', 'Cerrado o informativo') +
      '<span>Cada estado lleva texto y símbolo además del color.</span></div></section>';
  }


  // -------------------------------- Entrega -------------------------------
  function viewEntrega() {
    const handover = state.handovers.find((h) => h.id === state.openHandover);
    if (!handover) { state.view = 'turno'; return viewTurno(); }

    const from = shiftById(handover.fromShiftId);
    const to = handover.toShiftId ? shiftById(handover.toShiftId) : null;
    const isDraft = handover.status === 'BORRADOR';
    const canEdit = isDraft && from.staff.indexOf(state.currentUserId) >= 0 && can('shift.handover');
    const counts = { URGENTE: 0, IMPORTANTE: 0, INFORMATIVO: 0 };
    handover.items.forEach((i) => { counts[i.level]++; });

    const groups = ['URGENTE', 'IMPORTANTE', 'INFORMATIVO'].map(function (level) {
      const items = handover.items.map(function (item, index) { return { item: item, index: index }; }).filter((x) => x.item.level === level);
      if (!items.length) return '';
      const sections = [];
      items.forEach(function (x) { if (sections.indexOf(x.item.section) < 0) sections.push(x.item.section); });
      return panel(HANDOVER_LEVEL[level] + ' · ' + items.length, null,
        sections.map(function (section) {
          return '<p class="section-label">' + esc(section) + '</p><ul class="rows">' +
            items.filter((x) => x.item.section === section).map(function (x) {
              return '<li style="display:flex;gap:11px;padding:10px 14px">' +
                '<span class="row-bar" style="background:var(--' + HANDOVER_TONE[level] + '-mark)"></span>' +
                '<div style="flex:1;min-width:0">' +
                (x.item.manual ? '<span class="row-tags">' + chip('Nota manual') + '</span>' : '') +
                '<p style="margin:0;font-size:13.5px;font-weight:500">' + esc(x.item.title) + '</p>' +
                (x.item.detail ? '<p class="row-text">' + esc(x.item.detail) + '</p>' : '') +
                '</div>' +
                (canEdit && x.item.manual ? '<button class="link" type="button" data-act="remove-note" data-args="' + handover.id + '|' + x.index + '">Quitar</button>' : '') +
                '</li>';
            }).join('') + '</ul>';
        }).join(''));
    }).join('');

    return '<div class="stack">' +
      '<div class="no-print" style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">' +
      '<button class="link" type="button" data-act="nav" data-args="turno">← Volver al turno</button>' +
      '<button class="btn btn-quiet btn-sm" type="button" data-act="print">' + icon('print') + 'Imprimir</button></div>' +

      '<section class="panel"><div class="shift-top">' +
      '<div><div class="row-tags">' +
      badge(handover.status === 'RECIBIDA' ? 'resuelto' : handover.status === 'ENVIADA' ? 'curso' : 'pendiente',
        handover.status === 'RECIBIDA' ? 'Recibida' : handover.status === 'ENVIADA' ? 'Enviada' : 'En preparación') +
      chip('Turno ' + SHIFT_TYPE[from.type] + ' · ' + fmtDate(from.date)) +
      (to ? chip('→ Turno ' + SHIFT_TYPE[to.type] + ' · ' + fmtDate(to.date)) : chip('Sin turno siguiente programado')) +
      '</div>' +
      '<h1 class="shift-title" style="margin-top:6px">Entrega de turno</h1>' +
      '<p class="meta" style="margin-top:5px">Emitida por ' + esc(userName(handover.issuedBy)) +
      (handover.issuedAt ? ' · <span class="num">' + fmtDT(handover.issuedAt) + '</span>' : ' · sin enviar') + '</p>' +
      (handover.receivedBy ? '<p class="meta" style="color:var(--resuelto)">✓ Recibida por ' + esc(userName(handover.receivedBy)) + ' · <span class="num">' + fmtDT(handover.receivedAt) + '</span></p>'
        : handover.status === 'ENVIADA' ? '<p class="meta" style="color:var(--atencion)">Pendiente de confirmación desde ' + relative(handover.issuedAt) + '</p>' : '') +
      '</div>' +
      '<div class="counts">' +
      '<div class="count-box" data-tone="critico"><div class="count-num">' + counts.URGENTE + '</div><div class="count-label">Urgente</div></div>' +
      '<div class="count-box" data-tone="atencion"><div class="count-num">' + counts.IMPORTANTE + '</div><div class="count-label">Importante</div></div>' +
      '<div class="count-box" data-tone="neutro"><div class="count-num">' + counts.INFORMATIVO + '</div><div class="count-label">Informativo</div></div>' +
      '</div></div>' +
      (handover.notes ? '<div style="padding:0 16px 14px"><p class="eyebrow">Nota del turno saliente</p><p class="handover-note" style="background:var(--gold-soft);border-color:var(--gold-line)">' + esc(handover.notes) + '</p></div>' : '') +
      (handover.receiverObservations ? '<div style="padding:0 16px 14px"><p class="eyebrow">Observaciones de recepción</p><p class="handover-note" style="background:var(--resuelto-bg);border-color:color-mix(in srgb,var(--resuelto) 30%,transparent)">' + esc(handover.receiverObservations) + '</p></div>' : '') +
      (canEdit ? '<div class="panel-foot no-print" style="display:flex;flex-wrap:wrap;gap:9px;align-items:center">' +
        '<button class="btn btn-quiet btn-sm" type="button" data-act="regenerate" data-args="' + handover.id + '">Actualizar resumen automático</button>' +
        '<span class="meta">El resumen se regenera con el estado actual; tus notas manuales se conservan.</span></div>' : '') +
      '</section>' +

      (handover.items.length ? groups : panel('Sin puntos', null, emptyState('La entrega no tiene puntos registrados.', 'Genera el resumen automático o agrega notas manuales.'))) +

      (canEdit ?
        panel('Agregar nota manual', null,
          '<div class="panel-body form-grid">' +
          '<div class="form-grid two">' +
          '<label class="field"><span class="field-label">Clasificación</span><select id="note-level">' + selectOptions(['URGENTE', 'IMPORTANTE', 'INFORMATIVO'], HANDOVER_LEVEL, 'IMPORTANTE') + '</select></label>' +
          '<label class="field"><span class="field-label">Nota</span><input type="text" id="note-title" placeholder="Ej: Llave del ascensor de servicio en recepción"></label>' +
          '</div>' +
          '<label class="field"><span class="field-label">Detalle</span><textarea id="note-detail"></textarea></label>' +
          '<div style="display:flex;justify-content:flex-end"><button class="btn btn-quiet btn-sm" type="button" data-act="add-note" data-args="' + handover.id + '">Agregar nota</button></div>' +
          '</div>', '', 'no-print') +
        panel('Enviar la entrega', null,
          '<div class="panel-body form-grid">' +
          '<p class="meta">Al enviarla queda registrada de forma permanente y el turno siguiente debe confirmarla.' +
          (to ? ' Destinatario: turno ' + SHIFT_TYPE[to.type] + ' (' + esc(to.staff.map(userName).join(', ')) + ').' : ' No hay turno siguiente programado: quedará disponible para quien lo inicie.') + '</p>' +
          '<label class="field"><span class="field-label">Nota de cierre para el turno siguiente</span>' +
          '<textarea id="handover-notes" placeholder="Prioridad de la noche: cerrar cuentas del grupo y revisar la 318.">' + esc(handover.notes || '') + '</textarea></label>' +
          '<div style="display:flex;justify-content:flex-end"><button class="btn btn-gold" type="button" data-act="send" data-args="' + from.id + '">' + icon('send') + 'Enviar entrega al turno siguiente</button></div>' +
          '</div>', '', 'no-print')
        : '') +
      '</div>';
  }


  // ------------------------- Tareas / incidencias --------------------------
  function viewTareas() {
    const tab = state.tabs.tareas;
    const all = state.tasks.filter((t) => !t.deleted);
    const mine = tab === 'mias';
    let list = all.filter(function (t) {
      if (tab === 'abiertas') return TASK_OPEN.indexOf(t.status) >= 0;
      if (tab === 'mias') return t.assigneeId === state.currentUserId && TASK_OPEN.indexOf(t.status) >= 0;
      if (tab === 'vencidas') return TASK_OPEN.indexOf(t.status) >= 0 && isOverdue(t.dueAt, true);
      if (tab === 'completadas') return t.status === 'COMPLETADA';
      return true;
    });
    list = list.sort(function (a, b) {
      const ao = isOverdue(a.dueAt, TASK_OPEN.indexOf(a.status) >= 0) ? 0 : 1;
      const bo = isOverdue(b.dueAt, TASK_OPEN.indexOf(b.status) >= 0) ? 0 : 1;
      if (ao !== bo) return ao - bo;
      return (a.dueAt ? new Date(a.dueAt) : Infinity) - (b.dueAt ? new Date(b.dueAt) : Infinity);
    });

    const count = (fn) => all.filter(fn).length;
    const tabs = [
      ['abiertas', 'Abiertas', count((t) => TASK_OPEN.indexOf(t.status) >= 0)],
      ['mias', 'Mías', count((t) => t.assigneeId === state.currentUserId && TASK_OPEN.indexOf(t.status) >= 0)],
      ['vencidas', 'Vencidas', count((t) => TASK_OPEN.indexOf(t.status) >= 0 && isOverdue(t.dueAt, true))],
      ['completadas', 'Completadas', count((t) => t.status === 'COMPLETADA')],
      ['todas', 'Todas', all.length]
    ];

    return '<div class="stack">' +
      '<header class="page-head"><h1>Tareas</h1><p class="page-sub">Lo que hay que hacer, con responsable, prioridad, fecha límite y origen trazable.</p></header>' +
      '<div class="tabs">' + tabs.map(function (t) {
        return '<button class="tab" type="button" aria-pressed="' + (tab === t[0]) + '" data-act="tab" data-args="tareas|' + t[0] + '">' + t[1] + '<span class="num">' + t[2] + '</span></button>';
      }).join('') + '</div>' +
      panel(mine ? 'Mis tareas abiertas' : 'Tareas', list.length,
        list.length ? '<ul class="rows">' + list.map(function (t) { return taskRow(t, true); }).join('') + '</ul>' :
        emptyState('No hay tareas en esta vista.', 'Crea una con la acción rápida «Nueva tarea».')) +
      '</div>';
  }

  function viewIncidencias() {
    const tab = state.tabs.incidencias;
    const all = state.entries.filter((e) => !e.deleted && e.type === 'INCIDENCIA');
    const list = all.filter(function (e) {
      if (tab === 'abiertas') return ENTRY_OPEN.indexOf(e.status) >= 0;
      if (tab === 'criticas') return e.severity === 'CRITICA';
      if (tab === 'cerradas') return ENTRY_OPEN.indexOf(e.status) < 0;
      return true;
    }).sort((a, b) => ['BAJA', 'MEDIA', 'ALTA', 'CRITICA'].indexOf(b.severity) - ['BAJA', 'MEDIA', 'ALTA', 'CRITICA'].indexOf(a.severity));

    const bySeverity = ['CRITICA', 'ALTA', 'MEDIA', 'BAJA'].map(function (s) {
      return tile('Gravedad ' + PRIORITY[s], all.filter((e) => e.severity === s && ENTRY_OPEN.indexOf(e.status) >= 0).length, null,
        s === 'CRITICA' && all.some((e) => e.severity === 'CRITICA' && ENTRY_OPEN.indexOf(e.status) >= 0) ? 'alert' : null);
    }).join('');

    return '<div class="stack">' +
      '<header class="page-head"><h1>Incidencias</h1><p class="page-sub">Son registros del libro con estructura ampliada: gravedad, impacto, acción inmediata, causa y resolución. Un solo modelo, sin módulo duplicado.</p></header>' +
      '<div class="tiles">' + bySeverity + '</div>' +
      '<div class="tabs">' + [['abiertas', 'Abiertas'], ['criticas', 'Críticas'], ['cerradas', 'Cerradas'], ['todas', 'Todas']].map(function (t) {
        return '<button class="tab" type="button" aria-pressed="' + (tab === t[0]) + '" data-act="tab" data-args="incidencias|' + t[0] + '">' + t[1] + '</button>';
      }).join('') + '</div>' +
      panel('Incidencias', list.length, list.length ? '<ul class="rows">' + list.map(entryRow).join('') + '</ul>' :
        emptyState('No hay incidencias en esta vista.', 'Al crear una se exige indicar la gravedad.')) +
      '</div>';
  }

  function viewAlertas() {
    const tab = state.tabs.alertas;
    const list = state.alerts.filter(function (a) {
      if (tab === 'activas') return alertIsLive(a);
      if (tab === 'pospuestas') return a.status === 'POSPUESTA';
      if (tab === 'resueltas') return a.status === 'RESUELTA';
      return true;
    }).sort((a, b) => ['INFORMATIVA', 'ATENCION', 'CRITICA'].indexOf(b.level) - ['INFORMATIVA', 'ATENCION', 'CRITICA'].indexOf(a.level));

    return '<div class="stack">' +
      '<header class="page-head" style="display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end">' +
      '<div><h1>Alertas</h1><p class="page-sub">Generadas por el motor de reglas o creadas a mano. Idempotentes: ejecutar el motor no duplica alertas, y se resuelven solas cuando la condición de origen desaparece.</p></div>' +
      (can('alert.manage') ? '<div style="display:flex;gap:7px;flex-wrap:wrap">' +
        '<button class="btn btn-quiet btn-sm" type="button" data-act="run-engine">Revisar alertas ahora</button>' +
        '<button class="btn btn-gold btn-sm" type="button" data-act="new-alert">Nueva alerta</button></div>' : '') +
      '</header>' +
      '<div class="tabs">' + [['activas', 'Activas'], ['pospuestas', 'Pospuestas'], ['resueltas', 'Resueltas'], ['todas', 'Todas']].map(function (t) {
        return '<button class="tab" type="button" aria-pressed="' + (tab === t[0]) + '" data-act="tab" data-args="alertas|' + t[0] + '">' + t[1] + '</button>';
      }).join('') + '</div>' +
      (list.length ? list.map(function (a) {
        const guest = state.guests.find((g) => g.id === a.guestId);
        const reservation = state.reservations.find((r) => r.id === a.reservationId);
        return '<section class="panel"><div style="padding:13px 15px">' +
          '<div class="row-tags">' + badge(ALERT_LEVEL_TONE[a.level], ALERT_LEVEL[a.level]) + chip(ALERT_TYPE[a.type]) +
          badge(a.status === 'RESUELTA' ? 'resuelto' : a.status === 'POSPUESTA' ? 'pendiente' : a.status === 'VISTA' ? 'atencion' : 'critico', ALERT_STATUS[a.status]) +
          (a.auto ? chip('Automática') : chip('Manual')) + '</div>' +
          '<h2 style="margin-top:7px;font-size:14.5px">' + esc(a.title) + '</h2>' +
          (a.message ? '<p class="prose" style="margin-top:3px">' + esc(a.message) + '</p>' : '') +
          '<p class="meta" style="margin-top:6px">Creada <span class="num">' + fmtDT(a.createdAt) + '</span>' +
          (a.dueAt ? ' · vence ' + relative(a.dueAt) : '') +
          (a.snoozedUntil && a.status === 'POSPUESTA' ? ' · pospuesta hasta <span class="num">' + fmtDT(a.snoozedUntil) + '</span>' : '') +
          (a.acknowledgedBy ? ' · vista por ' + esc(userName(a.acknowledgedBy)) : '') +
          (guest ? ' · ' + esc(guest.name) + (guest.room ? ' (hab. ' + esc(guest.room) + ')' : '') : '') +
          (reservation ? ' · reserva <span class="num">' + esc(reservation.code) + '</span>' : '') + '</p>' +
          (a.resolutionNote ? '<p style="margin-top:6px;padding:7px 9px;border-radius:6px;background:var(--resuelto-bg);color:var(--resuelto);font-size:12.5px">' + esc(a.resolutionNote) + '</p>' : '') +
          '</div>' +
          (can('alert.manage') && a.status !== 'RESUELTA' ? '<div class="panel-foot" style="display:flex;flex-wrap:wrap;gap:7px;align-items:center">' +
            (a.status === 'NUEVA' ? '<button class="btn btn-quiet btn-sm" type="button" data-act="alert-ack" data-args="' + a.id + '">Marcar vista</button>' : '') +
            '<button class="btn btn-quiet btn-sm" type="button" data-act="alert-snooze" data-args="' + a.id + '|60">Posponer 1 h</button>' +
            '<button class="btn btn-gold btn-sm" type="button" data-act="alert-resolve" data-args="' + a.id + '">Resolver</button>' +
            (a.entryId ? '<button class="link" type="button" data-act="open-entry" data-args="' + a.entryId + '">Ver registro</button>' : '') +
            (a.taskId ? '<button class="link" type="button" data-act="open-task" data-args="' + a.taskId + '">Ver tarea</button>' : '') +
            (a.handoverId ? '<button class="link" type="button" data-act="open-handover" data-args="' + a.handoverId + '">Ver entrega</button>' : '') +
            '</div>' : '') +
          '</section>';
      }).join('') : panel('Alertas', 0, emptyState('No hay alertas en esta vista.', 'El motor revisa garantías, cobros, vencimientos, incidencias críticas y entregas pendientes.'))) +
      '</div>';
  }

  function viewSeguimientos() {
    const tab = state.tabs.seguimientos;
    const list = state.followups.filter(function (f) {
      if (tab === 'pendientes') return f.status === 'PENDIENTE' || f.status === 'VENCIDO';
      if (tab === 'mios') return f.ownerId === state.currentUserId;
      if (tab === 'cumplidos') return f.status === 'CUMPLIDO';
      return true;
    }).sort((a, b) => new Date(a.scheduledAt || 0) - new Date(b.scheduledAt || 0));

    const counts = {
      PENDIENTE: state.followups.filter((f) => f.status === 'PENDIENTE').length,
      VENCIDO: state.followups.filter((f) => f.status === 'VENCIDO').length,
      CUMPLIDO: state.followups.filter((f) => f.status === 'CUMPLIDO').length
    };

    return '<div class="stack">' +
      '<header class="page-head"><h1>Seguimientos</h1><p class="page-sub">Qué se hizo, qué resultó y cuándo hay que volver a revisar. Si llega la fecha y sigue abierto, el motor lo marca vencido y genera alerta.</p></header>' +
      '<div class="tiles">' +
      tile('Pendientes', counts.PENDIENTE) +
      tile('Vencidos', counts.VENCIDO, null, counts.VENCIDO ? 'alert' : 'good') +
      tile('Cumplidos', counts.CUMPLIDO, null, 'good') +
      tile('Total', state.followups.length) +
      '</div>' +
      '<div class="tabs">' + [['pendientes', 'Pendientes y vencidos'], ['mios', 'Míos'], ['cumplidos', 'Cumplidos'], ['todos', 'Todos']].map(function (t) {
        return '<button class="tab" type="button" aria-pressed="' + (tab === t[0]) + '" data-act="tab" data-args="seguimientos|' + t[0] + '">' + t[1] + '</button>';
      }).join('') + '</div>' +
      panel('Seguimientos', list.length, list.length ? '<ul class="rows">' + list.map(function (f) {
        const entry = state.entries.find((e) => e.id === f.entryId);
        const closable = (f.status === 'PENDIENTE' || f.status === 'VENCIDO');
        return '<li style="padding:12px 14px">' +
          '<div class="row-tags">' + badge(FU_TONE[f.status], FU_STATUS[f.status]) +
          (entry ? '<button class="link" type="button" data-act="open-entry" data-args="' + entry.id + '">Registro #' + entry.seq + '</button>' : '') + '</div>' +
          '<p style="margin:5px 0 0;font-weight:500">' + esc(f.action) + '</p>' +
          (f.result ? '<p class="meta" style="margin-top:3px">Resultado: ' + esc(f.result) + '</p>' : '') +
          (f.nextAction ? '<p class="meta" style="margin-top:3px">Próxima acción: ' + esc(f.nextAction) + '</p>' : '') +
          '<p class="meta" style="margin-top:3px">Responsable: ' + esc(userName(f.ownerId)) + ' · creado por ' + esc(userName(f.createdBy)) +
          (f.scheduledAt ? ' · programado <span class="num">' + fmtDT(f.scheduledAt) + '</span> (' + relative(f.scheduledAt) + ')' : '') + '</p>' +
          (closable && can('followup.create') ? '<div style="margin-top:8px"><button class="btn btn-quiet btn-sm" type="button" data-act="close-followup" data-args="' + f.id + '">Cerrar seguimiento</button></div>' : '') +
          '</li>';
      }).join('') + '</ul>' : emptyState('No hay seguimientos en esta vista.')) +
      '</div>';
  }


  // ------------------------------ Indicadores -----------------------------
  function viewIndicadores() {
    const tasks = state.tasks.filter((t) => !t.deleted);
    const completed = tasks.filter((t) => t.status === 'COMPLETADA');
    const onTime = completed.filter((t) => !t.dueAt || (t.completedAt && new Date(t.completedAt) <= new Date(t.dueAt)));
    const overdue = tasks.filter((t) => TASK_OPEN.indexOf(t.status) >= 0 && isOverdue(t.dueAt, true));
    const open = tasks.filter((t) => TASK_OPEN.indexOf(t.status) >= 0);

    const entries = state.entries.filter((e) => !e.deleted);
    const incidents = entries.filter((e) => e.type === 'INCIDENCIA');
    const openIncidents = incidents.filter((e) => ENTRY_OPEN.indexOf(e.status) >= 0);
    const closedIncidents = incidents.filter((e) => ENTRY_OPEN.indexOf(e.status) < 0 && e.closedAt);
    const resolutionHours = closedIncidents.map((e) => (new Date(e.closedAt) - new Date(e.occurredAt)) / 3600000);
    const avgResolution = resolutionHours.length ? resolutionHours.reduce((a, b) => a + b, 0) / resolutionHours.length : null;

    const sent = state.handovers.filter((h) => h.status === 'ENVIADA' || h.status === 'RECIBIDA');
    const received = state.handovers.filter((h) => h.status === 'RECIBIDA');
    const closedShifts = state.shifts.filter((s) => s.status === 'CERRADO');
    const inherited = entries.filter((e) => ENTRY_OPEN.indexOf(e.status) >= 0 && new Date(e.occurredAt) < new Date(Date.now() - 8 * 3600000));

    const byDepartment = {};
    incidents.forEach(function (e) { const k = e.department || 'Sin área'; byDepartment[k] = (byDepartment[k] || 0) + 1; });
    const deptRows = Object.keys(byDepartment).map((k) => ({ label: k, value: byDepartment[k] })).sort((a, b) => b.value - a.value);

    const byShift = {};
    entries.forEach(function (e) {
      const s = e.shiftId ? shiftById(e.shiftId) : null;
      const k = s ? SHIFT_TYPE[s.type] + ' ' + fmtShort(s.date) : 'Sin turno';
      byShift[k] = (byShift[k] || 0) + 1;
    });
    const shiftRows = Object.keys(byShift).map((k) => ({ label: k, value: byShift[k] }));

    const bars = (rows, tone) => {
      const max = Math.max.apply(null, rows.map((r) => r.value).concat([1]));
      return '<ul class="bars">' + rows.map(function (r) {
        return '<li><div class="bar-head"><span>' + esc(r.label) + '</span><span class="num muted">' + r.value + '</span></div>' +
          '<div class="bar-track"><div class="bar-fill"' + (tone ? ' data-tone="' + tone + '"' : '') + ' style="width:' + Math.max(4, Math.round(r.value / max * 100)) + '%"></div></div></li>';
      }).join('') + '</ul>';
    };

    return '<div class="stack">' +
      '<header class="page-head"><h1>Indicadores</h1><p class="page-sub">Cumplimiento, carga heredada y tiempos de resolución. Se calculan en vivo sobre los datos de la operación.</p></header>' +

      '<p class="eyebrow">Tareas</p>' +
      '<div class="tiles">' +
      tile('Completadas en plazo', completed.length ? Math.round(onTime.length / completed.length * 100) + '%' : '—', onTime.length + ' de ' + completed.length + ' completadas', completed.length && onTime.length / completed.length >= 0.8 ? 'good' : null) +
      tile('Fuera de plazo', completed.length - onTime.length, null, completed.length - onTime.length ? 'alert' : 'good') +
      tile('Vencidas ahora', overdue.length, null, overdue.length ? 'alert' : 'good') +
      tile('Abiertas ahora', open.length) +
      '</div>' +

      '<p class="eyebrow">Incidencias y alertas</p>' +
      '<div class="tiles">' +
      tile('Incidencias abiertas', openIncidents.length, null, openIncidents.length ? 'alert' : 'good') +
      tile('Cerradas', closedIncidents.length) +
      tile('Tiempo medio de resolución', avgResolution != null ? avgResolution.toFixed(1) + ' h' : '—', 'Desde el hecho hasta el cierre') +
      tile('Alertas activas', liveAlerts().length, null, liveAlerts().length ? 'alert' : 'good') +
      '</div>' +

      '<p class="eyebrow">Turnos y entregas</p>' +
      '<div class="tiles">' +
      tile('Cumplimiento de entregas', sent.length ? Math.round(received.length / sent.length * 100) + '%' : '—', received.length + ' recibidas de ' + sent.length + ' enviadas', sent.length && received.length / sent.length >= 0.9 ? 'good' : null) +
      tile('Entregas enviadas', sent.length) +
      tile('Turnos cerrados', closedShifts.length + ' / ' + state.shifts.length) +
      tile('Pendientes heredados', inherited.length, 'Abiertos de turnos anteriores', inherited.length > 5 ? 'alert' : null) +
      '</div>' +

      '<div class="grid grid-2">' +
      panel('Incidencias por área', null, deptRows.length ? bars(deptRows) : emptyState('Sin incidencias registradas.')) +
      panel('Volumen de registros por turno', null, shiftRows.length ? bars(shiftRows, 'gold') : emptyState('Sin registros.')) +
      '</div>' +
      '<p class="meta" style="text-align:center">Esta versión mide cumplimiento y carga; no pretende ser una herramienta de inteligencia de negocio.</p>' +
      '</div>';
  }


  // -------------------------- Huéspedes y reservas ------------------------
  const GUARANTEE_TONE = { NO_REQUIERE: 'neutro', PENDIENTE: 'atencion', VALIDADA: 'resuelto', RECHAZADA: 'critico' };
  const RESERVATION_TONE = { PENDIENTE: 'pendiente', CONFIRMADA: 'curso', EN_CASA: 'resuelto', SALIDA: 'neutro', NO_SHOW: 'atencion', CANCELADA: 'neutro' };

  function viewHuespedes() {
    const canEdit = can('guest.manage');
    const reservations = state.reservations.slice().sort(function (a, b) {
      const actionA = a.action || a.guarantee === 'PENDIENTE' || a.guarantee === 'RECHAZADA' || a.balance > 0 ? 0 : 1;
      const actionB = b.action || b.guarantee === 'PENDIENTE' || b.guarantee === 'RECHAZADA' || b.balance > 0 ? 0 : 1;
      if (actionA !== actionB) return actionA - actionB;
      return new Date(b.checkIn || 0) - new Date(a.checkIn || 0);
    });

    return '<div class="stack">' +
      '<header class="page-head"><h1>Huéspedes y reservas</h1>' +
      '<p class="page-sub">Referencias ligeras para asociar registros operativos. No reemplazan al PMS: garantías, cobros y acciones pendientes alimentan el motor de alertas.</p></header>' +

      panel('Reservas', state.reservations.length,
        state.reservations.length === 0 ? emptyState('Sin reservas registradas.', canEdit ? 'Agrega las que requieren atención de recepción.' : '') :
        '<ul class="rows">' + reservations.map(function (r) {
          const guest = state.guests.find((g) => g.id === r.guestId);
          return '<li style="padding:11px 14px">' +
            '<div class="row-tags"><span class="ref">' + esc(r.code) + '</span>' +
            badge(RESERVATION_TONE[r.status] || 'neutro', RESERVATION_STATUS[r.status] || r.status) +
            badge(GUARANTEE_TONE[r.guarantee] || 'neutro', 'Garantía ' + (GUARANTEE_STATUS[r.guarantee] || r.guarantee).toLowerCase()) +
            (r.balance > 0 ? badge('critico', 'Saldo ' + money(r.balance)) : '') +
            (guest && guest.vip ? badge('atencion', 'VIP') : '') + '</div>' +
            '<p class="row-title">' + esc(guest ? guest.name : 'Sin huésped asociado') + (r.room ? ' · hab. ' + esc(r.room) : '') + '</p>' +
            '<p class="row-meta"><span>Llegada <span class="num">' + fmtDT(r.checkIn) + '</span></span>' +
            '<span>Salida <span class="num">' + fmtDT(r.checkOut) + '</span></span>' +
            (r.channel ? '<span>' + esc(r.channel) + '</span>' : '') + '</p>' +
            (r.action ? '<p class="meta" style="color:var(--atencion)">Acción: ' + esc(r.action) + '</p>' : '') +
            (canEdit ? '<div style="margin-top:7px"><button class="btn btn-quiet btn-sm" type="button" data-act="edit-reservation" data-args="' + r.id + '">Editar</button></div>' : '') +
            '</li>';
        }).join('') + '</ul>',
        canEdit ? '<button class="btn btn-gold btn-sm" type="button" data-act="new-reservation">' + icon('plus') + 'Nueva reserva</button>' : '') +

      panel('Huéspedes', state.guests.length,
        state.guests.length === 0 ? emptyState('Sin huéspedes registrados.') :
        '<ul class="rows">' + state.guests.slice().sort((a, b) => (b.vip ? 1 : 0) - (a.vip ? 1 : 0) || String(a.name).localeCompare(String(b.name))).map(function (g) {
          const linked = state.entries.filter((e) => e.guestId === g.id && !e.deleted).length;
          return '<li style="padding:11px 14px">' +
            '<div class="row-tags"><strong style="font-size:13.5px">' + esc(g.name) + '</strong>' +
            (g.vip ? badge('atencion', 'VIP') : '') + (g.room ? chip('Hab. ' + g.room) : '') + '</div>' +
            (g.notes ? '<p class="row-text">' + esc(g.notes) + '</p>' : '') +
            '<p class="row-meta">' + (linked ? '<span>' + linked + ' registro(s) asociado(s)</span>' : '<span>Sin registros asociados</span>') +
            (g.phone ? '<span>' + esc(g.phone) + '</span>' : '') + '</p>' +
            (canEdit ? '<div style="margin-top:7px"><button class="btn btn-quiet btn-sm" type="button" data-act="edit-guest" data-args="' + g.id + '">Editar</button></div>' : '') +
            '</li>';
        }).join('') + '</ul>',
        canEdit ? '<button class="btn btn-gold btn-sm" type="button" data-act="new-guest">' + icon('plus') + 'Nuevo huésped</button>' : '') +
      '</div>';
  }

  // ----------------------------- Administración ---------------------------
  function viewAdmin() {
    const canStaff = can('user.manage');
    const canRoles = can('role.manage');
    const canShifts = can('shift.manage');

            '<div class="row-tags"><strong style="font-size:13.5px">' + esc(u.name) + '</strong>' +
