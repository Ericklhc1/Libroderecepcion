              '<button class="btn btn-quiet btn-sm" type="button" data-act="edit-staff" data-args="' + u.id + '">Editar</button>' +
              (u.id === state.currentUserId ? '' : '<button class="btn btn-quiet btn-sm" type="button" data-act="toggle-staff" data-args="' + u.id + '">' + (inactive ? 'Reactivar' : 'Desactivar') + '</button>') +
              '</div>' : '') +
            '</li>';
        }).join('') + '</ul>',
        canStaff ? '<button class="btn btn-gold btn-sm" type="button" data-act="new-staff">' + icon('plus') + 'Agregar persona</button>' : '') +

      // ------------------------------- Turnos -------------------------------
      (canShifts ? panel('Programar turnos', null,
        '<div class="panel-body form-grid">' +
        '<p class="meta">Un turno por fecha y tipo. Sólo aparece el personal operativo.</p>' +
        '<label class="field" style="max-width:220px"><span class="field-label">Fecha</span><input type="date" id="sched-date" value="' + dateValue + '"></label>' +
        '<div class="form-grid" style="gap:10px">' +
        ORDER.map(function (type) {
          return '<label class="field"><span class="field-label">' + SHIFT_TYPE[type] + ' · ' + SHIFT_HOURS[type][0] + '–' + SHIFT_HOURS[type][1] + '</span>' +
            '<select id="sched-' + type.toLowerCase() + '">' + peopleOptions(null) + '</select></label>';
        }).join('') +
        '</div>' +
        '<div style="display:flex;justify-content:flex-end"><button class="btn btn-gold btn-sm" type="button" data-act="schedule-shifts">Programar el día</button></div>' +
        '</div>') : '') +

      (canShifts ? panel('Turnos programados', state.shifts.length,
        state.shifts.length === 0 ? emptyState('Todavía no hay turnos programados.', 'Programa el día actual para que el equipo pueda iniciar turno.') :
        '<ul class="rows">' + state.shifts.slice().sort((a, b) => new Date(b.date) - new Date(a.date) || ORDER.indexOf(a.type) - ORDER.indexOf(b.type)).slice(0, 21).map(function (s) {
          const handover = handoverFrom(s.id);
          return '<li style="padding:10px 14px">' +
            '<div class="row-tags"><strong style="font-size:13.5px">' + SHIFT_TYPE[s.type] + ' · ' + fmtDate(s.date) + '</strong>' +
            badge(s.status === 'ACTIVO' || s.status === 'INICIADO' ? 'curso' : s.status === 'CERRADO' ? 'neutro' : s.status === 'PROGRAMADO' ? 'pendiente' : 'atencion', SHIFT_LABEL[s.status]) +
            (handover ? chip('Entrega: ' + (handover.status === 'RECIBIDA' ? 'recibida' : handover.status === 'ENVIADA' ? 'enviada' : 'en preparación')) : '') + '</div>' +
            '<p class="row-meta"><span>' + esc(s.staff.length ? s.staff.map(userName).join(', ') : 'sin personal asignado') + '</span>' +
            (s.startedAt ? '<span>inicio <span class="num">' + fmtTime(s.startedAt) + '</span></span>' : '') +
            (s.endedAt ? '<span>cierre <span class="num">' + fmtTime(s.endedAt) + '</span></span>' : '') + '</p></li>';
        }).join('') + '</ul>') : '') +

      // ------------------------------- Permisos -----------------------------
      panel('Matriz de permisos', null,
        '<div class="panel-body">' +
        '<p class="meta" style="margin-bottom:12px">' + (canRoles
          ? 'Los cambios se aplican de inmediato a todo el equipo.'
          : 'Sólo el Administrador de sistema puede modificar esta matriz.') + '</p>' +
        ROLE_ORDER.map(function (key) {
          const role = state.roles[key];
          if (!role) return '';
          const count = state.staff.filter((s) => s.role === key && s.active !== false).length;
          return '<div style="margin-bottom:16px">' +
            '<div class="row-tags" style="margin-bottom:6px"><strong style="font-size:13.5px">' + esc(role.name) + '</strong>' +
            (role.operational ? chip('Operativo') : chip('Fuera de la operación')) +
            '<span class="meta num">' + role.permissions.length + '/' + ALL_PERMISSIONS.length + '</span>' +
            '<span class="meta">' + count + ' persona(s)</span></div>' +
            PERMISSION_GROUPS.map(function (g) {
              return '<p class="eyebrow" style="margin:9px 0 3px">' + esc(g.group) + '</p>' +
                '<div style="display:flex;flex-wrap:wrap;gap:5px">' + g.items.map(function (item) {
                  const has = role.permissions.indexOf(item[0]) >= 0;
                  return '<button class="tab" type="button" aria-pressed="' + has + '"' +
                    (canRoles ? ' data-act="toggle-permission" data-args="' + key + '|' + item[0] + '"' : ' disabled') +
                    ' title="' + esc(item[0]) + '">' + (has ? '✓ ' : '') + esc(item[1]) + '</button>';
                }).join('') + '</div>';
            }).join('') + '</div>';
        }).join('') + '</div>') +

      // ------------------------------- Auditoría ----------------------------
      (canAudit ? panel('Auditoría', state.audit.length,
        state.audit.length === 0 ? emptyState('Sin movimientos registrados todavía.') :
        '<ul class="rows">' + state.audit.slice(0, 40).map(function (a) {
          return '<li style="padding:10px 14px"><div class="row-tags"><span class="meta num">' + fmtDT(a.at) + '</span>' +
            chip(AUDIT_LABEL[a.action] || a.action) + chip(a.entity) + '<span class="meta">' + esc(userName(a.actor)) + '</span></div>' +
            '<p style="margin:4px 0 0;font-size:13.5px">' + esc(a.summary) + '</p></li>';
        }).join('') + '</ul>',
        '<span class="meta">Últimos 60 días</span>') : '') +

      // -------------------------- Registros eliminados ----------------------
      (can('entry.delete') ? panel('Registros eliminados', deleted.length,
        deleted.length === 0 ? emptyState('No hay registros eliminados.') :
        '<ul class="rows">' + deleted.map(function (e) {
          return '<li style="padding:11px 14px">' +
            '<div class="row-tags"><span class="ref">#' + e.seq + '</span>' + chip(ENTRY_TYPE[e.type]) + badge('neutro', 'Eliminado') + '</div>' +
            '<p class="row-title">' + esc(e.title) + '</p>' +
            '<p class="row-meta"><span>Eliminado <span class="num">' + fmtDT(e.deletedAt) + '</span> por ' + esc(userName(e.deletedBy)) + '</span></p>' +
            (e.deletionReason ? '<p class="meta">Motivo: ' + esc(e.deletionReason) + '</p>' : '') +
            '<div style="margin-top:7px"><button class="btn btn-quiet btn-sm" type="button" data-act="restore-entry" data-args="' + e.id + '">Restaurar</button></div>' +
            '</li>';
        }).join('') + '</ul>') : '') +

      // ------------------------------ Sistema -------------------------------
      (canSystem ? panel('Sistema', null,
        '<div class="panel-body" style="display:flex;flex-direction:column;gap:16px">' +
        '<div>' +
        '<p class="eyebrow">Almacenamiento</p>' +
        '<div class="bar-head"><span>' + docCount + ' de 5.000 documentos</span><span class="num muted">' + docPercent + '%</span></div>' +
        '<div class="bar-track" style="margin-top:6px"><div class="bar-fill"' + (docPercent > 70 ? ' style="width:' + docPercent + '%;background:var(--critico-mark)"' : ' style="width:' + Math.max(2, docPercent) + '%"') + '></div></div>' +
        '<p class="meta" style="margin-top:6px">' + (docPercent > 70
          ? 'Conviene archivar registros cerrados para liberar espacio.'
          : 'Espacio suficiente. Archiva periódicamente los registros cerrados antiguos.') + '</p>' +
        '</div>' +
        '<div>' +
        '<p class="eyebrow">Archivar registros cerrados</p>' +
        '<p class="meta">Los registros y tareas cerrados más antiguos que el plazo se agrupan en un documento por mes y dejan de ocupar espacio individual. La información se conserva.</p>' +
        '<div style="display:flex;gap:8px;align-items:end;margin-top:8px;flex-wrap:wrap">' +
        '<label class="field" style="max-width:190px"><span class="field-label">Anteriores a</span>' +
        '<select id="archive-days"><option value="30">30 días</option><option value="90" selected>90 días</option><option value="180">180 días</option></select></label>' +
        '<button class="btn btn-quiet btn-sm" type="button" data-act="archive-closed">Archivar ahora</button>' +
        '</div></div>' +
        '<div>' +
        '<p class="eyebrow">Motor de alertas</p>' +
        '<p class="meta">Se ejecuta al abrir la página, después de cada cambio y cada cuatro minutos. También puede forzarse.</p>' +
        '<div style="margin-top:8px"><button class="btn btn-quiet btn-sm" type="button" data-act="run-engine">Revisar alertas ahora</button></div>' +
        '</div>' +
        (state.entries.length === 0 ? '<div>' +
          '<p class="eyebrow">Datos de ejemplo</p>' +
          '<p class="meta">El sistema está vacío. Puedes cargar un día de operación de ejemplo para practicar el ciclo completo; luego elimina los registros o archívalos.</p>' +
          '<div style="margin-top:8px"><button class="btn btn-quiet btn-sm" type="button" data-act="load-example">Cargar ejemplo</button></div>' +
          '</div>' : '') +
        '</div>') : '') +

      '</div>';
  }

  // ----------------------- Puesta en marcha e identidad -------------------
  function screenShell(inner) {
    return '<div class="auth"><div class="auth-inner">' +
      '<div class="auth-brand"><span class="brand-mark" style="width:42px;height:42px;font-size:23px" aria-hidden="true">L</span>' +
      '<div><p class="brand-hotel">' + esc(state.hotel.name || 'Recepción') + '</p>' +
      '<p class="brand-name" style="font-size:19px">Libro Operativo de Recepción</p></div></div>' +
      inner + '</div></div>';
  }

  function renderStartScreen() {
    const host = document.getElementById('auth-screen');

    if (state.setupStep === 'cargando') {
      host.innerHTML = screenShell('<div class="auth-card"><h1>Abriendo el libro…</h1>' +
        '<p class="meta" style="margin-top:4px">Sincronizando con la base de datos del hotel.</p></div>');
      return;
    }

    if (state.setupStep === 'sin-base') {
      host.innerHTML = screenShell('<div class="auth-card"><h1>Esta vista no puede guardar datos</h1>' +
        '<p class="meta" style="margin-top:6px">El libro necesita la base de datos compartida de la página y este visor no la está entregando. ' +
        'Abre el enlace desde claude.ai con tu cuenta de la organización.</p></div>');
      return;
    }

    if (state.setupStep === 'configuracion') {
      host.innerHTML = screenShell(
        '<div class="auth-card">' +
        '<h1>Poner en marcha el libro</h1>' +
        '<p class="meta" style="margin:4px 0 16px">Sólo se hace una vez. Quien configura queda como Administrador de sistema y luego agrega al equipo.</p>' +
        '<div class="form-grid">' +
        '<label class="field"><span class="field-label">Nombre del hotel</span>' +
        '<input type="text" id="setup-hotel" placeholder="Hotel Costa Serena" maxlength="80"></label>' +
        '<label class="field"><span class="field-label">Tu nombre completo</span>' +
        '<input type="text" id="setup-name" placeholder="Nombre y apellido" maxlength="120"></label>' +
        '<button class="btn btn-primary" type="button" data-act="submit-setup" style="width:100%;padding:9px">Crear el libro</button>' +
        '</div></div>' +
        '<div class="auth-demo"><p class="auth-demo-title">Qué pasa después</p>' +
        '<p style="margin:0">Agregas a tu equipo con su rol, programas los turnos del día y el libro queda operativo. ' +
        'Todo lo que registre el equipo se guarda y se sincroniza entre los dispositivos que tengan esta página abierta.</p></div>');
      return;
    }

    // Identidad: en un mesón compartido cada persona indica quién es.
    const active = USERS.filter((u) => u.active !== false);
    host.innerHTML = screenShell(
      '<div class="auth-card">' +
      '<h1>¿Quién está en el mesón?</h1>' +
      '<p class="meta" style="margin:4px 0 14px">Todo lo que registres quedará a tu nombre en el libro y en la auditoría. Este dispositivo lo recordará.</p>' +
      (active.length === 0
        ? '<p class="auth-error">Todavía no hay personal activo. Un Administrador de sistema debe agregar al equipo.</p>'
        : '<ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px">' +
          active.map(function (u) {
            const role = state.roles[u.role] || { name: u.role };
            return '<li><button class="btn btn-quiet" type="button" data-act="pick-user" data-args="' + u.id + '" ' +
              'style="width:100%;justify-content:flex-start;padding:10px 12px">' +
              '<span class="avatar" aria-hidden="true">' + esc(initials(u.name)) + '</span>' +
              '<span style="text-align:left"><span style="display:block;font-weight:600">' + esc(u.name) + '</span>' +
              '<span style="display:block;font-size:11.5px;color:var(--ink-3)">' + esc(role.name) + '</span></span></button></li>';
          }).join('') + '</ul>') +
      '</div>' +
      '<div class="auth-demo"><p class="auth-demo-title">Acceso</p>' +
      '<p style="margin:0">Esta página es interna: sólo la abre quien pertenece a tu organización y a quien le compartan el enlace. ' +
      'Dentro, cada persona se identifica para que el libro registre quién hizo cada cosa.</p></div>');
  }

  // ------------------------------ Navegación ------------------------------
  const NAV = [
    { view: 'inicio', label: 'Inicio', icon: 'home', mobile: true },
    { view: 'libro', label: 'Libro operativo', icon: 'book', mobile: true },
    { view: 'turno', label: 'Turno', icon: 'shift', anyOf: ['shift.start', 'shift.receive', 'shift.handover', 'shift.close', 'shift.manage'], mobile: true },
    { view: 'tareas', label: 'Tareas', icon: 'task', mobile: true },
    { view: 'incidencias', label: 'Incidencias', icon: 'incident' },
    { view: 'alertas', label: 'Alertas', icon: 'alert', mobile: true },
    { view: 'seguimientos', label: 'Seguimientos', icon: 'followup' },
    { view: 'huespedes', label: 'Huéspedes y reservas', icon: 'guest', anyOf: ['guest.manage'] },
    { view: 'indicadores', label: 'Indicadores', icon: 'metrics', anyOf: ['metrics.view'] },
    { view: 'admin', label: 'Administración', icon: 'admin', anyOf: ['user.manage', 'role.manage', 'audit.view', 'system.configure', 'shift.manage'] }
  ];

  const visibleNav = () => NAV.filter((n) => !n.anyOf || n.anyOf.some(can));

  function renderNav() {
    const alerts = liveAlerts().length;
    const myTasks = state.tasks.filter((t) => !t.deleted && t.assigneeId === state.currentUserId && TASK_OPEN.indexOf(t.status) >= 0).length;
    const counts = { alertas: alerts, tareas: myTasks };
    const current = state.view === 'entrega' ? 'turno' : state.view;

    const hotelLabel = document.getElementById('brand-hotel');
    if (hotelLabel) hotelLabel.textContent = state.hotel.name || 'Recepción';
    const hotelLabelMobile = document.getElementById('brand-hotel-mobile');
    if (hotelLabelMobile) hotelLabelMobile.textContent = state.hotel.name || 'Recepción';

    document.getElementById('nav').innerHTML =
      '<p class="nav-group-label">Operación</p>' +
      visibleNav().map(function (n) {
        const count = counts[n.view];
        return '<button class="nav-item" type="button" data-act="nav" data-args="' + n.view + '"' + (current === n.view ? ' aria-current="page"' : '') + '>' +
          icon(n.icon) + '<span class="nav-label">' + n.label + '</span>' +
          (count ? '<span class="nav-count"' + (n.view === 'tareas' ? ' data-tone="quiet"' : '') + '>' + count + '</span>' : '') +
          '</button>';
      }).join('');

    document.getElementById('bottomnav').innerHTML = visibleNav().filter((n) => n.mobile).slice(0, 5).map(function (n) {
      const count = counts[n.view];
      return '<button type="button" data-act="nav" data-args="' + n.view + '"' + (current === n.view ? ' aria-current="page"' : '') + '>' +
        icon(n.icon) + '<span>' + n.label.split(' ')[0] + '</span>' +
        (count ? '<span class="dot" aria-hidden="true"></span>' : '') + '</button>';
    }).join('');

    const user = me();
    document.getElementById('whoami').innerHTML = user
      ? '<span class="avatar" aria-hidden="true">' + esc(initials(user.name)) + '</span>' +
        '<span style="min-width:0"><span style="display:block;font-size:13px;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis">' + esc(user.name) + '</span>' +
        '<span style="display:block;font-size:11px;color:var(--sidebar-ink-2)">' + esc(myRole().name) + '</span></span>'
      : '';

    document.getElementById('quick-actions').innerHTML =
      (can('entry.create') ? '<button class="btn btn-gold btn-sm" type="button" data-act="new-entry">' + icon('plus') + 'Nueva novedad</button>' : '') +
      (can('incident.create') ? '<button class="btn btn-quiet btn-sm" type="button" data-act="new-incident">' + icon('incident') + 'Nueva incidencia</button>' : '') +
      (can('task.create') ? '<button class="btn btn-quiet btn-sm" type="button" data-act="new-task">' + icon('task') + 'Nueva tarea</button>' : '') +
      (can('followup.create') ? '<button class="btn btn-quiet btn-sm" type="button" data-act="new-followup">' + icon('followup') + 'Nuevo seguimiento</button>' : '') +
      '<span style="flex:1"></span>' +
      (state.dbError ? '<span class="badge" data-tone="atencion" title="' + esc(describeDbError({ code: state.dbError })) + '">Sin sincronizar</span>' : '') +
      '<button class="btn btn-quiet btn-sm" type="button" data-act="switch-user">Cambiar de usuario</button>';
  }

  const VIEWS = {
    inicio: viewInicio, libro: viewLibro, turno: viewTurno, entrega: viewEntrega,
    tareas: viewTareas, incidencias: viewIncidencias, alertas: viewAlertas,
    seguimientos: viewSeguimientos, huespedes: viewHuespedes,

  };

  function render() {
    const inside = state.setupStep === 'listo';
    document.documentElement.dataset.auth = inside ? 'in' : 'out';
    if (!inside) { renderStartScreen(); return; }

    renderNav();

    const allowed = visibleNav().map((n) => n.view).concat(['entrega']);
    if (allowed.indexOf(state.view) < 0) state.view = 'inicio';

    document.getElementById('view').innerHTML = (VIEWS[state.view] || viewInicio)();
  }

  // --------------------------- Eventos delegados --------------------------
  document.addEventListener('click', function (event) {
    if (event.target.dataset && event.target.dataset.scrim === '1') { closeSheet(); return; }
    const trigger = event.target.closest('[data-act]');
    if (!trigger) return;
    const act = trigger.dataset.act;
    const args = trigger.dataset.args || '';
    if (!ACTIONS[act]) return;
    event.preventDefault();
    if (trigger.tagName === 'BUTTON') {
      // Evita dobles envíos mientras la escritura viaja a la base de datos.
      trigger.disabled = true;
      setTimeout(function () { trigger.disabled = false; }, 900);
    }
    Promise.resolve(ACTIONS[act](args)).catch(function (error) {
      console.error('[acción]', act, error);
      fail('No se pudo completar la acción.');
    });
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') closeSheet();
  });

  document.addEventListener('change', function (event) {
    if (event.target.dataset && event.target.dataset.filter) {
      state.filters[event.target.dataset.filter] = event.target.value;
      render();
    }
  });

  let searchTimer = null;
  document.addEventListener('input', function (event) {
    const isGlobal = event.target.id === 'global-search';
    const isFilter = event.target.dataset && event.target.dataset.filter === 'q';
    if (!isGlobal && !isFilter) return;
    clearTimeout(searchTimer);
    const value = event.target.value;
    searchTimer = setTimeout(function () {
      state.filters.q = value;
      if (isGlobal) state.view = 'libro';
      render();
      if (isFilter) {
        const field = document.querySelector('[data-filter="q"]');
        if (field) { field.focus(); field.setSelectionRange(value.length, value.length); }
      }
    }, 300);
  });
