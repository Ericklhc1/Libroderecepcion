  --sidebar: #0f2430;
  --sidebar-2: #163341;
  --sidebar-ink: #dbe8ec;
  --sidebar-ink-2: #90aab4;

  --radius: 10px;
  --radius-sm: 7px;
  --shadow: 0 1px 2px rgba(15, 36, 48, .07), 0 6px 18px -8px rgba(15, 36, 48, .13);
  --shadow-lift: 0 2px 6px rgba(15, 36, 48, .1), 0 20px 40px -16px rgba(15, 36, 48, .3);

  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;

    --resuelto-bg: #0d2c24;

    --sidebar-2: #132c37;
    --sidebar-ink: #dbe8ec;

    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px -8px rgba(0, 0, 0, .5);
    --shadow-lift: 0 2px 8px rgba(0, 0, 0, .5), 0 24px 48px -16px rgba(0, 0, 0, .7);
  }
}

  --atencion-bg: #33220f;

  --shadow-lift: 0 2px 8px rgba(0, 0, 0, .5), 0 24px 48px -16px rgba(0, 0, 0, .7);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

:where(button, a, input, select, textarea):focus-visible {
  outline: 2px solid var(--gold-bright);
  outline-offset: 2px;
  border-radius: 4px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ------------------------------- Estructura ------------------------------- */

.app { display: flex; min-height: 100%; }

.sidebar {
  display: none;
  width: 246px;
  flex-shrink: 0;
  flex-direction: column;
  background: var(--sidebar);
  border-right: 1px solid color-mix(in srgb, var(--sidebar-2) 80%, transparent);
  position: sticky;
  top: 0;
  height: 100vh;
  padding-top: env(safe-area-inset-top, 0px);
}

@media (min-width: 1040px) { .sidebar { display: flex; } }

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 18px 18px 16px;
  border-bottom: 1px solid var(--sidebar-2);
}

.brand-mark {
  width: 34px; height: 34px;
  flex-shrink: 0;
  border-radius: 8px;
  background: linear-gradient(160deg, var(--gold-bright), #9c7a16);
  color: #10242e;
  display: grid; place-items: center;
  font-family: var(--serif);
  font-size: 19px;
  font-weight: 600;
  line-height: 1;
}

.brand-hotel {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--gold-bright);
  margin: 0 0 1px;
}

.brand-name {
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 500;
  color: #fff;
  margin: 0;
  line-height: 1.15;
  letter-spacing: -.01em;
}

.nav { padding: 12px 10px; flex: 1; overflow-y: auto; }

.nav-group-label {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--sidebar-ink-2);
  padding: 12px 9px 6px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 10px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--sidebar-ink);
  font: inherit;
  font-size: 13.5px;
  text-align: left;
  cursor: pointer;
  transition: background .12s ease;
}

.nav-item:hover { background: var(--sidebar-2); }

.nav-item[aria-current="page"] {
  background: var(--sidebar-2);
  color: #fff;
  font-weight: 600;
  box-shadow: inset 2px 0 0 var(--gold-bright);
}

.nav-item svg { width: 16px; height: 16px; flex-shrink: 0; opacity: .85; }
.nav-item[aria-current="page"] svg { opacity: 1; }
.nav-label { flex: 1; }

.nav-count {
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 99px;
  background: var(--gold-bright);
  color: #10242e;
}

.nav-count[data-tone="quiet"] { background: var(--sidebar-2); color: var(--sidebar-ink-2); }

.whoami {
  border-top: 1px solid var(--sidebar-2);
  padding: 12px;
}

.whoami select { font-size: 11.5px; padding: 6px 7px; }

.whoami-label {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--sidebar-ink-2);
  margin: 0 0 6px;
}

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}

.topbar-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
}

.topbar-brand {
  display: flex; align-items: center; gap: 9px;
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 500;
}

@media (min-width: 1040px) { .topbar-brand { display: none; } }

.search {
  position: relative;
  flex: 1;
  min-width: 0;
  max-width: 460px;
}

.search svg {
  position: absolute; left: 10px; top: 50%;
  transform: translateY(-50%);
  width: 15px; height: 15px;
  color: var(--ink-3);
  pointer-events: none;
}

.actions-row {
  display: flex;
  gap: 7px;
  padding: 0 16px 10px;
  overflow-x: auto;
  scrollbar-width: none;
}

.actions-row::-webkit-scrollbar { display: none; }

.content {
  flex: 1;
  padding: 16px;
  padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  max-width: 1180px;
  width: 100%;
  margin: 0 auto;
}

@media (min-width: 1040px) { .content { padding-bottom: 32px; } }

.bottomnav {
  position: fixed;
  inset-inline: 0;
  bottom: 0;
  z-index: 30;
  display: flex;
  background: color-mix(in srgb, var(--surface) 95%, transparent);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (min-width: 1040px) { .bottomnav { display: none; } }

.bottomnav button {
  flex: 1;
  border: 0;
  background: transparent;
  padding: 7px 2px 8px;
  color: var(--ink-3);
  font: inherit;
  font-size: 10px;
  font-weight: 500;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: pointer;
  position: relative;
}

.bottomnav button svg { width: 19px; height: 19px; }
.bottomnav button[aria-current="page"] { color: var(--petrol); }
:root[data-theme="dark"] .bottomnav button[aria-current="page"] { color: var(--petrol); }

.bottomnav button[aria-current="page"]::before {
  content: "";
  position: absolute;
  top: 0; left: 26%; right: 26%;
  height: 2px;
  border-radius: 0 0 2px 2px;
  background: var(--gold-bright);
}

.bottomnav .dot {
  position: absolute;
  top: 6px;
  right: calc(50% - 16px);
  width: 7px; height: 7px;
  border-radius: 99px;
  background: var(--critico-mark);
  border: 1.5px solid var(--surface);
}

/* ------------------------------ Tipografía ------------------------------- */

h1 {
  font-family: var(--serif);
  font-size: clamp(22px, 4vw, 27px);
  font-weight: 500;
  letter-spacing: -.015em;
  line-height: 1.15;
  margin: 0;
  text-wrap: balance;
}

h2 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.005em; }
h3 { font-size: 13.5px; font-weight: 600; margin: 0; }

.page-head { margin-bottom: 16px; }
.page-sub { color: var(--ink-2); margin: 5px 0 0; max-width: 62ch; }

.eyebrow {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 0 0 4px;
}

.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.meta { font-size: 12px; color: var(--ink-3); }
.meta .num { font-size: 11.5px; }

/* -------------------------------- Bloques -------------------------------- */

.stack { display: flex; flex-direction: column; gap: 14px; }
.grid { display: grid; gap: 14px; }
@media (min-width: 900px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
@media (min-width: 900px) { .grid-3 { grid-template-columns: 2fr 1fr; } }

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.panel-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  border-bottom: 1px solid var(--line-soft);
  background: var(--surface-2);
}

.panel-head h2 { flex: 1; min-width: 0; }

.panel-head .count {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}

.panel-body { padding: 14px; }
.panel-foot { padding: 10px 14px; border-top: 1px solid var(--line-soft); background: var(--surface-2); }

.rows { list-style: none; margin: 0; padding: 0; }
.rows > li { border-bottom: 1px solid var(--line-soft); }
.rows > li:last-child { border-bottom: 0; }

.row {
  display: flex;
  gap: 11px;
  width: 100%;
  padding: 11px 14px;
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: background .1s ease;
}

.row:hover { background: var(--surface-2); }
.row-bar { width: 3px; flex-shrink: 0; border-radius: 99px; align-self: stretch; }
.row-body { flex: 1; min-width: 0; }
.row-title { font-weight: 500; margin: 3px 0 0; }
.row-text { color: var(--ink-2); margin: 2px 0 0; font-size: 13px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row-tags { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.row-meta { display: flex; flex-wrap: wrap; gap: 4px 11px; margin-top: 6px; font-size: 11.5px; color: var(--ink-3); }
.row-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 11px; }

.empty {
  padding: 26px 16px;
  text-align: center;
  color: var(--ink-3);
}

.empty strong { display: block; color: var(--ink-2); font-weight: 500; margin-bottom: 3px; }

/* --------------------------------- Chips --------------------------------- */

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 7px;
  border-radius: 5px;
  font-size: 11.5px;
  font-weight: 500;
  white-space: nowrap;
  line-height: 1.45;
}

.badge .glyph { font-size: 8.5px; line-height: 1; }

.badge[data-tone="critico"] { background: var(--critico-bg); color: var(--critico); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--critico) 22%, transparent); }
.badge[data-tone="atencion"] { background: var(--atencion-bg); color: var(--atencion); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--atencion) 22%, transparent); }
.badge[data-tone="pendiente"] { background: var(--pendiente-bg); color: var(--pendiente); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pendiente) 25%, transparent); }
.badge[data-tone="curso"] { background: var(--curso-bg); color: var(--curso); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--curso) 22%, transparent); }
.badge[data-tone="resuelto"] { background: var(--resuelto-bg); color: var(--resuelto); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--resuelto) 22%, transparent); }
.badge[data-tone="neutro"] { background: var(--neutro-bg); color: var(--neutro); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--neutro) 20%, transparent); }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 7px;
  border-radius: 5px;
  background: var(--petrol-soft);
  color: var(--petrol-mid);
  font-size: 11.5px;
  font-weight: 500;
  white-space: nowrap;
}

.ref {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}

/* -------------------------------- Botones -------------------------------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 7px 12px;
  border-radius: 7px;
  border: 1px solid transparent;
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: background .12s ease, border-color .12s ease;
}

.btn svg { width: 15px; height: 15px; }

.btn-primary { background: var(--petrol); color: #fff; }
.btn-primary:hover { background: var(--petrol-mid); }
:root[data-theme="dark"] .btn-primary,
:root:not([data-theme="light"]) .btn-primary { color: #071016; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .btn-primary { color: #fff; } }

.btn-gold { background: var(--gold-bright); color: #12262f; font-weight: 600; }
.btn-gold:hover { background: color-mix(in srgb, var(--gold-bright) 88%, #fff); }

.btn-quiet {
  background: var(--surface);
  color: var(--ink);
  border-color: var(--line);
}
.btn-quiet:hover { background: var(--surface-3); }

.btn-ghost { background: transparent; color: var(--petrol-mid); padding-inline: 7px; }
.btn-ghost:hover { background: var(--petrol-soft); }

.btn-sm { padding: 4px 9px; font-size: 12px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.link {
  background: none; border: 0; padding: 0;
  font: inherit; font-size: 12px; font-weight: 500;
  color: var(--petrol-mid);
  cursor: pointer;
  text-underline-offset: 2px;
}
.link:hover { text-decoration: underline; }

/* --------------------------------- Campos -------------------------------- */

.field { display: block; }
.field-label {
  display: block;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-2);
  margin-bottom: 4px;
}

input[type="text"], input[type="search"], select, textarea {
  width: 100%;
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface);
  color: var(--ink);
  font: inherit;
  font-size: 13.5px;
}

.search input { padding-left: 31px; }
textarea { min-height: 62px; resize: vertical; }
input::placeholder, textarea::placeholder { color: var(--ink-3); }
input:focus, select:focus, textarea:focus { border-color: var(--petrol-mid); }

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  align-items: end;
  padding: 12px 14px;
}

.filters .field { min-width: 132px; flex: 1 1 132px; }
.filters .field.wide { flex: 2 1 220px; }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }

.tab {
  padding: 5px 11px;
  border-radius: 7px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  font: inherit;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
}

.tab:hover { background: var(--surface-3); }
.tab[aria-pressed="true"] { background: var(--petrol); border-color: var(--petrol); color: #fff; }
:root[data-theme="dark"] .tab[aria-pressed="true"] { color: #071016; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tab[aria-pressed="true"] { color: #071016; } }

.tab .num { font-size: 11px; opacity: .75; margin-left: 3px; }

/* ------------------------------ Turno / ciclo ---------------------------- */

.shift-card { border-color: var(--petrol-line); }

.shift-top {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  justify-content: space-between;
  padding: 16px 16px 14px;
}

.shift-title { font-family: var(--serif); font-size: 21px; font-weight: 500; margin: 3px 0 0; letter-spacing: -.01em; }

          { level: 'IMPORTANTE', section: 'Garantías pendientes', title: 'Helen Whitaker · hab. 318 · garantía pendiente', detail: 'Reserva RES-10260 sin garantía válida registrada.' },
          { level: 'IMPORTANTE', section: 'Seguimientos próximos', title: 'Reintentar contacto con huésped de la 215', detail: 'VENCIDO desde ayer 23:30. Responsable: Camila Vera.' },
          { level: 'INFORMATIVO', section: 'Novedades activas', title: '#7 PMS con lentitud intermitente al generar facturas', detail: 'Ticket 48219 abierto con el proveedor. Emitir documentos con margen de tiempo.' }
        ]
      }
    ];

    const audit = [
      { at: at(0, 14, 40), action: 'TURNO_ENTREGAR', actor: 'u1', entity: 'Entrega de turno', summary: 'Entrega del turno mañana enviada (9 puntos)' },
      { at: at(0, 7, 5), action: 'TURNO_RECIBIR', actor: 'u1', entity: 'Entrega de turno', summary: 'Entrega del turno noche recibida y confirmada' },
      { at: at(0, 7), action: 'TURNO_INICIAR', actor: 'u1', entity: 'Turno', summary: 'Inicio de turno mañana' },
      { at: at(0, 4, 30), action: 'CREAR', actor: 'u3', entity: 'Registro', summary: 'Novedad #12: cierre de auditoría nocturna sin anomalías' },
      { at: at(-1, 23, 10), action: 'TURNO_RECIBIR', actor: 'u3', entity: 'Entrega de turno', summary: 'Entrega del turno tarde recibida y confirmada' }
    ];

    return {
      version: 4,
      currentUserId: 'u2',
      view: 'inicio',
      guests: guests, reservations: reservations, shifts: shifts, entries: entries,
      tasks: tasks, followups: followups, alerts: alerts, handovers: handovers,
      audit: audit, roles: JSON.parse(JSON.stringify(ROLES)),
      filters: { q: '', tipo: '', estado: '', clase: '', prioridad: '', area: '' },
      tabs: { tareas: 'abiertas', alertas: 'activas', seguimientos: 'pendientes', incidencias: 'abiertas' },
      seq: seq,
      notice: null
    };
  }

  // ------------------------------- Estado ---------------------------------
  const STORAGE_KEY = 'libro-operativo-preview-v4';
  let state;

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed || parsed.version !== 4) return null;
      seq = parsed.seq || 100;
      return parsed;
    } catch (_) { return null; }
  }

  function save() {
    try {
      state.seq = seq;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (_) { /* modo privado o almacenamiento bloqueado: la preview sigue funcionando */ }
  }

  const me = () => userById(state.currentUserId);
  const myRole = () => state.roles[me().role];
  const can = (permission) => myRole().permissions.indexOf(permission) >= 0;
  const operationalUsers = () => USERS.filter((u) => state.roles[u.role].operational);

  // --------------------------- Utilidades de vista -------------------------
  const esc = (value) => String(value == null ? '' : value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  const badge = (tone, text) => '<span class="badge" data-tone="' + tone + '"><span class="glyph" aria-hidden="true">' + TONE[tone] + '</span>' + esc(text) + '</span>';
  const chip = (text) => '<span class="chip">' + esc(text) + '</span>';

  let toastSeq = 0;
  function toast(message, kind) {
    const host = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = 'toast';
    el.dataset.kind = kind || 'info';
    el.textContent = message;
    el.id = 'toast-' + (++toastSeq);
    host.appendChild(el);
    while (host.children.length > 2) host.firstElementChild.remove();
    setTimeout(function () { el.remove(); }, kind === 'error' ? 5200 : 3400);
  }

  // ------------------------ Reglas de turno (dominio) ---------------------
  const shiftById = (id) => state.shifts.find((s) => s.id === id) || null;
  const handoverFrom = (shiftId) => state.handovers.find((h) => h.fromShiftId === shiftId) || null;

  function slot(type, direction) {
    const index = ORDER.indexOf(type);
    if (direction === 'next') return { type: ORDER[(index + 1) % 3], dayOffset: index === 2 ? 1 : 0 };
    return { type: ORDER[(index + 2) % 3], dayOffset: index === 0 ? -1 : 0 };
  }

  function neighbour(shift, direction) {
    const s = slot(shift.type, direction);
    const target = new Date(shift.date);
    target.setDate(target.getDate() + s.dayOffset);
    const key = target.toDateString();
    return state.shifts.find((x) => x.type === s.type && new Date(x.date).toDateString() === key) || null;
  }

  const myOpenShift = () => state.shifts.find((s) => s.staff.indexOf(state.currentUserId) >= 0 && ['INICIADO', 'ACTIVO', 'PREPARANDO_ENTREGA', 'ENTREGA_ENVIADA', 'RECIBIDO'].indexOf(s.status) >= 0) || null;
  const startableShifts = () => state.shifts.filter((s) => s.status === 'PROGRAMADO' && s.staff.indexOf(state.currentUserId) >= 0);

  function incomingHandover(shift) {
    const previous = neighbour(shift, 'previous');
    if (previous) {
      const h = state.handovers.find((x) => x.fromShiftId === previous.id && x.status === 'ENVIADA');
      if (h) return h;
    }
    return state.handovers.find((x) => x.toShiftId === shift.id && x.status === 'ENVIADA') || null;
  }

  function pushAudit(action, entity, summary) {
    state.audit.unshift({ at: new Date().toISOString(), action: action, entity: entity, actor: state.currentUserId, summary: summary });
    if (state.audit.length > 120) state.audit.pop();
  }

  // --------------------------- Motor de alertas ---------------------------
  function runAlertEngine() {
    const now = Date.now();
    const candidates = [];

    state.tasks.forEach(function (t) {
      if (t.deleted || TASK_OPEN.indexOf(t.status) < 0 || !t.dueAt) return;
      if (new Date(t.dueAt).getTime() >= now) return;
      candidates.push({ key: 'task-overdue:' + t.id, type: 'TAREA_VENCIDA', level: 'CRITICA', title: 'Tarea vencida: ' + t.title, message: 'Venció ' + relative(t.dueAt) + ' y sigue abierta.', taskId: t.id, dueAt: t.dueAt });
    });

    state.entries.forEach(function (e) {
      if (e.deleted || ENTRY_OPEN.indexOf(e.status) < 0) return;
      if (e.type === 'INCIDENCIA' && e.severity === 'CRITICA') {
        candidates.push({ key: 'incident-critical:' + e.id, type: 'INCIDENCIA_CRITICA', level: 'CRITICA', title: 'Incidencia crítica abierta: ' + e.title, message: 'Requiere atención inmediata y seguimiento hasta su cierre.', entryId: e.id });
      }
      if (e.type === 'MANTENIMIENTO' && new Date(e.occurredAt).getTime() < now - 24 * 3600000) {
        candidates.push({ key: 'maintenance-stale:' + e.id, type: 'MANTENIMIENTO_SIN_RESOLVER', level: 'ATENCION', title: 'Mantenimiento sin resolver: ' + e.title, message: 'Abierto desde ' + fmtDT(e.occurredAt) + ' sin resolución.', entryId: e.id });
      }
      if (e.type === 'HUESPED' && e.followUp) {
        candidates.push({ key: 'guest-request:' + e.id, type: 'SOLICITUD_HUESPED_PENDIENTE', level: 'ATENCION', title: 'Solicitud de huésped pendiente: ' + e.title, message: 'La solicitud sigue abierta y requiere seguimiento.', entryId: e.id, guestId: e.guestId });
      }
    });

    state.followups.forEach(function (f) {
      if (f.status !== 'PENDIENTE' && f.status !== 'VENCIDO') return;
      if (!f.scheduledAt || new Date(f.scheduledAt).getTime() >= now) return;
      f.status = 'VENCIDO';
      candidates.push({ key: 'followup-overdue:' + f.id, type: 'SEGUIMIENTO_VENCIDO', level: 'ATENCION', title: 'Seguimiento vencido: ' + f.action, message: 'Estaba programado para ' + fmtDT(f.scheduledAt) + '.', followUpId: f.id, entryId: f.entryId, dueAt: f.scheduledAt });
    });

    state.handovers.forEach(function (h) {
      if (h.status !== 'ENVIADA' || !h.issuedAt) return;
      if (new Date(h.issuedAt).getTime() >= now - 3600000) return;
      const from = shiftById(h.fromShiftId);
      candidates.push({ key: 'handover-pending:' + h.id, type: 'ENTREGA_TURNO_PENDIENTE', level: 'ATENCION', title: 'Entrega de turno sin confirmar', message: 'La entrega del turno ' + SHIFT_TYPE[from.type] + ' del ' + fmtDate(from.date) + ' sigue sin ser recibida.', handoverId: h.id });
    });

    const endOfToday = todayStart().getTime() + DAY - 1;
    state.reservations.forEach(function (r) {
      const guest = state.guests.find((g) => g.id === r.guestId);
      const who = guest ? guest.name : 'Reserva ' + r.code;
      const room = r.room ? ' (hab. ' + r.room + ')' : '';
      if (r.status === 'CANCELADA' || r.status === 'SALIDA') return;
      if (r.guarantee === 'PENDIENTE') candidates.push({ key: 'guarantee:' + r.id, type: 'GARANTIA_PENDIENTE', level: 'ATENCION', title: 'Garantía pendiente: ' + who + room, message: 'La reserva ' + r.code + ' no tiene garantía válida registrada.', reservationId: r.id, guestId: r.guestId });
      if (r.guarantee === 'RECHAZADA') candidates.push({ key: 'card:' + r.id, type: 'TARJETA_INVALIDA', level: 'CRITICA', title: 'Tarjeta rechazada: ' + who + room, message: 'La garantía de la reserva ' + r.code + ' fue rechazada. Solicitar medio de pago alternativo.', reservationId: r.id, guestId: r.guestId });
      if (r.balance > 0) candidates.push({ key: 'payment:' + r.id, type: 'PAGO_PENDIENTE', level: 'ATENCION', title: 'Cobro pendiente: ' + who + room, message: 'Saldo pendiente de ' + money(r.balance) + ' en la reserva ' + r.code + '.', reservationId: r.id, guestId: r.guestId });
      if (r.status === 'PENDIENTE' && r.checkIn && new Date(r.checkIn).getTime() <= endOfToday) candidates.push({ key: 'unconfirmed:' + r.id, type: 'RESERVA_SIN_CONFIRMAR', level: 'ATENCION', title: 'Reserva sin confirmar con llegada inminente: ' + who, message: 'La reserva ' + r.code + ' llega el ' + fmtDate(r.checkIn) + ' y sigue sin confirmar.', reservationId: r.id, guestId: r.guestId, dueAt: r.checkIn });
      if (guest && guest.vip && r.checkIn && new Date(r.checkIn).getTime() <= endOfToday && r.status !== 'EN_CASA') candidates.push({ key: 'vip:' + r.id, type: 'HUESPED_VIP', level: 'INFORMATIVA', title: 'Llegada VIP: ' + who + room, message: 'Coordinar atención preferente, amenidad y acompañamiento a la habitación.', reservationId: r.id, guestId: r.guestId, dueAt: r.checkIn });
      const coveredManually = state.alerts.some((a) => !a.auto && a.reservationId === r.id && a.status !== 'RESUELTA');
      if (r.action && r.guarantee !== 'RECHAZADA' && !coveredManually) candidates.push({ key: 'action:' + r.id, type: 'TRASLADO_PENDIENTE', level: 'ATENCION', title: 'Reserva requiere acción: ' + who + room, message: r.action, reservationId: r.id, guestId: r.guestId });
    });

    const keys = {};
    candidates.forEach(function (c) { keys[c.key] = true; });
    let created = 0, reopened = 0, resolved = 0;

    candidates.forEach(function (c) {
      const existing = state.alerts.find((a) => a.key === c.key);
      if (!existing) {
        state.alerts.push(Object.assign({ id: 'auto-' + (++seq), status: 'NUEVA', auto: true, createdAt: new Date().toISOString(), createdBy: null }, c));
        created++;
      } else if (existing.status === 'RESUELTA') {
        existing.status = 'NUEVA';
        existing.resolvedAt = null;
        existing.resolutionNote = null;
        existing.level = c.level;
        reopened++;
      }
    });

    state.alerts.forEach(function (a) {
      if (a.auto && a.status !== 'RESUELTA' && !keys[a.key]) {
        a.status = 'RESUELTA';
        a.resolvedAt = new Date().toISOString();
        a.resolutionNote = 'Resuelta automáticamente: la condición de origen ya no se cumple.';
        resolved++;
      }
    });

    return { created: created, reopened: reopened, resolved: resolved };
  }

  const alertIsLive = (a) => {
    if (a.status === 'RESUELTA') return false;
    if (a.status === 'POSPUESTA') return a.snoozedUntil ? new Date(a.snoozedUntil).getTime() <= Date.now() : true;
    return true;
  };
  const liveAlerts = () => state.alerts.filter(alertIsLive);

  // ------------------- Resumen automático de la entrega -------------------
  function buildSnapshot() {
    const items = [];
    const levelFromPriority = { CRITICA: 'URGENTE', ALTA: 'IMPORTANTE', MEDIA: 'INFORMATIVO', BAJA: 'INFORMATIVO' };
    const levelFromSeverity = { CRITICA: 'URGENTE', ALTA: 'URGENTE', MEDIA: 'IMPORTANTE', BAJA: 'INFORMATIVO' };

    const openEntries = state.entries.filter((e) => !e.deleted && ENTRY_OPEN.indexOf(e.status) >= 0);
    const openTasks = state.tasks.filter((t) => !t.deleted && TASK_OPEN.indexOf(t.status) >= 0);
    const openFollowups = state.followups.filter((f) => f.status === 'PENDIENTE' || f.status === 'VENCIDO');

    openEntries.forEach(function (e) {
      const guest = state.guests.find((g) => g.id === e.guestId);
      const detail = [e.description.slice(0, 190), e.department ? 'Área: ' + e.department : null,
        e.ownerId ? 'Responsable: ' + userName(e.ownerId) : 'Sin responsable asignado',
        e.dueAt ? 'Vence: ' + fmtDT(e.dueAt) : null,
        guest ? guest.name + (guest.room ? ' · hab. ' + guest.room : '') : null].filter(Boolean).join(' · ');
      const section = e.type === 'INCIDENCIA' ? 'Incidencias abiertas'
        : e.type === 'MANTENIMIENTO' ? 'Mantenimiento'
        : e.type === 'HUESPED' ? 'Solicitudes de huéspedes' : 'Novedades activas';
      items.push({ level: e.severity ? levelFromSeverity[e.severity] : levelFromPriority[e.priority], section: section, title: '#' + e.seq + ' ' + e.title, detail: detail, refType: 'entry', refId: e.id });
    });

    openTasks.forEach(function (t) {
      const overdue = isOverdue(t.dueAt, true);
      items.push({
        level: overdue ? 'URGENTE' : levelFromPriority[t.priority],
        section: 'Tareas pendientes',
        title: '#' + t.seq + ' ' + t.title,
        detail: ['Prioridad ' + PRIORITY[t.priority], t.assigneeId ? 'Asignada a ' + userName(t.assigneeId) : 'Sin asignar',
          t.dueAt ? (overdue ? 'VENCIDA' : 'Vence') + ': ' + fmtDT(t.dueAt) : 'Sin fecha límite'].join(' · '),
        refType: 'task', refId: t.id
      });
    });

    openFollowups.forEach(function (f) {
      const overdue = f.status === 'VENCIDO';
      items.push({
        level: overdue ? 'URGENTE' : 'IMPORTANTE',
        section: 'Seguimientos próximos',
        title: f.action,
        detail: [f.nextAction ? 'Próxima acción: ' + f.nextAction : null, 'Responsable: ' + userName(f.ownerId),
          f.scheduledAt ? (overdue ? 'VENCIDO' : 'Programado') + ': ' + fmtDT(f.scheduledAt) : 'Sin fecha'].filter(Boolean).join(' · '),
        refType: 'followup', refId: f.id
      });
    });

    state.reservations.forEach(function (r) {
      const guest = state.guests.find((g) => g.id === r.guestId);
      const who = guest ? guest.name : 'Reserva ' + r.code;
      const room = r.room ? ' · hab. ' + r.room : '';
      const stay = 'Llegada ' + fmtDT(r.checkIn) + ' · Salida ' + fmtDT(r.checkOut);
      if (r.balance > 0) items.push({ level: 'URGENTE', section: 'Cobros pendientes', title: who + room + ' · saldo ' + money(r.balance), detail: 'Reserva ' + r.code + '. ' + stay, refType: 'reservation', refId: r.id });
      if (r.guarantee === 'PENDIENTE' || r.guarantee === 'RECHAZADA') items.push({ level: r.guarantee === 'RECHAZADA' ? 'URGENTE' : 'IMPORTANTE', section: 'Garantías pendientes', title: who + room + ' · garantía ' + (r.guarantee === 'RECHAZADA' ? 'rechazada' : 'pendiente'), detail: 'Reserva ' + r.code + '. ' + stay, refType: 'reservation', refId: r.id });
      if (r.action || r.status === 'PENDIENTE') items.push({ level: r.action ? 'IMPORTANTE' : 'INFORMATIVO', section: 'Reservas que requieren acción', title: who + room + (guest && guest.vip ? ' · VIP' : ''), detail: [r.action, 'Reserva ' + r.code + ' en estado ' + r.status, stay].filter(Boolean).join(' · '), refType: 'reservation', refId: r.id });
    });

    // Cada asunto se menciona una sola vez: se omiten las alertas automáticas
    // que sólo reflejan un objeto ya listado en otra sección.
    const listed = {
      entry: openEntries.map((e) => e.id),
      task: openTasks.map((t) => t.id),
      followUp: openFollowups.map((f) => f.id),
      reservation: state.reservations.map((r) => r.id)
    };
    liveAlerts().forEach(function (a) {
      const duplicate = a.auto && (
        (a.entryId && listed.entry.indexOf(a.entryId) >= 0) ||
        (a.taskId && listed.task.indexOf(a.taskId) >= 0) ||
        (a.followUpId && listed.followUp.indexOf(a.followUpId) >= 0) ||
        (a.reservationId && listed.reservation.indexOf(a.reservationId) >= 0));
      if (duplicate) return;
      items.push({
        level: a.level === 'CRITICA' ? 'URGENTE' : a.level === 'ATENCION' ? 'IMPORTANTE' : 'INFORMATIVO',
        section: 'Alertas activas',
        title: ALERT_TYPE[a.type] + ': ' + a.title,
        detail: a.message || null,
        refType: 'alert', refId: a.id
      });
    });

    return items;
  }

  // ------------------------------- Acciones -------------------------------
  const ACTIONS = {
    nav: function (view) { state.view = view; state.openHandover = null; commit(); window.scrollTo({ top: 0 }); },

    'start-shift': function (shiftId) {
      const shift = shiftById(shiftId);
      if (!myRole().operational) return fail('El Administrador de sistema no participa en la operación de turnos. Cambia a una cuenta operativa.');
      if (!can('shift.start')) return fail('Tu rol no tiene el permiso shift.start.');
      if (shift.staff.indexOf(state.currentUserId) < 0) return fail('No estás asignado a este turno.');
      const open = myOpenShift();
      if (open && OCCUPYING.indexOf(open.status) >= 0) return fail('Ya tienes el turno ' + SHIFT_TYPE[open.type] + ' del ' + fmtDate(open.date) + ' en estado ' + SHIFT_LABEL[open.status] + '. Ciérralo o entrégalo antes de iniciar otro.');
      if (SHIFT_TRANSITIONS[shift.status].indexOf('INICIADO') < 0) return fail('Transición no permitida: ' + SHIFT_LABEL[shift.status] + ' → Iniciado.');

      shift.status = 'INICIADO';
      shift.startedAt = new Date().toISOString();
      pushAudit('TURNO_INICIAR', 'Turno', 'Inicio de turno ' + SHIFT_TYPE[shift.type] + ' del ' + fmtDate(shift.date));
      state.view = 'turno';
      commit('Turno iniciado. Revisa y confirma la entrega anterior.');
    },

    receive: function (shiftId) {
      const shift = shiftById(shiftId);
      if (!can('shift.receive')) return fail('Tu rol no tiene el permiso shift.receive.');
      if (SHIFT_TRANSITIONS[shift.status].indexOf('ACTIVO') < 0) return fail('Transición no permitida: ' + SHIFT_LABEL[shift.status] + ' → Turno activo.');

      const incoming = incomingHandover(shift);
      const observations = (document.getElementById('receive-obs') || {}).value || '';

      if (incoming) {
        if (incoming.status === 'RECIBIDA') return fail('Esa entrega ya fue recibida y confirmada.');
        incoming.status = 'RECIBIDA';
        incoming.receivedBy = state.currentUserId;
        incoming.receivedAt = new Date().toISOString();
        incoming.receiverObservations = observations.trim() || null;
        incoming.toShiftId = incoming.toShiftId || shift.id;

        const from = shiftById(incoming.fromShiftId);
        if (from && from.status === 'ENTREGA_ENVIADA') {
          from.status = 'CERRADO';
          from.endedAt = new Date().toISOString();
          pushAudit('TURNO_CERRAR', 'Turno', 'Turno ' + SHIFT_TYPE[from.type] + ' cerrado automáticamente tras la confirmación de recepción');
        }
        state.alerts.forEach(function (a) {
          if (a.handoverId === incoming.id && a.auto && a.status !== 'RESUELTA') {
            a.status = 'RESUELTA';
            a.resolvedAt = new Date().toISOString();
            a.resolutionNote = 'Entrega recibida.';
          }
        });
      }

      shift.status = 'ACTIVO';
      pushAudit('TURNO_RECIBIR', 'Turno', incoming ? 'Recepción de turno confirmada' + (observations ? ' — ' + observations : '') : 'Turno activado sin entrega previa pendiente');
      commit(incoming ? 'Recepción confirmada. Tu turno está activo.' : 'Turno activado. Quedó constancia de que no había entrega previa.');
    },

    prepare: function (shiftId) {
      const shift = shiftById(shiftId);
      if (!can('shift.handover')) return fail('Tu rol no tiene el permiso shift.handover.');
      if (shift.staff.indexOf(state.currentUserId) < 0) return fail('Sólo quien está en el turno puede preparar su entrega.');
      let handover = handoverFrom(shift.id);
      if (handover && handover.status !== 'BORRADOR') return fail('Este turno ya envió su entrega.');
      if (shift.status !== 'PREPARANDO_ENTREGA' && SHIFT_TRANSITIONS[shift.status].indexOf('PREPARANDO_ENTREGA') < 0) {
        return fail('Transición no permitida: ' + SHIFT_LABEL[shift.status] + ' → Preparando entrega.');
      }

      const next = neighbour(shift, 'next');
      const generated = buildSnapshot();

      if (!handover) {
        handover = { id: 'h' + (++seq), fromShiftId: shift.id, toShiftId: next ? next.id : null, status: 'BORRADOR', issuedBy: state.currentUserId, issuedAt: null, receivedBy: null, receivedAt: null, notes: '', receiverObservations: null, items: [] };
        state.handovers.push(handover);
      }
      // El resumen automático se regenera; las notas manuales se conservan.
      const manual = handover.items.filter((i) => i.manual);
      handover.items = generated.concat(manual);
      handover.toShiftId = next ? next.id : null;
      shift.status = 'PREPARANDO_ENTREGA';

      pushAudit('CAMBIO_ESTADO', 'Turno', 'Turno en preparación de entrega (' + generated.length + ' puntos generados)');
      state.view = 'entrega';
      state.openHandover = handover.id;
      commit('Resumen de entrega generado: ' + generated.length + ' puntos. Revísalo, agrega notas y envíalo.');
    },

    'regenerate': function (handoverId) {
      const handover = state.handovers.find((h) => h.id === handoverId);
      if (!handover || handover.status !== 'BORRADOR') return fail('La entrega ya fue enviada.');
      const manual = handover.items.filter((i) => i.manual);
      const generated = buildSnapshot();
      handover.items = generated.concat(manual);
      commit('Resumen actualizado con el estado actual (' + generated.length + ' puntos). Tus notas manuales se conservaron.');
    },

    send: function (shiftId) {
      const shift = shiftById(shiftId);
      if (!can('shift.handover')) return fail('Tu rol no tiene el permiso shift.handover.');
      const handover = handoverFrom(shift.id);
      if (!handover) return fail('Primero debes preparar la entrega.');
      if (handover.status !== 'BORRADOR') return fail('Esta entrega ya fue enviada.');
      if (SHIFT_TRANSITIONS[shift.status].indexOf('ENTREGA_ENVIADA') < 0) return fail('Transición no permitida: ' + SHIFT_LABEL[shift.status] + ' → Entrega enviada.');

      const notes = (document.getElementById('handover-notes') || {}).value || '';
      handover.notes = notes.trim();
      handover.status = 'ENVIADA';
      handover.issuedAt = new Date().toISOString();
      handover.issuedBy = state.currentUserId;
      handover.snapshotAt = handover.issuedAt;
      shift.status = 'ENTREGA_ENVIADA';

      pushAudit('TURNO_ENTREGAR', 'Entrega de turno', 'Entrega enviada por ' + me().name + ' (' + handover.items.length + ' puntos)');
      commit('Entrega enviada. El turno siguiente debe confirmarla.');
    },

    'cancel-prep': function (shiftId) {
      const shift = shiftById(shiftId);
      const handover = handoverFrom(shift.id);
      if (handover && handover.status !== 'BORRADOR') return fail('La entrega ya fue enviada: no puede cancelarse.');
      if (handover) state.handovers = state.handovers.filter((h) => h.id !== handover.id);
      shift.status = 'ACTIVO';
      pushAudit('CAMBIO_ESTADO', 'Turno', 'Preparación de entrega cancelada');
      state.view = 'turno';
      commit('Preparación cancelada. Tu turno sigue activo.');
    },

    'close-shift': function (shiftId) {
      const shift = shiftById(shiftId);
      if (!can('shift.close')) return fail('Tu rol no tiene el permiso shift.close.');
      const next = neighbour(shift, 'next');
      const handover = handoverFrom(shift.id);
      const hasNext = Boolean(next) && next.status !== 'CERRADO' && next.status !== 'ANULADO';

      if (hasNext) {
        if (!handover || handover.status === 'BORRADOR') return fail('No puedes cerrar el turno sin enviar la entrega al turno siguiente.');
        if (handover.status === 'ENVIADA') return fail('La entrega fue enviada pero el turno siguiente aún no la confirma. El turno se cierra una vez recibida.');
      } else if (shift.status !== 'ACTIVO' && shift.status !== 'RECIBIDO') {
        return fail('No puedes cerrar un turno en estado ' + SHIFT_LABEL[shift.status] + '.');
      }

      shift.status = 'CERRADO';
      shift.endedAt = new Date().toISOString();
      pushAudit('TURNO_CERRAR', 'Turno', 'Turno ' + SHIFT_TYPE[shift.type] + ' del ' + fmtDate(shift.date) + ' cerrado por ' + me().name);
      commit('Turno cerrado.');
    },

    'open-handover': function (id) { state.view = 'entrega'; state.openHandover = id; commit(); window.scrollTo({ top: 0 }); },

    'remove-note': function (args) {
      const parts = args.split('|');
      const handover = state.handovers.find((h) => h.id === parts[0]);
      if (!handover || handover.status !== 'BORRADOR') return fail('La entrega ya fue enviada.');
      handover.items.splice(Number(parts[1]), 1);
      commit('Nota eliminada de la entrega.');
    },

    'task-status': function (args) {
      const parts = args.split('|');
      const task = state.tasks.find((t) => t.id === parts[0]);
      const next = parts[1];
      if (!task) return;
      const allowed = {
        PENDIENTE: ['EN_CURSO', 'BLOQUEADA', 'COMPLETADA', 'CANCELADA'],
        EN_CURSO: ['BLOQUEADA', 'COMPLETADA', 'CANCELADA', 'PENDIENTE'],
        BLOQUEADA: ['EN_CURSO', 'PENDIENTE', 'COMPLETADA', 'CANCELADA'],
        COMPLETADA: ['EN_CURSO'], CANCELADA: ['PENDIENTE']
      };
      if (allowed[task.status].indexOf(next) < 0) return fail('No puedes pasar una tarea de ' + TASK_STATUS[task.status] + ' a ' + TASK_STATUS[next] + '.');
      if ((next === 'COMPLETADA' || next === 'CANCELADA') && !can('task.close')) return fail('Tu rol no tiene el permiso task.close.');

      task.status = next;
      task.completedAt = next === 'COMPLETADA' ? new Date().toISOString() : null;
      if (next !== 'BLOQUEADA') task.blockedReason = null;
      task.history.push({ at: new Date().toISOString(), action: next === 'COMPLETADA' ? 'CERRAR' : 'CAMBIO_ESTADO', actor: state.currentUserId, summary: 'Estado: ' + TASK_STATUS[next] });
      pushAudit(next === 'COMPLETADA' ? 'CERRAR' : 'CAMBIO_ESTADO', 'Tarea', 'Tarea #' + task.seq + ' → ' + TASK_STATUS[next]);
      commit('Tarea #' + task.seq + ': ' + TASK_STATUS[next].toLowerCase() + '.');
    },

    'toggle-check': function (args) {
      const parts = args.split('|');
      const task = state.tasks.find((t) => t.id === parts[0]);
      const item = task && task.checklist.find((c) => c.id === parts[1]);
      if (!item) return;
      item.done = !item.done;
      commit();
    },

    'alert-ack': function (id) {
      const alert = state.alerts.find((a) => a.id === id);
      if (!can('alert.manage')) return fail('Tu rol no tiene el permiso alert.manage.');
      if (alert.status === 'RESUELTA') return fail('La alerta ya está resuelta.');
      alert.status = 'VISTA';
      alert.acknowledgedBy = state.currentUserId;
      alert.snoozedUntil = null;
      commit('Alerta marcada como vista.');
    },

    'alert-snooze': function (args) {
      const parts = args.split('|');
      const alert = state.alerts.find((a) => a.id === parts[0]);
      if (!can('alert.manage')) return fail('Tu rol no tiene el permiso alert.manage.');
      if (alert.status === 'RESUELTA') return fail('La alerta ya está resuelta.');
      const minutes = Number(parts[1] || 60);
      alert.status = 'POSPUESTA';
      alert.snoozedUntil = new Date(Date.now() + minutes * 60000).toISOString();
      commit('Alerta pospuesta ' + (minutes >= 60 ? (minutes / 60) + ' h' : minutes + ' min') + '.');
    },

    'alert-resolve': function (id) {
      const alert = state.alerts.find((a) => a.id === id);
      if (!can('alert.manage')) return fail('Tu rol no tiene el permiso alert.manage.');
      alert.status = 'RESUELTA';
      alert.resolvedBy = state.currentUserId;
      alert.resolvedAt = new Date().toISOString();
      alert.resolutionNote = 'Resuelta por ' + me().name + '.';
      pushAudit('CERRAR', 'Alerta', 'Alerta resuelta: ' + alert.title);
      commit(alert.auto ? 'Alerta resuelta. Si la condición de origen persiste, el motor la reabrirá.' : 'Alerta resuelta.');
    },

    'run-engine': function () {
      const result = runAlertEngine();
      commit('Motor de alertas: ' + result.created + ' nueva(s), ' + result.reopened + ' reabierta(s), ' + result.resolved + ' resuelta(s).');
    },

    tab: function (args) {
      const parts = args.split('|');
      state.tabs[parts[0]] = parts[1];
      commit();
    },

    'toggle-permission': function (args) {
      const parts = args.split('|');
      if (!can('role.manage')) return fail('Tu rol no tiene el permiso role.manage.');
      const role = state.roles[parts[0]];
      const permission = parts[1];
      const index = role.permissions.indexOf(permission);
      if (index >= 0) {
        if (parts[0] === 'ADMIN' && ['user.manage', 'role.manage', 'system.configure'].indexOf(permission) >= 0) {
          return fail('El Administrador de sistema no puede perder ' + permission + ': es necesario para recuperar el sistema.');
        }
        role.permissions.splice(index, 1);
      } else {
        role.permissions.push(permission);
      }
      pushAudit('PERMISOS', 'Rol', 'Permisos de ' + role.name + ' actualizados (' + role.permissions.length + ')');
      commit('Permisos de ' + role.name + ' actualizados.');
    },

    reset: function () {
      state = buildSeed();
      runAlertEngine();
      commit('Preview reiniciada con los datos de demostración.');
    },

    'open-entry': function (id) { openEntrySheet(id); },
    'open-task': function (id) { openTaskSheet(id); },
    'new-entry': function () { openEntryForm('NOVEDAD'); },
    'new-incident': function () { openEntryForm('INCIDENCIA'); },
    'new-task': function (entryId) { openTaskForm(entryId || null); },
    'new-followup': function (entryId) { openFollowUpForm(entryId || null); },
    'close-modal': function () { closeSheet(); },
    'print': function () { window.print(); }
  };

  function fail(message) { toast(message, 'error'); }

  function commit(message) {
    save();
    render();
    if (message) toast(message, 'ok');
  }

  // ------------------------- Formularios en hoja --------------------------
  function closeSheet() { document.getElementById('modal-host').innerHTML = ''; }

  function openSheet(title, bodyHtml) {
    const host = document.getElementById('modal-host');
    host.innerHTML = '<div class="scrim" data-scrim="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
      '<div class="sheet-head"><h2>' + esc(title) + '</h2>' +
      '<button class="sheet-close" type="button" data-act="close-modal" aria-label="Cerrar">' + icon('close') + '</button></div>' +
      '<div class="sheet-body">' + bodyHtml + '</div></div></div>';
    const focusable = host.querySelector('input, textarea, select, button.btn');
    if (focusable) focusable.focus();
  }

  function selectOptions(values, labels, selected) {
    return values.map(function (v) {
      return '<option value="' + esc(v) + '"' + (v === selected ? ' selected' : '') + '>' + esc(labels ? labels[v] : v) + '</option>';
    }).join('');
  }

  function peopleOptions(selected) {
    return '<option value="">Sin asignar</option>' + operationalUsers().map(function (u) {
      return '<option value="' + u.id + '"' + (u.id === selected ? ' selected' : '') + '>' + esc(u.name + ' · ' + state.roles[u.role].name) + '</option>';
    }).join('');
  }

  function openEntryForm(type) {
    const isIncident = type === 'INCIDENCIA';
    if (!can(isIncident ? 'incident.create' : 'entry.create')) return fail('Tu rol no tiene el permiso ' + (isIncident ? 'incident.create' : 'entry.create') + '.');

      '<div class="form-grid">' +
      '<div class="form-grid two">' +
      '<label class="field"><span class="field-label">Tipo</span><select id="f-type">' + selectOptions(Object.keys(ENTRY_TYPE), ENTRY_TYPE, type) + '</select></label>' +
      '<label class="field"><span class="field-label">Prioridad</span><select id="f-priority">' + selectOptions(['BAJA', 'MEDIA', 'ALTA', 'CRITICA'], PRIORITY, isIncident ? 'ALTA' : 'MEDIA') + '</select></label>' +
      '</div>' +
      '<label class="field"><span class="field-label">Título</span><input type="text" id="f-title" maxlength="200" placeholder="Qué pasó, en una línea"></label>' +
      '<label class="field"><span class="field-label">Descripción</span><textarea id="f-description" placeholder="Detalle de lo ocurrido, qué se hizo y qué queda pendiente."></textarea></label>' +
      '<div class="form-grid two">' +
      '<label class="field"><span class="field-label">Área</span><select id="f-department"><option value="">Sin área</option>' + selectOptions(DEPARTMENTS, null, 'Recepción') + '</select></label>' +
      '<label class="field"><span class="field-label">Responsable</span><select id="f-owner">' + peopleOptions(state.currentUserId) + '</select></label>' +
      '</div>' +
      '<div class="form-grid two">' +
      '<label class="field"><span class="field-label">Huésped relacionado</span><select id="f-guest"><option value="">Ninguno</option>' +
        state.guests.map((g) => '<option value="' + g.id + '">' + esc(g.name + (g.room ? ' · hab. ' + g.room : '')) + '</option>').join('') + '</select></label>' +
      '<label class="field"><span class="field-label">Gravedad (sólo incidencias)</span><select id="f-severity">' + selectOptions(['BAJA', 'MEDIA', 'ALTA', 'CRITICA'], PRIORITY, 'ALTA') + '</select></label>' +
      '</div>' +
      '<label class="field"><span class="field-label">Etiquetas</span><input type="text" id="f-tags" placeholder="climatizacion, vip"></label>' +
      '<label style="display:flex;gap:8px;align-items:center;font-size:13.5px"><input type="checkbox" id="f-followup" style="width:auto"> Requiere seguimiento</label>' +
      '<div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn btn-quiet" type="button" data-act="close-modal">Cancelar</button>' +
      '<button class="btn btn-gold" type="button" data-act="submit-entry">Guardar registro</button></div>' +
      '</div>');
  }

  ACTIONS['submit-entry'] = function () {
    const val = (id) => (document.getElementById(id) || {}).value || '';
    const type = val('f-type');
    const title = val('f-title').trim();
    const description = val('f-description').trim();
    if (title.length < 3) return fail('El título debe tener al menos 3 caracteres.');
    if (description.length < 5) return fail('La descripción debe tener al menos 5 caracteres.');

    const shift = myOpenShift();
    const entry = {
      id: 'e' + (++seq), seq: seq, type: type, title: title, description: description,
      department: val('f-department') || null, priority: val('f-priority'), status: 'ABIERTO',
      createdBy: state.currentUserId, ownerId: val('f-owner') || null,
      shiftId: shift ? shift.id : null, occurredAt: new Date().toISOString(), dueAt: null,
      tags: val('f-tags').split(',').map((t) => t.trim().toLowerCase()).filter(Boolean),
      followUp: (document.getElementById('f-followup') || {}).checked || false,
      severity: type === 'INCIDENCIA' ? val('f-severity') : null,
      impact: type === 'INCIDENCIA' ? 'OPERACION' : null,
      guestId: val('f-guest') || null, reservationId: null,
      comments: [], history: [], deleted: false
    };
    entry.history.push({ at: entry.occurredAt, action: 'CREAR', actor: state.currentUserId, summary: ENTRY_TYPE[type] + ' #' + entry.seq + ' registrada' });
    state.entries.unshift(entry);
    pushAudit('CREAR', 'Registro', ENTRY_TYPE[type] + ' #' + entry.seq + ': ' + title);
    runAlertEngine();
    closeSheet();
    commit('Registro #' + entry.seq + ' creado' + (shift ? ' en tu turno.' : '.'));
  };

  function openTaskForm(entryId) {
    if (!can('task.create')) return fail('Tu rol no tiene el permiso task.create.');
    const entry = entryId ? state.entries.find((e) => e.id === entryId) : null;
    openSheet('Nueva tarea',
      '<div class="form-grid">' +
      (entry ? '<p class="meta">Vinculada al registro <strong>#' + entry.seq + ' ' + esc(entry.title) + '</strong>. El origen queda registrado automáticamente.</p>' : '') +
      '<input type="hidden" id="f-entry" value="' + esc(entryId || '') + '">' +
      '<label class="field"><span class="field-label">Qué hay que hacer</span><input type="text" id="f-title" maxlength="200" placeholder="Ej: Confirmar traslado al aeropuerto"></label>' +
      '<label class="field"><span class="field-label">Detalle</span><textarea id="f-description" placeholder="Instrucciones o contexto necesario."></textarea></label>' +
      '<div class="form-grid two">' +
      '<label class="field"><span class="field-label">Asignada a</span><select id="f-assignee">' + peopleOptions(state.currentUserId) + '</select></label>' +
      '<label class="field"><span class="field-label">Prioridad</span><select id="f-priority">' + selectOptions(['BAJA', 'MEDIA', 'ALTA', 'CRITICA'], PRIORITY, 'MEDIA') + '</select></label>' +
      '</div>' +
      '<div class="form-grid two">' +
      '<label class="field"><span class="field-label">Vence en</span><select id="f-due">' +
        '<option value="2">En 2 horas</option><option value="6" selected>Hoy (6 horas)</option><option value="24">Mañana</option><option value="">Sin fecha límite</option>' +
      '</select></label>' +
      '<label class="field"><span class="field-label">Área</span><select id="f-department"><option value="">Sin área</option>' + selectOptions(DEPARTMENTS, null, entry ? entry.department : 'Recepción') + '</select></label>' +
      '</div>' +
      '<label class="field"><span class="field-label">Checklist (un paso por línea)</span><textarea id="f-checklist" placeholder="Llamar a la empresa&#10;Registrar patente&#10;Informar al huésped"></textarea></label>' +
      '<div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn btn-quiet" type="button" data-act="close-modal">Cancelar</button>' +
      '<button class="btn btn-gold" type="button" data-act="submit-task">Crear tarea</button></div>' +
      '</div>');
  }

  ACTIONS['submit-task'] = function () {
    const val = (id) => (document.getElementById(id) || {}).value || '';
    const title = val('f-title').trim();
    if (title.length < 3) return fail('El título debe tener al menos 3 caracteres.');
    const assignee = val('f-assignee');
    if (assignee && assignee !== state.currentUserId && !can('task.assign')) return fail('Tu rol no tiene el permiso task.assign.');

    const entryId = val('f-entry') || null;
    const entry = entryId ? state.entries.find((e) => e.id === entryId) : null;
    const hours = val('f-due');
    const shift = myOpenShift();

    const task = {
      id: 't' + (++seq), seq: seq, title: title, description: val('f-description').trim() || null,
      assigneeId: assignee || null, priority: val('f-priority'), status: 'PENDIENTE',
      dueAt: hours ? new Date(Date.now() + Number(hours) * 3600000).toISOString() : null,
      department: val('f-department') || null, entryId: entryId,
      origin: entry ? (entry.type === 'INCIDENCIA' ? 'INCIDENCIA' : 'REGISTRO') : 'MANUAL',
      createdBy: state.currentUserId, createdAt: new Date().toISOString(),
      shiftId: shift ? shift.id : null,
      checklist: val('f-checklist').split('\n').map((t) => t.trim()).filter(Boolean).map(function (text, i) { return { id: 'k' + seq + '-' + i, text: text, done: false }; }),
      comments: [], history: [], deleted: false, blockedReason: null
    };
    task.history.push({ at: task.createdAt, action: 'CREAR', actor: state.currentUserId, summary: 'Tarea #' + task.seq + ' creada y asignada a ' + (assignee ? userName(assignee) : 'nadie') });
    state.tasks.unshift(task);
    pushAudit('CREAR', 'Tarea', 'Tarea #' + task.seq + ': ' + title);
    runAlertEngine();
    closeSheet();
    commit('Tarea #' + task.seq + ' creada.');
  };

  function openFollowUpForm(entryId) {
    if (!can('followup.create')) return fail('Tu rol no tiene el permiso followup.create.');
    const open = state.entries.filter((e) => !e.deleted && ENTRY_OPEN.indexOf(e.status) >= 0);
    openSheet('Nuevo seguimiento',
      '<div class="form-grid">' +
      '<label class="field"><span class="field-label">Registro asociado</span><select id="f-entry">' +
        open.map((e) => '<option value="' + e.id + '"' + (e.id === entryId ? ' selected' : '') + '>' + esc('#' + e.seq + ' · ' + e.title) + '</option>').join('') + '</select></label>' +
      '<label class="field"><span class="field-label">Acción realizada</span><input type="text" id="f-action" maxlength="300" placeholder="Ej: Se contactó al huésped para regularizar el pago"></label>' +
      '<label class="field"><span class="field-label">Resultado</span><textarea id="f-result" placeholder="Qué respondió o qué se logró."></textarea></label>' +
      '<label class="field"><span class="field-label">Próxima acción</span><input type="text" id="f-next" maxlength="300" placeholder="Ej: Reintentar contacto y escalar a Administración"></label>' +
      '<div class="form-grid two">' +
      '<label class="field"><span class="field-label">Programado en</span><select id="f-when">' +
        '<option value="2">En 2 horas</option><option value="8" selected>Al final del turno</option><option value="24">Mañana</option>' +
      '</select></label>' +
      '<label class="field"><span class="field-label">Responsable</span><select id="f-owner">' + peopleOptions(state.currentUserId) + '</select></label>' +
      '</div>' +
      '<p class="meta">Si llega la fecha programada y el seguimiento sigue abierto, el motor de alertas lo marca como vencido y avisa.</p>' +
      '<div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn btn-quiet" type="button" data-act="close-modal">Cancelar</button>' +
      '<button class="btn btn-gold" type="button" data-act="submit-followup">Registrar seguimiento</button></div>' +
      '</div>');
  }

  ACTIONS['submit-followup'] = function () {
    const val = (id) => (document.getElementById(id) || {}).value || '';
    const action = val('f-action').trim();
    if (action.length < 3) return fail('Describe la acción realizada (mínimo 3 caracteres).');
    const entryId = val('f-entry');
    if (!entryId) return fail('El seguimiento debe asociarse a un registro.');

    const followUp = {
      id: 'f' + (++seq), entryId: entryId, action: action,
      result: val('f-result').trim() || null, nextAction: val('f-next').trim() || null,
      scheduledAt: new Date(Date.now() + Number(val('f-when')) * 3600000).toISOString(),
      ownerId: val('f-owner') || state.currentUserId, createdBy: state.currentUserId,
      status: 'PENDIENTE', createdAt: new Date().toISOString(), comments: []
    };
    state.followups.unshift(followUp);
    const entry = state.entries.find((e) => e.id === entryId);
    if (entry) entry.followUp = true;
    pushAudit('SEGUIMIENTO', 'Seguimiento', 'Seguimiento creado: ' + action);
    closeSheet();
    commit('Seguimiento registrado.');
  };

  ACTIONS['close-followup'] = function (id) {
    const followUp = state.followups.find((f) => f.id === id);
    openSheet('Cerrar seguimiento',
      '<div class="form-grid">' +
      '<p class="meta">' + esc(followUp.action) + '</p>' +
      '<input type="hidden" id="f-id" value="' + esc(id) + '">' +
      '<label class="field"><span class="field-label">Resultado (obligatorio)</span><textarea id="f-result" placeholder="Qué se logró finalmente."></textarea></label>' +
      '<div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn btn-quiet" type="button" data-act="close-modal">Cancelar</button>' +
      '<button class="btn btn-gold" type="button" data-act="submit-close-followup">Cerrar seguimiento</button></div>' +
      '</div>');
  };

  ACTIONS['submit-close-followup'] = function () {
    const id = (document.getElementById('f-id') || {}).value;
    const result = ((document.getElementById('f-result') || {}).value || '').trim();
    if (!result) return fail('Para cerrar un seguimiento debes registrar el resultado.');
    const followUp = state.followups.find((f) => f.id === id);
    followUp.status = 'CUMPLIDO';
    followUp.result = result;
    followUp.completedAt = new Date().toISOString();
    state.alerts.forEach(function (a) {
      if (a.followUpId === id && a.auto && a.status !== 'RESUELTA') { a.status = 'RESUELTA'; a.resolvedAt = new Date().toISOString(); a.resolutionNote = 'Seguimiento cerrado.'; }
    });
    pushAudit('CERRAR', 'Seguimiento', 'Seguimiento cerrado: ' + followUp.action);
    closeSheet();
    commit('Seguimiento cerrado.');
  };

  ACTIONS['add-note'] = function (handoverId) {
    const handover = state.handovers.find((h) => h.id === handoverId);
    if (!handover || handover.status !== 'BORRADOR') return fail('La entrega ya fue enviada: no admite nuevas notas.');
    const title = ((document.getElementById('note-title') || {}).value || '').trim();
    const detail = ((document.getElementById('note-detail') || {}).value || '').trim();
    const level = (document.getElementById('note-level') || {}).value || 'IMPORTANTE';
    if (title.length < 3) return fail('Escribe la nota (mínimo 3 caracteres).');
    handover.items.push({ level: level, section: 'Observaciones del turno', title: title, detail: detail || null, manual: true });
    commit('Nota agregada a la entrega.');
  };

  ACTIONS['add-comment'] = function (args) {
    const parts = args.split('|');
    const collection = parts[0] === 'entry' ? state.entries : state.tasks;
    const item = collection.find((x) => x.id === parts[1]);
    const box = document.getElementById('comment-body');
    const body = ((box || {}).value || '').trim();
    if (!body) return fail('El comentario no puede estar vacío.');
    item.comments.push({ id: 'c' + (++seq), authorId: state.currentUserId, body: body, at: new Date().toISOString() });
    pushAudit('COMENTAR', parts[0] === 'entry' ? 'Registro' : 'Tarea', 'Comentario de ' + me().name);
    save();
    if (parts[0] === 'entry') openEntrySheet(parts[1]); else openTaskSheet(parts[1]);
    render();
    toast('Comentario publicado.', 'ok');
  };

  ACTIONS['entry-status'] = function (args) {
    const parts = args.split('|');
    const entry = state.entries.find((e) => e.id === parts[0]);
    const next = parts[1];
    const closing = next === 'CERRADO' || next === 'RESUELTO';
    const reopening = (entry.status === 'CERRADO' || entry.status === 'RESUELTO') && ENTRY_OPEN.indexOf(next) >= 0;

    if (closing && !can('entry.close') && !can('incident.close')) return fail('Tu rol no tiene permiso para cerrar registros.');
    if (reopening && !can('entry.reopen')) return fail('Tu rol no tiene el permiso entry.reopen. Un supervisor puede reabrirlo.');

    if (closing && next === 'CERRADO') {
      if (entry.type === 'INCIDENCIA' && !entry.resolution) {
        return fail('Para cerrar una incidencia debes registrar cómo se resolvió.');
      }
      const openFollowups = state.followups.filter((f) => f.entryId === entry.id && (f.status === 'PENDIENTE' || f.status === 'VENCIDO'));
      if (openFollowups.length > 0) return fail('No puedes cerrar el registro: tiene ' + openFollowups.length + ' seguimiento(s) sin cerrar.');
    }

    entry.status = next;
    entry.closedAt = next === 'CERRADO' ? new Date().toISOString() : null;
    entry.history.push({ at: new Date().toISOString(), action: next === 'CERRADO' ? 'CERRAR' : reopening ? 'REABRIR' : 'CAMBIO_ESTADO', actor: state.currentUserId, summary: 'Estado: ' + ENTRY_STATUS[next] });
    pushAudit(next === 'CERRADO' ? 'CERRAR' : 'CAMBIO_ESTADO', 'Registro', 'Registro #' + entry.seq + ' → ' + ENTRY_STATUS[next]);
    runAlertEngine();
    save();
    openEntrySheet(entry.id);
    render();
    toast('Registro #' + entry.seq + ': ' + ENTRY_STATUS[next].toLowerCase() + '.', 'ok');
  };

  ACTIONS['resolve-entry'] = function (id) {
    const entry = state.entries.find((e) => e.id === id);
    openSheet('Cerrar ' + (entry.type === 'INCIDENCIA' ? 'incidencia' : 'registro') + ' #' + entry.seq,
      '<div class="form-grid">' +
      '<p class="meta">' + esc(entry.title) + '</p>' +
      '<input type="hidden" id="f-id" value="' + esc(id) + '">' +
      (entry.type === 'INCIDENCIA' ? '<label class="field"><span class="field-label">Causa</span><textarea id="f-cause" placeholder="Por qué ocurrió. Ayuda a evitar que se repita.">' + esc(entry.rootCause || '') + '</textarea></label>' : '') +
      '<label class="field"><span class="field-label">Resolución' + (entry.type === 'INCIDENCIA' ? ' (obligatoria)' : '') + '</span><textarea id="f-resolution" placeholder="Cómo se resolvió.">' + esc(entry.resolution || '') + '</textarea></label>' +
      '<div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn btn-quiet" type="button" data-act="close-modal">Cancelar</button>' +
      '<button class="btn btn-gold" type="button" data-act="submit-resolve">Cerrar registro</button></div>' +
      '</div>');
  };

  ACTIONS['submit-resolve'] = function () {
    const id = (document.getElementById('f-id') || {}).value;
    const entry = state.entries.find((e) => e.id === id);
    const resolution = ((document.getElementById('f-resolution') || {}).value || '').trim();
    const cause = ((document.getElementById('f-cause') || {}).value || '').trim();
    if (entry.type === 'INCIDENCIA' && !resolution) return fail('Para cerrar una incidencia debes registrar cómo se resolvió.');
    entry.resolution = resolution || entry.resolution;
    entry.rootCause = cause || entry.rootCause;
    closeSheet();
    ACTIONS['entry-status'](id + '|CERRADO');
  };

  // ------------------------------- Hojas de detalle -----------------------
  const initials = (name) => name.split(' ').filter(Boolean).slice(0, 2).map((p) => p[0].toUpperCase()).join('');

  function commentsBlock(kind, item) {
    return '<h3 style="margin-top:18px">Comentarios <span class="muted num">' + item.comments.length + '</span></h3>' +
      (item.comments.length === 0 ? '<p class="meta" style="margin-top:6px">Sin comentarios. Usa este espacio para coordinar entre turnos.</p>' : '') +
      item.comments.map(function (c) {
        return '<div class="comment"><span class="avatar">' + esc(initials(userName(c.authorId))) + '</span>' +
          '<div><div class="timeline-head"><strong style="font-size:13px">' + esc(userName(c.authorId)) + '</strong>' +
          '<span class="meta num">' + fmtDT(c.at) + '</span></div>' +
          '<p class="prose" style="margin-top:2px;color:var(--ink)">' + esc(c.body) + '</p></div></div>';
      }).join('') +
      '<div style="margin-top:10px;display:flex;flex-direction:column;gap:7px">' +
      '<textarea id="comment-body" placeholder="Escribe un comentario para el equipo…" aria-label="Nuevo comentario"></textarea>' +
      '<div style="display:flex;justify-content:flex-end"><button class="btn btn-quiet btn-sm" type="button" data-act="add-comment" data-args="' + kind + '|' + item.id + '">Comentar</button></div>' +
      '</div>';
  }

  function timelineBlock(history, extra) {
    const events = history.slice();
    (extra || []).forEach((e) => events.push(e));
    events.sort((a, b) => new Date(a.at) - new Date(b.at));
    return '<h3 style="margin-top:18px">Historial <span class="muted num">' + events.length + '</span></h3>' +
      '<ol class="timeline" style="margin-top:8px">' + events.map(function (e) {
        return '<li data-kind="' + (e.kind || 'auditoria') + '">' +
          '<div class="timeline-head"><span class="timeline-action">' + esc(AUDIT_LABEL[e.action] || e.action || 'Evento') + '</span>' +
          '<span class="meta num">' + fmtDT(e.at) + '</span>' +
          '<span class="meta">· ' + esc(userName(e.actor)) + '</span></div>' +
          '<p style="margin:2px 0 0;font-size:13px">' + esc(e.summary) + '</p></li>';
      }).join('') + '</ol>';
  }

  function openEntrySheet(id) {
    const e = state.entries.find((x) => x.id === id);
    if (!e) return;
    const open = ENTRY_OPEN.indexOf(e.status) >= 0;
    const overdue = isOverdue(e.dueAt, open);
    const guest = state.guests.find((g) => g.id === e.guestId);
    const reservation = state.reservations.find((r) => r.id === e.reservationId);
    const tasks = state.tasks.filter((t) => t.entryId === e.id && !t.deleted);
    const followups = state.followups.filter((f) => f.entryId === e.id);

    const body =
      '<div class="row-tags" style="margin-bottom:8px">' +
        '<span class="ref">#' + e.seq + '</span>' + chip(ENTRY_TYPE[e.type]) +
        badge(ENTRY_TONE[e.status], ENTRY_STATUS[e.status]) +
        badge(PRIORITY_TONE[e.priority], 'Prioridad ' + PRIORITY[e.priority]) +
        (e.severity ? badge(SEVERITY_TONE[e.severity], 'Gravedad ' + PRIORITY[e.severity]) : '') +
        (overdue ? badge('critico', 'Vencido') : '') +
        (e.followUp ? chip('Con seguimiento') : '') +
      '</div>' +
      '<p class="prose" style="color:var(--ink);font-size:14.5px;line-height:1.55">' + esc(e.description) + '</p>' +
      '<dl class="facts" style="margin-top:14px">' +
        '<div><dt>Registró</dt><dd>' + esc(userName(e.createdBy)) + ' · <span class="num">' + fmtDT(e.occurredAt) + '</span></dd></div>' +
        '<div><dt>Responsable</dt><dd>' + esc(e.ownerId ? userName(e.ownerId) : 'Sin asignar') + '</dd></div>' +
        '<div><dt>Área</dt><dd>' + esc(e.department || 'Sin área') + '</dd></div>' +
        '<div><dt>Vencimiento</dt><dd' + (overdue ? ' style="color:var(--critico);font-weight:600"' : '') + '>' + (e.dueAt ? '<span class="num">' + fmtDT(e.dueAt) + '</span> (' + relative(e.dueAt) + ')' : 'Sin vencimiento') + '</dd></div>' +
        (e.severity ? '<div><dt>Impacto</dt><dd>' + esc(IMPACT[e.impact] || 'No registrado') + '</dd></div>' : '') +
        (e.immediateAction ? '<div><dt>Acción inmediata</dt><dd>' + esc(e.immediateAction) + '</dd></div>' : '') +
        (e.rootCause ? '<div><dt>Causa</dt><dd>' + esc(e.rootCause) + '</dd></div>' : '') +
        (e.resolution ? '<div><dt>Resolución</dt><dd>' + esc(e.resolution) + '</dd></div>' : '') +
        (guest ? '<div><dt>Huésped</dt><dd>' + esc(guest.name) + (guest.room ? ' · hab. ' + esc(guest.room) : '') + (guest.vip ? ' · VIP' : '') + '</dd></div>' : '') +
        (reservation ? '<div><dt>Reserva</dt><dd><span class="num">' + esc(reservation.code) + '</span> · ' + esc(reservation.status) + '</dd></div>' : '') +
      '</dl>' +
      (e.tags.length ? '<div class="row-tags" style="margin-top:12px">' + e.tags.map((t) => chip('#' + t)).join('') + '</div>' : '') +

      '<div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:16px">' +
        (open && can('entry.close') ? '<button class="btn btn-gold btn-sm" type="button" data-act="resolve-entry" data-args="' + e.id + '">Cerrar registro</button>' : '') +
        (open && e.status !== 'EN_CURSO' && can('entry.edit') ? '<button class="btn btn-quiet btn-sm" type="button" data-act="entry-status" data-args="' + e.id + '|EN_CURSO">Marcar en curso</button>' : '') +
        (!open ? '<button class="btn btn-quiet btn-sm" type="button" data-act="entry-status" data-args="' + e.id + '|EN_CURSO">Reabrir</button>' : '') +
        (can('task.create') ? '<button class="btn btn-quiet btn-sm" type="button" data-act="new-task" data-args="' + e.id + '">Crear tarea</button>' : '') +
        (can('followup.create') ? '<button class="btn btn-quiet btn-sm" type="button" data-act="new-followup" data-args="' + e.id + '">Registrar seguimiento</button>' : '') +
      '</div>' +

      (followups.length ? '<h3 style="margin-top:18px">Seguimientos <span class="muted num">' + followups.length + '</span></h3>' +
        followups.map(function (f) {
          return '<div style="padding:9px 0;border-bottom:1px solid var(--line-soft)">' +
            badge(FU_TONE[f.status], FU_STATUS[f.status]) +
            '<p style="margin:5px 0 0;font-size:13.5px;font-weight:500">' + esc(f.action) + '</p>' +
            (f.result ? '<p class="meta" style="margin-top:2px">Resultado: ' + esc(f.result) + '</p>' : '') +
            (f.nextAction ? '<p class="meta" style="margin-top:2px">Próxima acción: ' + esc(f.nextAction) + '</p>' : '') +
            (f.scheduledAt ? '<p class="meta" style="margin-top:2px">Programado <span class="num">' + fmtDT(f.scheduledAt) + '</span> (' + relative(f.scheduledAt) + ')</p>' : '') +
            '</div>';
        }).join('') : '') +

      (tasks.length ? '<h3 style="margin-top:18px">Tareas derivadas <span class="muted num">' + tasks.length + '</span></h3>' +
        tasks.map(function (t) {
          return '<button class="row" type="button" data-act="open-task" data-args="' + t.id + '" style="padding-inline:0">' +
            '<span class="row-bar" style="background:var(--' + TASK_TONE[t.status] + '-mark)"></span>' +
            '<span class="row-body"><span class="row-tags"><span class="ref">T#' + t.seq + '</span>' + badge(TASK_TONE[t.status], TASK_STATUS[t.status]) + '</span>' +
            '<span class="row-title" style="display:block">' + esc(t.title) + '</span></span></button>';
        }).join('') : '') +

      commentsBlock('entry', e) +
      timelineBlock(e.history, e.comments.map((c) => ({ at: c.at, action: 'COMENTAR', actor: c.authorId, summary: c.body, kind: 'comentario' }))
        .concat(followups.map((f) => ({ at: f.createdAt, action: 'SEGUIMIENTO', actor: f.createdBy, summary: f.action, kind: 'seguimiento' }))));

    openSheet(e.title, body);
  }

  function openTaskSheet(id) {
    const t = state.tasks.find((x) => x.id === id);
    if (!t) return;
    const open = TASK_OPEN.indexOf(t.status) >= 0;
    const overdue = isOverdue(t.dueAt, open);
    const entry = state.entries.find((e) => e.id === t.entryId);
    const done = t.checklist.filter((c) => c.done).length;

    const body =
      '<div class="row-tags" style="margin-bottom:8px">' +
        '<span class="ref">T#' + t.seq + '</span>' +
        badge(overdue ? 'critico' : TASK_TONE[t.status], overdue ? 'Vencida' : TASK_STATUS[t.status]) +
        badge(PRIORITY_TONE[t.priority], 'Prioridad ' + PRIORITY[t.priority]) +
        chip('Origen: ' + TASK_ORIGIN[t.origin]) +
      '</div>' +
      (t.description ? '<p class="prose" style="color:var(--ink);font-size:14.5px">' + esc(t.description) + '</p>' : '') +
      (t.blockedReason ? '<p style="margin-top:10px;padding:9px 11px;border-radius:7px;background:var(--atencion-bg);color:var(--atencion);font-size:13px">Bloqueada: ' + esc(t.blockedReason) + '</p>' : '') +
      '<dl class="facts" style="margin-top:14px">' +
        '<div><dt>Asignada a</dt><dd>' + esc(t.assigneeId ? userName(t.assigneeId) : 'Sin asignar') + '</dd></div>' +
        '<div><dt>Creada por</dt><dd>' + esc(userName(t.createdBy)) + ' · <span class="num">' + fmtDT(t.createdAt) + '</span></dd></div>' +
        '<div><dt>Área</dt><dd>' + esc(t.department || 'Sin área') + '</dd></div>' +
        '<div><dt>Fecha límite</dt><dd' + (overdue ? ' style="color:var(--critico);font-weight:600"' : '') + '>' + (t.dueAt ? '<span class="num">' + fmtDT(t.dueAt) + '</span> (' + relative(t.dueAt) + ')' : 'Sin fecha límite') + '</dd></div>' +
        (entry ? '<div><dt>Registro origen</dt><dd>#' + entry.seq + ' ' + esc(entry.title) + '</dd></div>' : '') +
        (t.completedAt ? '<div><dt>Completada</dt><dd><span class="num">' + fmtDT(t.completedAt) + '</span></dd></div>' : '') +
      '</dl>' +

      '<div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:16px">' +
        (t.status === 'PENDIENTE' ? '<button class="btn btn-quiet btn-sm" type="button" data-act="task-status" data-args="' + t.id + '|EN_CURSO">Tomar tarea</button>' : '') +
        (open && can('task.close') ? '<button class="btn btn-gold btn-sm" type="button" data-act="task-status" data-args="' + t.id + '|COMPLETADA">Completar</button>' : '') +
        (open ? '<button class="btn btn-quiet btn-sm" type="button" data-act="task-status" data-args="' + t.id + '|BLOQUEADA">Bloquear</button>' : '') +
        (t.status === 'COMPLETADA' ? '<button class="btn btn-quiet btn-sm" type="button" data-act="task-status" data-args="' + t.id + '|EN_CURSO">Reabrir</button>' : '') +
        (can('followup.create') && entry ? '<button class="btn btn-quiet btn-sm" type="button" data-act="new-followup" data-args="' + entry.id + '">Registrar seguimiento</button>' : '') +
      '</div>' +

      (t.checklist.length ? '<h3 style="margin-top:18px">Checklist <span class="muted num">' + done + '/' + t.checklist.length + '</span></h3>' +
        '<ul class="checklist" style="margin-top:6px">' + t.checklist.map(function (c) {
          return '<li><button type="button" data-done="' + c.done + '" data-act="toggle-check" data-args="' + t.id + '|' + c.id + '">' +
            '<span class="checkmark" aria-hidden="true">✓</span><span class="check-text">' + esc(c.text) + '</span>' +
            '<span class="sr-only" style="position:absolute;left:-9999px">' + (c.done ? 'Desmarcar' : 'Marcar como hecho') + '</span></button></li>';
        }).join('') + '</ul>' : '') +

      commentsBlock('task', t) +
      timelineBlock(t.history, t.comments.map((c) => ({ at: c.at, action: 'COMENTAR', actor: c.authorId, summary: c.body, kind: 'comentario' })));

    openSheet(t.title, body);
  }

  // --------------------------------- Vistas -------------------------------
  const panel = (title, count, bodyHtml, extraHead, className) =>
    '<section class="panel' + (className ? ' ' + className : '') + '">' +
    '<div class="panel-head"><h2>' + esc(title) + '</h2>' +
    (count != null ? '<span class="count">' + count + '</span>' : '') +
    (extraHead || '') + '</div>' + bodyHtml + '</section>';

  const emptyState = (message, hint) => '<div class="empty"><strong>' + esc(message) + '</strong>' + (hint ? esc(hint) : '') + '</div>';

  const tile = (label, value, hint, tone) =>
    '<div class="tile"' + (tone === 'alert' ? ' data-alert="true"' : tone === 'good' ? ' data-good="true"' : '') + '>' +
    '<p class="tile-label">' + esc(label) + '</p><p class="tile-value">' + esc(String(value)) + '</p>' +
    (hint ? '<p class="tile-hint">' + esc(hint) + '</p>' : '') + '</div>';

  function entryRow(e) {
    const open = ENTRY_OPEN.indexOf(e.status) >= 0;
    const overdue = isOverdue(e.dueAt, open);
    const guest = state.guests.find((g) => g.id === e.guestId);
    return '<li><button class="row" type="button" data-act="open-entry" data-args="' + e.id + '">' +
      '<span class="row-bar" style="background:var(--' + (overdue ? 'critico' : ENTRY_TONE[e.status]) + '-mark)"></span>' +
      '<span class="row-body">' +
      '<span class="row-tags"><span class="ref">#' + e.seq + '</span>' + chip(ENTRY_TYPE[e.type]) +
      badge(ENTRY_TONE[e.status], ENTRY_STATUS[e.status]) +
      badge(PRIORITY_TONE[e.priority], PRIORITY[e.priority]) +
      (overdue ? badge('critico', 'Vencido') : '') + '</span>' +
      '<span class="row-title" style="display:block">' + esc(e.title) + '</span>' +
      '<span class="row-text" style="display:block">' + esc(e.description) + '</span>' +
      '<span class="row-meta">' +
      '<span class="num">' + fmtDT(e.occurredAt) + '</span>' +
      '<span>' + esc(e.ownerId ? 'Resp.: ' + userName(e.ownerId) : 'Sin responsable') + '</span>' +
      (e.department ? '<span>' + esc(e.department) + '</span>' : '') +
      (guest ? '<span>' + esc(guest.name + (guest.room ? ' · hab. ' + guest.room : '')) + '</span>' : '') +
      (e.dueAt ? '<span' + (overdue ? ' style="color:var(--critico);font-weight:600"' : '') + '>Vence ' + relative(e.dueAt) + '</span>' : '') +
      (e.followUp ? '<span>Con seguimiento</span>' : '') +
      (e.comments.length ? '<span>' + e.comments.length + ' comentarios</span>' : '') +
      '</span></span></button></li>';
  }

  function taskRow(t, showActions) {
    const open = TASK_OPEN.indexOf(t.status) >= 0;
    const overdue = isOverdue(t.dueAt, open);
    const done = t.checklist.filter((c) => c.done).length;
    return '<li><button class="row" type="button" data-act="open-task" data-args="' + t.id + '">' +
      '<span class="row-bar" style="background:var(--' + (overdue ? 'critico' : TASK_TONE[t.status]) + '-mark)"></span>' +
      '<span class="row-body">' +
